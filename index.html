  // ---- what is being worked on ----
  // A task comes from the journal the agent keeps for the next agent. The page takes two things from it: the
  // few lines the agent wrote there for people (its name, where it stands, what waits on the reader), and
  // where its work landed, which is measured from commits and uncommitted changes, not written by anyone.
  function taskRooms(t){ // committed and uncommitted work together, one row per part, in the order of the plan
    var n={},files={};
    t.parts.concat(t.pending).forEach(function(x){n[x.name]=(n[x.name]||0)+x.n;files[x.name]=(files[x.name]||[]).concat(x.files||[]);});
    var names=D.parts.map(function(p){return p.name;}).filter(function(k){return k in n;});
    Object.keys(n).forEach(function(k){if(names.indexOf(k)<0)names.push(k);});
    return names.map(function(k){return {name:k,n:n[k],files:files[k]};});
  }
  function taskWhen(t){var d=t.old?t.updated:t.updated.slice(5);return t.finished?f(T.tDone,{d:d}):t.days>=14?f(T.tStale,{d:d,n:t.days}):f(T.tUpdated,{d:d});}
  function hasMade(t){return t.made.length||t.try||t.left.length||t.marks.length;}
  // A finished task's lines describe the code as it was when they were written. Whether it has moved on is
  // measured: later commits, and uncommitted work, in the files the task itself changed.
  function moved(t){return t.finished&&((t.after||0)>0||(t.touched||0)>0);}
  function movedBlock(t){if(!moved(t))return '';
    return '<div class="blk"><div class="aged much">'+ic('sign')+'<span>'+[t.after?f(T.tAfter,{d:t.updated,n:t.after}):'',t.touched?f(T.tTouched,{n:t.touched}):''].filter(function(x){return x;}).join(' ')+'</span></div>'+
      '<div class="ask">'+T.tAskFresh+'<span class="say">'+esc(f(T.tSayFresh,{n:t.name}))+'</span></div></div>';}
  // How the task got here, from the history of its record: finished, opened again, finished again.
  function storyBlock(t){var st=t.story||[];if(st.length<2)return '';
    return '<div class="blk"><h3>'+T.tStory+'</h3><div class="story">'+st.map(function(r,i){
      var word=r.done?(i&&st[i-1].done?T.sMore:T.sDone):(i&&st[i-1].done?T.sAgain:r.made?T.sStep:T.sOpen);
      return '<span class="sd">'+esc(r.date)+'</span><span class="mk-b'+(r.done?'':i&&st[i-1].done?' chg':' off')+'">'+word+'</span><span>'+esc(r.made||'')+'</span>';}).join('')+'</div></div>';}
  function madeBlock(t){ // what the last finished step came to, in the agent's words for people
    var cells=[[T.tMade,t.made],[T.tTry,t.try?[t.try]:[]],[T.tLeft,t.left]].filter(function(c){return c[1].length;});
    return cells.length?'<div class="three">'+cells.map(function(c){return '<div><h3>'+c[0]+'</h3>'+c[1].map(function(x){return '<p>'+esc(x)+'</p>';}).join('')+'</div>';}).join('')+'</div>':'';
  }
  function marksBlock(t){ // each part the marks name: its own flow diagram with the new and changed boxes marked
    taskFlows=[];if(!t.marks.length)return '';
    var order=[],by={};
    t.marks.forEach(function(m){var k=m.unit||m.room||m.part;if(!by[k]){by[k]=[];order.push(k);}by[k].push(m);});
    var h='<div class="blk"><h3>'+T.tChg+'</h3>';
    order.forEach(function(k,gi){
      var list=by[k],u=unitNamed(k),top=u?(u.parent||u.name):null,kind={},drawn=u&&u.flow&&u.flow.nodes.length;
      list.forEach(function(m){if(m.box&&m.kind!=='gone'&&m.drawn)kind[m.box]=m.kind;});
      h+='<div class="blk"><div class="chgh">'+(top?'<button type="button" class="crumb" data-go="'+esc(top)+'">'+esc(k)+'</button>':'<b>'+esc(k)+'</b>')+'</div>';
      if(drawn&&Object.keys(kind).length){
        var base=linkOpt(u.name),id='tflow-'+gi;
        taskFlows.push({id:id,flow:u.flow,opt:{cls:base.cls,icon:base.icon,attr:base.attr,dash:base.dash,mark:function(n){return kind[n.name]||'';}}});
        h+='<div class="canvas" id="'+id+'"></div><div class="mkey"><span class="mk-b">'+T.mNew+'</span><span class="mk-b chg">'+T.mChg+'</span><span class="mk-b gone">'+T.mGone+'</span><span>'+T.mSame+'</span></div>';
      }else if(u&&!drawn)h+='<p class="sub">'+T.mNoFlow+'</p>';
      h+='<ul class="chgs">'+list.map(function(m){
        var miss=m.box&&m.kind!=='gone'&&!m.drawn&&drawn;
        return '<li class="'+m.kind+'"><span class="mk-b '+m.kind+'">'+(m.kind==='new'?T.mNew:m.kind==='chg'?T.mChg:T.mGone)+'</span>'+(m.box?'<b>'+esc(m.box)+'</b>':'')+
          (m.text?'<span class="tx">'+esc(m.text)+'</span>':'')+(miss?'<span class="tx sub">'+T.mNoBox+'</span>':'')+'</li>';}).join('')+'</ul></div>';
    });
    return h+'<div class="fkey">'+T.tChgNote+'</div></div>';
  }
  function taskWins(t){return t.wins.map(winByKey).filter(function(w){return w;});}
  function selectTask(i){
    var t=TASKS[i],list=taskRooms(t),map={},wins=taskWins(t);
    unselRows();setHash('t'+i);curFlow=null;curPart=null;curInner=null;curTask=i;$('task-'+i).setAttribute('aria-pressed','true');
    unpick();
    list.forEach(function(x){if(byName[x.name])map[x.name]=x.n;});
    light(map,null,wins.length?wins:null);
    var h='<div class="band"><h2>'+esc(t.name)+'</h2><span class="meta">'+esc(taskWhen(t))+'</span>'+backBtn()+'</div><div class="body">';
    if(t.plain){
      h+='<p class="tline">'+esc(t.now)+'</p>';
      if(t.needs.length)h+='<div class="blk"><h3>'+T.tNeeds+'</h3><div class="signs">'+t.needs.map(function(x){return '<div class="sign">'+ic('user')+'<span>'+esc(x)+'</span></div>';}).join('')+'</div></div>';
      if(t.next)h+='<div class="blk"><h3>'+T.tNext+'</h3><p>'+esc(t.next)+'</p></div>';
    }else if(!hasMade(t))h+='<div class="empty">'+T.tBareLong+'</div>';
    h+=madeBlock(t)+movedBlock(t)+storyBlock(t);
    if(wins.length)h+='<div class="nowby">'+wins.map(function(w){return wb(w)+'<span>'+esc(winName(w))+'</span>';}).join('')+'<span class="sub">'+T.tWin+'</span></div>';
    h+='<div class="blk"><h3>'+T.tRooms+'</h3>'+(list.length?stackBar(list)+legend(list):'<p class="sub">'+T.tNoRooms+'</p>')+'</div>';
    h+=marksBlock(t);
    if(t.finished){if(!hasMade(t))h+='<div class="ask">'+T.tAskMade+'<span class="say">'+esc(f(T.tSayMade,{n:t.name}))+'</span></div>';}
    else h+='<div class="ask">'+(t.plain?T.tAsk:T.tAskBare)+'<span class="say">'+esc(f(t.plain?T.tSay:T.tSayBare,{n:t.name}))+'</span></div>';
    setStage(h+'</div>');drawTaskFlows();
  }
  if(TASKS.length||D.tasksOld){
    var older=TASKS.filter(function(t){return t.old;}).length,fin=TASKS.filter(function(t){return t.finished&&!t.old;}).length,doing=TASKS.length-fin-older;
    $('tasks').hidden=false;$('tasksh').textContent=fin?(doing?T.tasksH2:T.tasksH3):(doing||!older?T.tasksH:T.tOlderH);
    if(older){$('tolder').hidden=false;$('tolder').open=!fin&&!doing;$('tolders').textContent=f(T.tOlder,{n:older});}
    var waitingOn=TASKS.filter(function(t){return t.needs.length&&!t.finished;}).length;
    $('tasksm').textContent=[doing?f(T.tasksN,{n:doing}):'',waitingOn?f(T.tasksWait,{k:waitingOn}):'',fin&&doing?f(T.tasksFin,{k:fin}):''].filter(function(x){return x;}).join(T.sep);
    TASKS.forEach(function(t,i){
      var b=document.createElement('button');b.type='button';b.className='tcard';b.id='task-'+i;b.setAttribute('aria-pressed','false');
      var rooms=taskRooms(t).filter(function(x){return byName[x.name];}).sort(function(x,y){return y.n-x.n;}).slice(0,6);
      b.innerHTML='<span class="tt"><span class="tn">'+esc(t.name)+'</span>'+(t.finished?'<span class="flag fin">'+(t.times>1?f(T.timesFlag,{n:t.times}):T.finFlag)+'</span>':t.needs.length?'<span class="flag me">'+f(T.needsFlag,{n:t.needs.length})+'</span>':'')+
        (t.again?'<span class="flag">'+T.againFlag+'</span>':'')+(moved(t)?'<span class="flag">'+T.afterFlag+'</span>':'')+'</span>'+
        '<span class="tnow'+(t.plain||t.made.length?'':' none')+'">'+esc(t.finished&&t.made.length?t.made[0]:t.plain?t.now:t.made.length?t.made[0]:T.tBare)+'</span><span class="tf">'+
        (rooms.length?'<span class="tpics">'+rooms.map(function(x){var p=byName[x.name];return '<span class="pic '+p.z+'" title="'+esc(p.name)+'">'+ic(p.icon)+'</span>';}).join('')+'</span>':'')+
        taskWins(t).map(function(w){return wb(w);}).join('')+'<span>'+esc(taskWhen(t))+'</span></span>';
      b.addEventListener('click',function(){if(curTask===i)home();else selectTask(i);});
      $(t.old?'tcards2':'tcards').appendChild(b);});
    if(D.tasksOld){$('taskso').hidden=false;$('taskso').textContent=f(T.tasksOld,{n:D.tasksOld});}
  }

  // ---- what changed lately ----
  // For a reader who comes back after a while. Everything in it is measured: the list against its own earlier
  // version, the tasks against their histories, the commits counted. The stretch it opens on is the shortest
  // one that reaches back to the reader's last visit, which this browser remembers.
  var LATELY=D.lately||[],curSpan=Math.min(1,LATELY.length-1),seenDays=null;
  try{var key='bearings.seen.'+D.project,prev=+localStorage.getItem(key);
    if(prev){seenDays=Math.floor((Date.now()-prev)/86400000);
      for(var si=0;si<LATELY.length;si++){curSpan=si;if(LATELY[si].days>=Math.max(1,seenDays))break;}}
    localStorage.setItem(key,String(Date.now()));}catch(e){}
  // a first-time reader, or a page that was published and left: open on a stretch that has something in it
  function nothingIn(c){return !(c.added.length||c.removed.length||c.redrawn.length||c.tasks.length||c.commits);}
  if(seenDays===null)while(curSpan<LATELY.length-1&&nothingIn(LATELY[curSpan]))curSpan++;
  function drawSince(){
    var c=LATELY[curSpan],h='',any=false;
    function row(title,inner){any=true;h+='<span class="iot">'+title+'</span><div class="pals">'+inner+'</div>';}
    function chip(u,id,name,note,cnt){var tail=(note?'<span class="pl">'+esc(note)+'</span>':'')+(cnt?'<span class="cnt">'+cnt+'</span>':'');
      return u?'<button type="button" class="pchip '+u.z+'" data-to="'+esc(id)+'">'+pic(u.icon)+'<span>'+esc(name)+'</span>'+tail+'</button>'
        :'<span class="pchip plain"><span>'+esc(name)+'</span>'+tail+'</span>';}
    if(c.base==='new')h+='<p class="sub wide">'+T.sListNew+'</p>';
    else if(c.base==='short')h+='<p class="sub wide">'+T.sListNone+'</p>';
    if(c.added.length)row(T.sAdded,c.added.map(function(x){return chip(byId(x.to),x.to,x.name);}).join(''));
    if(c.removed.length)row(T.sRemoved,c.removed.map(function(x){return chip(null,'',x.name);}).join(''));
    if(c.redrawn.length)row(T.sRedrawn,c.redrawn.map(function(x){
      var name=x.kind==='frame'?T.frameName:x.name,note=x.first?T.sFirst:(x.plus&&x.minus?f(T.sBoxes,{a:x.plus,b:x.minus}):x.plus?f(T.sBoxPlus,{a:x.plus}):x.minus?f(T.sBoxMinus,{b:x.minus}):T.sArrows);
      return chip(byId(x.to),x.to,name,(x.kind==='route'?T.sRoute+T.sep:'')+note);}).join(''));
    if(c.tasks.length)row(T.sTasks,c.tasks.map(function(x){var t=TASKS[x.i];if(!t)return '';
      return '<button type="button" class="pchip plain" style="cursor:pointer" data-task="'+x.i+'"><span>'+esc(t.name)+'</span><span class="pl">'+{done:T.sTDone,again:T.sTAgain,more:T.sTMore,'new':T.sTNew,step:T.sTStep}[x.what]+'</span></button>';}).join(''));
    if(!any&&(c.base==='git'||c.base==='local'))h+='<p class="sub wide">'+T.sNothing+'</p>';
    if(c.busy.length)row(T.sBusy,c.busy.map(function(x){var u=byName[x.name];return chip(u,u?'p'+D.parts.indexOf(u):'',x.name,'',x.n);}).join(''));
    // not a change, but what a returning reader should not trust blindly: write-ups and diagrams the code has left behind
    var watch=TASKS.map(function(t,i){return moved(t)?'<button type="button" class="pchip plain" style="cursor:pointer" data-task="'+i+'"><span>'+esc(t.name)+'</span><span class="pl">'+T.afterFlag+'</span></button>':'';}).join('');
    D.parts.forEach(function(p,i){[p].concat(p.subs).forEach(function(u,k){if(u.flow&&u.since>=8)watch+=chip(u,k?'p'+i+'.'+(k-1):'p'+i,u.name,T.sOld);});});
    if(watch)row(T.sWatch,watch);
    $('sinceb').innerHTML=h||'<p class="sub wide">'+T.sQuiet+'</p>';
    $('sincem').textContent=f(T.sMeta,{d:c.since.slice(5),n:c.commits})+(c.base==='local'?' '+T.sLocal:'')+(c.short?' '+T.sShort:'')+(seenDays>=1?' '+f(T.sSeen,{n:seenDays}):'');
    wire($('sinceb'));
    Array.prototype.forEach.call($('sinceb').querySelectorAll('[data-task]'),function(b){b.addEventListener('click',function(){selectTask(+b.getAttribute('data-task'));});});
  }
  if(LATELY.some(function(c){return c.added.length||c.removed.length||c.redrawn.length||c.tasks.length||c.commits;})){
    $('since').hidden=false;$('sinceh').textContent=T.sinceH;
    LATELY.forEach(function(c,i){var b=document.createElement('button');b.type='button';b.textContent=f(T.sDays,{n:c.days});b.setAttribute('aria-pressed',String(i===curSpan));
      b.addEventListener('click',function(){curSpan=i;Array.prototype.forEach.call($('sinceseg').children,function(x){x.setAttribute('aria-pressed',String(x===b));});drawSince();});
      $('sinceseg').appendChild(b);});
    drawSince();
  }

  // ---- footprints ----
  $('workh').textContent=T.work;
  var wide=true;
  function strip(cells){var h='<span class="foot">',last=null;
    D.parts.forEach(function(p){if(last!==null&&last!==p.group)h+='<span class="gap"></span>';last=p.group;h+=cells(p);});return h+'</span>';}
  function drawWork(){
    var tb=$('table');tb.innerHTML='';
    var head=document.createElement('div');head.className='thead';
    head.innerHTML='<span></span>'+strip(function(p){return '<span class="cell '+p.z+'" title="'+esc(p.name)+'">'+ic(p.icon)+'</span>';})+'<span></span>';
    tb.appendChild(head);
    var list=D.commits.filter(function(c){return !wide||c.parts.length>=2;}).slice(0,12);
    if(!list.length){var e=document.createElement('p');e.className='sub';e.style.padding='10px';e.textContent=T.noWork;tb.appendChild(e);return;}
    list.forEach(function(c,i){
      var n={};c.parts.forEach(function(x){n[x.name]=x.n;});
      var r=document.createElement('button');r.type='button';r.className='trow';r.id='work-'+i;
      r.innerHTML='<span class="d">'+c.date.slice(5)+'</span>'+strip(function(p){return '<span class="cell '+p.z+(n[p.name]?' t'+(n[p.name]===1?' one':''):'')+'" title="'+esc(p.name)+(n[p.name]?' '+n[p.name]:'')+'"></span>';})+'<span class="s">'+esc(c.subject)+'</span>';
      r.addEventListener('click',function(){selectWork(c,r);});
      tb.appendChild(r);
    });
  }
  [['wide',true],['all',false]].forEach(function(o){
    var b=document.createElement('button');b.type='button';b.id='seg-'+o[0];b.textContent=T[o[0]];b.setAttribute('aria-pressed',String(o[1]===wide));
    b.addEventListener('click',function(){wide=o[1];Array.prototype.forEach.call($('seg').children,function(x){x.setAttribute('aria-pressed',String(x===b));});drawWork();});
    $('seg').appendChild(b);
  });
  drawWork();
  var m=/^#p(\d+)(?:\.(\d+))?$/.exec(location.hash||''),hp=m&&D.parts[+m[1]];
  var mt=/^#t(\d+)$/.exec(location.hash||''),mw=/^#w(\d+)$/.exec(location.hash||''),mc=/^#c(\d+)(?:n(\d+))?$/.exec(location.hash||'');
  if(mc&&CHAINS[+mc[1]]){curChain=+mc[1];view='calls';if(mc[2]!=null){var st=CHAINS[curChain].steps[+mc[2]];
    if(st&&st.kind==='fn'){curFn=+mc[2];(picked[curChain]=picked[curChain]||{});st.cases.forEach(function(a){picked[curChain][CHAINS[curChain].steps[a].group]=a;});}}}
  if(view!=='plan')setView(view);
  if(hp&&m[2]&&hp.subs[+m[2]])selectSub(hp.name,hp.subs[+m[2]].name);else if(hp)selectPart(hp.name);else if(mw&&WINGS[+mw[1]])selectWing(+mw[1]);else if(mt&&TASKS[+mt[1]])selectTask(+mt[1]);else home();
  if(view==='calls'&&mc)setHash('c'+curChain+(curFn!=null?'n'+curFn:''));
  quiet=false;
})();
</script>

</body>

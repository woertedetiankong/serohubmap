<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="margin:0">
<title>servohub 项目地图</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
/* A building guide drawn on drafting paper. The plan is one building with ink walls: wings carry a signage band,
   rooms carry a pictogram. Picking a room opens its sheet below: a signage header and a flow diagram.
   Left aligned throughout. Colour belongs to the wings; ink is for walls and words. */
:root{
  --paper:#f3f5f9; --dot:#cdd4e0; --sheet:#ffffff; --ink:#14213a; --muted:#57627a; --hair:#d3d9e4; --track:#dfe4ec;
  --warn:#c9470f; --on:#ffffff;
  --z0:#1e5bd8; --z0s:#e4edfd;
  --z1:#0a8765; --z1s:#dcf2ea;
  --z2:#d2501a; --z2s:#fce8dc;
  --z3:#7046cc; --z3s:#ebe5fa;
  --z4:#0d7887; --z4s:#dbf1f4;
  --z5:#b02a60; --z5s:#fae4ec;
  --f-text:"Barlow","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-num:"Barlow Condensed","Barlow","Noto Sans SC","PingFang SC",system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0d1422; --dot:#1f2b43; --sheet:#141d30; --ink:#e7ecf6; --muted:#97a3ba; --hair:#2a3651; --track:#27324b;
    --warn:#ff9a5c; --on:#0d1422;
    --z0:#78a2ff; --z0s:#172544; --z1:#55cba7; --z1s:#112e28; --z2:#ff9258; --z2s:#38210f;
    --z3:#b299ff; --z3s:#241d44; --z4:#62c9d6; --z4s:#102c31; --z5:#f28db2; --z5s:#351926; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0d1422; --dot:#1f2b43; --sheet:#141d30; --ink:#e7ecf6; --muted:#97a3ba; --hair:#2a3651; --track:#27324b;
  --warn:#ff9a5c; --on:#0d1422;
  --z0:#78a2ff; --z0s:#172544; --z1:#55cba7; --z1s:#112e28; --z2:#ff9258; --z2s:#38210f;
  --z3:#b299ff; --z3s:#241d44; --z4:#62c9d6; --z4s:#102c31; --z5:#f28db2; --z5s:#351926; color-scheme:dark;
}
*{box-sizing:border-box}
body{background-color:var(--paper);background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);background-size:22px 22px;
  color:var(--ink);font-family:var(--f-text);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:30px 60px}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
svg.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
code{font-family:var(--f-mono);font-size:.82em;background:var(--paper);border:1px solid var(--hair);padding:.05em .36em;border-radius:5px;overflow-wrap:anywhere}
p{margin:0}
.z0{--z:var(--z0);--zs:var(--z0s)} .z1{--z:var(--z1);--zs:var(--z1s)} .z2{--z:var(--z2);--zs:var(--z2s)}
.z3{--z:var(--z3);--zs:var(--z3s)} .z4{--z:var(--z4);--zs:var(--z4s)} .z5{--z:var(--z5);--zs:var(--z5s)}
.zx{--z:var(--muted);--zs:var(--track)} /* changed files that no part owns: they sit in no wing, so they take no wing's colour */
.pic{display:flex;align-items:center;justify-content:center;background:var(--z);color:var(--on);border-radius:8px;flex:none}

/* heading */
.top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 28px;align-items:end}
.title{font-size:clamp(32px,5.2vw,56px);font-weight:900;line-height:1.04;letter-spacing:-.015em;margin:0;overflow-wrap:anywhere}
.stamp{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.sum{font-size:17px;font-weight:500;max-width:38em}
.key{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);align-items:center;justify-content:flex-end}
.key span{display:inline-flex;align-items:center;gap:7px}
.kroom{width:24px;height:16px;border-radius:3px;background:var(--z0)}
.kcare{width:24px;height:16px;border-radius:3px;border:1.5px solid var(--z2);
  background:repeating-linear-gradient(135deg,transparent 0 4px,var(--z2) 4px 5.5px)}
.dots{display:inline-flex;gap:3px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--track)}
.dots i.f{background:currentColor}

/* the building */
.plan{display:grid;gap:3px;background:var(--ink);border:3px solid var(--ink);border-radius:12px;overflow:hidden}
.wing{display:flex;flex-direction:column;gap:2px;background:var(--ink);min-width:0}
.wing h2{margin:0;padding:8px 13px;background:var(--z);color:var(--on);font-size:14.5px;font-weight:700;line-height:1.35}
.rooms{flex:1;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));grid-auto-rows:1fr;gap:2px}
.room{position:relative;border:0;border-radius:0;background-color:var(--zs);padding:12px 12px 11px;min-height:104px;text-align:left;cursor:pointer;
  display:flex;flex-direction:column;gap:8px;min-width:0}
.room.care{background-image:repeating-linear-gradient(135deg,transparent 0 10px,color-mix(in srgb,var(--z) 20%,transparent) 10px 11.5px)}
.room .pic{width:34px;height:34px;font-size:20px}
.room .nm{font-weight:700;font-size:14.5px;line-height:1.3;overflow-wrap:anywhere}
.room .dots{margin-top:auto;color:var(--z)}
.room .lock{position:absolute;right:11px;bottom:10px;font-size:16px;color:var(--z)}
.room .tr{position:absolute;top:11px;right:11px;display:flex;gap:5px;align-items:center}
.room .who{display:none;gap:3px}
.room.lit .who{display:inline-flex}
.room .cnt{height:24px;min-width:28px;padding:0 9px;border-radius:12px;background:var(--on);color:var(--z);
  font-family:var(--f-num);font-size:17px;font-weight:700;line-height:24px;text-align:center;display:none;font-variant-numeric:tabular-nums}
.room:hover{background-color:var(--sheet)}
.room.lit,.room.lit:hover,.room.sel,.room.sel:hover{background-color:var(--z);background-image:none;color:var(--on)}
.room.lit .pic,.room.sel .pic{background:var(--on);color:var(--z)}
.room.lit .dots,.room.lit .lock,.room.sel .dots,.room.sel .lock{color:var(--on)}
.room.lit .dots i:not(.f),.room.sel .dots i:not(.f){background:var(--on);opacity:.32}
.room.lit .cnt{display:block}
.room.mate .cnt{display:block;background:var(--z);color:var(--on)}
.room.dim>*{opacity:.5}
.room.outside{background-color:var(--sheet);box-shadow:inset 0 0 0 2px var(--sheet),inset 0 0 0 3.5px var(--z)}
.mini{display:flex;flex-wrap:wrap;gap:2px;max-width:92px}
.mini i{width:7px;height:7px;border-radius:1.5px;background:var(--z);opacity:.6}
.mini i.x{background:transparent;box-shadow:inset 0 0 0 1px var(--z)}
.room.lit .mini i,.room.sel .mini i{background:var(--on)}
.room.lit .mini i.x,.room.sel .mini i.x{background:transparent;box-shadow:inset 0 0 0 1px var(--on)}
/* three ways to look at the same building */
.viewbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.vcap{font-size:13.5px;color:var(--muted);flex:1 1 280px}
.alt{--z:var(--ink);--zs:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:16px 12px;overflow-x:auto;
  background-color:var(--sheet);background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);background-size:22px 22px}
.alt[hidden],.plan[hidden],.viewbar[hidden]{display:none}
svg.rel{display:block;margin:0 auto}
.rn{cursor:pointer}
.rn rect.rb{fill:var(--zs);stroke:var(--z);stroke-width:1.6}
.rn rect.rp{fill:var(--z)}
.rn .ri{fill:none;stroke:var(--on);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.rn text{font-family:var(--f-text);font-size:13px;font-weight:700;fill:var(--ink)}
.rn.sel rect.rb{fill:var(--z)} .rn.sel rect.rp{fill:var(--on)} .rn.sel .ri{stroke:var(--z)} .rn.sel text{fill:var(--on)}
.rn.ext rect.rb{fill:var(--sheet);stroke-dasharray:5 4}
.rn.dim{opacity:.3}
.rn:focus-visible rect.rb{stroke:var(--ink);stroke-width:3}
.re{fill:none;stroke:var(--ink);opacity:.34}
.re.on{opacity:.9}
.re.up{stroke:var(--warn);stroke-dasharray:6 4;opacity:.95}
.rah{fill:var(--ink)} .rahu{fill:var(--warn)}
.rlone{font-family:var(--f-text);font-size:12px;fill:var(--muted)}
.rsep{stroke:var(--hair);stroke-dasharray:4 5}
.fn.link{cursor:pointer}
/* a diagram opens up one box: what is inside sits on a tinted floor that carries the box's name, what it
   connects to stands outside the floor, at the two ends */
.fframe{fill:var(--zs);stroke:var(--zs);stroke-width:14;stroke-linejoin:round}
.alt .fframe{fill:var(--track);stroke:var(--track)}
.ftitle{font-family:var(--f-text);font-size:12.5px;font-weight:700;fill:var(--z)}
.alt .ftitle{fill:var(--muted)}
.fcap{font-family:var(--f-text);font-size:12px;fill:var(--muted)}
.fn.port rect.fb{fill:var(--zs)} .fn.port .fl{font-size:13px}
.fn.port:not(.link) rect.fb{fill:var(--paper);stroke:var(--ink)} .fn.port:not(.link):not(.ext) rect.fp{fill:var(--ink)}
.fn.sel rect.fb{fill:var(--z)} .fn.sel rect.fp{fill:var(--on)} .fn.sel .fi{stroke:var(--z)} .fn.sel .fl,.fn.sel .fnote{fill:var(--on)}
.fn.link:focus-visible rect.fb{stroke-width:3.5}
.fbadge rect{fill:var(--z);stroke:var(--sheet);stroke-width:2}
.fbadge text{font-family:var(--f-num);font-size:14px;font-weight:700;fill:var(--on)}
/* what goes into a box and what comes out, as drawn on the diagrams outside it */
.io{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;align-items:start}
.iot{font-size:12.5px;font-weight:700;color:var(--muted);padding-top:5px;white-space:nowrap}
.pchip{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--zs);border-radius:8px;padding:4px 11px 4px 4px;font-size:14px;font-weight:600;cursor:pointer;text-align:left;max-width:100%}
.pchip .pic{width:24px;height:24px;font-size:15px;border-radius:6px}
.pchip .pl{font-weight:500;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.pchip.plain{background:var(--paper);cursor:default;box-shadow:inset 0 0 0 1.5px var(--hair);padding-left:11px}
.pchip.plain .pic{background:var(--ink)}
.pchip.open{background:none;outline:1.5px dashed var(--warn);outline-offset:-1.5px}
.iokey{font-size:12.5px;color:var(--warn);display:flex;gap:7px;align-items:center}
.iokey i{display:inline-block;width:24px;height:14px;border-radius:4px;border:1.5px dashed var(--warn);flex:none}
.crumbs{display:flex;flex-wrap:wrap;gap:1px 7px;align-items:center;font-size:14px;line-height:1.3}
.crumbs i{font-style:normal;opacity:.7}
.wires{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:4px 14px;font-size:13px;align-items:baseline}
.fn.plain rect.fb{stroke:var(--ink)} .fn.plain rect.fp{fill:var(--ink)}
.fe.loose{stroke-dasharray:6 5}
.rchips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.follow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.follow.under{margin-top:16px;padding-top:14px;border-top:1.5px dashed var(--hair)}
.follow .rchips{margin-top:0} .follow .iot{padding-top:0}
.routebox{margin-top:14px;overflow-x:auto}
/* one real run of a route. The route is written; this is measured: the steps in the order they began, and for
   the one picked, the file and line and the values that went in and came out */
.fn.unrun rect.fb{stroke:var(--warn);stroke-dasharray:6 4}
.fn.unrun .fbadge rect{fill:var(--warn)}
.fn.unrun .fbadge text{font-family:var(--f-text);font-size:12px}
.rchips button .rc{font-size:12px;font-weight:700;margin-left:9px;padding-left:9px;border-left:1.5px solid currentColor}
.runbox{margin-top:14px}
.runbox>.ask{margin-top:2px}
.run{background:var(--sheet);border:1.5px solid var(--hair);border-radius:12px;padding:13px 14px;display:flex;flex-direction:column;gap:11px}
.runhead{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;font-size:13px;color:var(--muted)}
.runhead b{font-weight:600;color:var(--ink)}
.runtag{font-size:12.5px;font-weight:700;color:var(--paper);background:var(--ink);border-radius:999px;padding:1px 11px}
.runwarn{font-size:13.5px;font-weight:600;color:var(--warn);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.runwarn>span{font-weight:400}
.runbody{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:720px){.runbody{grid-template-columns:minmax(0,1fr)}}
.rside{display:flex;flex-direction:column;gap:7px;min-width:0}
.rsteps{display:flex;flex-direction:column;border:1.5px solid var(--hair);border-radius:10px;overflow:auto;max-height:440px}
.rstep{flex:none;display:grid;grid-template-columns:1.7em minmax(0,1fr) auto;gap:8px;align-items:baseline;min-height:44px;padding:9px 12px;border:0;border-top:1px solid var(--hair);background:none;text-align:left;cursor:pointer}
.rstep:first-child{border-top:0}
.rstep:hover{background:var(--paper)}
.rstep[aria-pressed="true"]{background:var(--paper);box-shadow:inset 4px 0 0 var(--ink)}
.rstep:focus-visible{outline-offset:-3px}
.rstep .rk{font-family:var(--f-num);font-size:15px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.rstep .rb{font-size:14px;font-weight:600;overflow-wrap:anywhere}
.rstep .rb i{font-style:normal;font-weight:700;color:var(--warn);margin-left:7px}
.rstep .rb small{display:block;font-family:var(--f-mono);font-size:11.5px;font-weight:400;color:var(--muted);overflow-wrap:anywhere}
.rms{font-family:var(--f-num);font-size:14.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.rdet{display:flex;flex-direction:column;gap:11px;min-width:0}
.rdh{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.rdh b{font-size:16.5px;font-weight:700}
.rloc{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.rloc .iot{padding-top:0}
.rloc code{font-size:13px;user-select:all;-webkit-user-select:all;cursor:text}
.rvals{display:grid;grid-template-columns:auto minmax(0,max-content) minmax(0,1fr);gap:0 16px;font-size:13.5px}
.rvals>span{padding:7px 0;border-top:1px solid var(--hair);min-width:0;overflow-wrap:anywhere}
.rvals .h{font-size:12.5px;font-weight:700;color:var(--muted);border-top:0;padding-top:0}
.rvals .d{color:var(--muted);white-space:nowrap}
.rvals .v{font-family:var(--f-mono);font-size:12.5px;line-height:1.7}
.rchips button{border:1.5px solid var(--ink);background:var(--sheet);border-radius:999px;padding:3px 14px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.rchips button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.undernote{font-size:12.5px;color:var(--muted);margin-top:10px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.undernote b{font-weight:600;color:var(--ink)}
/* what a unit is, told in a few plain sentences */
.lead{display:flex;flex-direction:column;gap:6px;max-width:46em;font-size:15.5px;line-height:1.7}
.lead[hidden]{display:none}
.explain{display:flex;flex-direction:column;gap:7px;max-width:46em}
.explain p{font-size:15.5px;line-height:1.7}
/* The call chains have a view of their own, apart from the diagrams: the diagrams tell the idea, this tells
   the code. On the left every chain; on the right the one picked: what it is about, its functions at a glance,
   then a card for each function. One called by another is set in under it, on a rail. What a function is for
   is written; where it is, its signature and its parameters are read from the code. */
.cv{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:16px;align-items:start;padding:2px 4px}
.cvlist{display:flex;flex-direction:column;gap:6px;min-width:0}
@media (max-width:860px){.cv{grid-template-columns:minmax(0,1fr)} .cvlist{flex-direction:row;flex-wrap:wrap} .cvpick{flex:1 1 200px}}
.cvpick{display:flex;flex-direction:column;gap:3px;text-align:left;border:1.5px solid var(--hair);background:var(--sheet);border-radius:10px;padding:8px 11px;cursor:pointer;min-width:0}
.cvpick:hover{border-color:var(--ink)}
.cvpick[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 4px 0 0 var(--ink)}
.cvn{font-weight:700;font-size:14px;line-height:1.35;overflow-wrap:anywhere}
.cvm{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:12.5px;color:var(--muted)}
.cvm .pic{width:16px;height:16px;font-size:11px;border-radius:4px}
.cvm .tpics{gap:2px}
.cvmain{--ind:26px;display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:640px){.cvmain{--ind:12px}}
.cvhead{display:flex;flex-direction:column;gap:8px;min-width:0}
.cvhead h3{font-size:22px;font-weight:900;line-height:1.25;color:var(--ink);margin:0;overflow-wrap:anywhere}
.cvhead p{font-size:15.5px;line-height:1.7;max-width:46em}
.cvhead .pals{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cvtree{border:1.5px solid var(--hair);border-radius:10px;background:var(--sheet);padding:9px 6px 7px;display:flex;flex-direction:column;min-width:0}
.cvtree>.iot{padding:0 8px 4px}
.cvtree button{display:grid;grid-template-columns:1.6em 9px minmax(0,auto) minmax(0,1fr);gap:8px;align-items:baseline;border:0;background:none;text-align:left;
  padding:4px 8px 4px calc(8px + var(--d)*20px);cursor:pointer;border-radius:6px;min-width:0}
.cvtree button:hover{background:var(--paper)}
.cvtree .rk{font-family:var(--f-num);font-size:14px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.cvtree .dot{width:9px;height:9px;border-radius:3px;background:var(--z);align-self:center}
.cvtree code{font-weight:700;font-size:13px;background:none;border:0;padding:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cvtree .cvw{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cvtree .off{opacity:.42}
.cvfork{display:flex;gap:7px;align-items:center;font-size:12.5px;font-weight:700;color:var(--muted);padding:5px 8px 2px calc(8px + var(--d)*20px)}
.cvfork .ic{font-size:14px}
.cvtree .cvcase{grid-template-columns:1.6em 9px minmax(0,auto) minmax(0,1fr)}
.cvtree .cvcase b{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cvtree .dia{width:8px;height:8px;transform:rotate(45deg);border:1.5px solid var(--ink);align-self:center}
.cvtree .cvcase:not(.off) .dia{background:var(--ink)}
.cfork{position:relative;border:1.5px dashed var(--ink);border-radius:10px;padding:10px 13px 11px;display:flex;flex-direction:column;gap:8px;background:var(--paper);min-width:0}
.cforkh{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:14.5px}
.cforkh .ic{font-size:17px}
.cforkh>span{color:var(--muted);font-size:13.5px}
.cfork .rchips{margin-top:0}
.csteps{display:flex;flex-direction:column}
.crow{padding-left:calc(var(--d)*var(--ind));padding-top:8px;background-repeat:no-repeat}
.crow:first-child{padding-top:0}
.cstep{position:relative;border:1.5px solid var(--hair);border-left:5px solid var(--z);border-radius:10px;padding:10px 13px 11px;display:flex;flex-direction:column;gap:7px;background:var(--sheet);min-width:0}
.crow.sub .cstep::before{content:"";position:absolute;left:calc(-1*var(--ind) + 7px);top:21px;width:calc(var(--ind) - 12px);border-top:1.5px solid var(--muted)}
.crow.loose .cstep::before{border-top:2px dashed var(--warn)}
.ctop{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.ctop .rk{font-family:var(--f-num);font-size:15px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;min-width:1.2em}

.cmore{display:flex;flex-direction:column;gap:5px;max-width:46em;font-size:14.5px;line-height:1.65}

.cstep.flash{outline:3px solid var(--ink);outline-offset:2px}
/* what goes into a function and what comes out: its name and type, what it is, where it comes from or goes */
.ios{display:flex;flex-direction:column;border:1.5px solid var(--hair);border-radius:8px;overflow:hidden}
.iorow{display:grid;grid-template-columns:40px minmax(0,27%) minmax(0,1fr) minmax(0,30%);gap:3px 12px;align-items:baseline;padding:7px 10px;border-top:1px solid var(--hair);font-size:13.5px;line-height:1.55}
.iorow:first-child{border-top:0}
.iorow.h{font-size:12px;font-weight:700;color:var(--muted);background:var(--paper)}
.iorow .via{color:var(--muted);min-width:0;overflow-wrap:anywhere}
.iorow.dim .cw{color:var(--muted)}
@media (max-width:640px){.iorow{grid-template-columns:40px minmax(0,1fr)} .iorow.h{display:none} .iorow .cw,.iorow .via{grid-column:2}}
.cd{font-size:11.5px;font-weight:700;border-radius:5px;padding:0 8px;line-height:19px;white-space:nowrap;box-shadow:inset 0 0 0 1.5px var(--z);color:var(--z);justify-self:start}
.cd.out{background:var(--z);color:var(--on)}
.iorow.dim .cd{box-shadow:inset 0 0 0 1.5px var(--hair);background:none;color:var(--muted)}
.cn{min-width:0;overflow-wrap:anywhere}
.cn .ct{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-left:6px}
.cw{min-width:0;overflow-wrap:anywhere}
.cw i{font-style:normal;font-weight:600;color:var(--warn);margin-left:8px}
.csig.open{cursor:pointer} .csig.open:hover{border-color:var(--ink)}
.nbtn,.nbtns button,.fnnav button{display:inline-flex;gap:6px;align-items:center;border:1.5px solid var(--ink);background:var(--sheet);border-radius:999px;padding:2px 12px;font-size:12.5px;font-weight:600;cursor:pointer;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nbtns button[hidden]{display:none}
.nbtn.has::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--z);flex:none}
.fnp{display:flex;flex-direction:column;gap:12px;min-width:0}
.fnnav,.nbtns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fnnav button{font-size:13px;padding:3px 13px}
.fnh{margin:0;line-height:1.2} .fnh code{font-size:20px;font-weight:700;background:none;border:0;padding:0;color:var(--ink)}
.fngrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1000px){.fngrid{grid-template-columns:minmax(0,1fr)}}
.src{margin:0;border:1.5px solid var(--hair);border-radius:10px;background:var(--sheet);padding:8px 0;overflow:auto;max-height:680px;font-family:var(--f-mono);font-size:12.5px;line-height:1.65}
.src .l{display:block;white-space:pre;padding-right:14px;min-height:1.65em}
.src .l::before{counter-increment:l;content:counter(l);display:inline-block;width:3.4em;margin-right:12px;padding-right:9px;text-align:right;color:var(--muted);border-right:1px solid var(--hair);user-select:none;-webkit-user-select:none}
.nedit{width:100%;min-height:200px;resize:vertical;border:1.5px solid var(--ink);border-radius:10px;background:var(--sheet);color:var(--ink);padding:10px 12px;font-family:var(--f-text);font-size:14px;line-height:1.6}
.nview{border:1.5px dashed var(--hair);border-radius:10px;padding:10px 12px;font-size:14.5px;line-height:1.65;display:flex;flex-direction:column;gap:7px;min-width:0;overflow-wrap:anywhere;background:var(--sheet)}
.nview ul{margin:0;padding-left:1.3em} .nview pre{margin:0;overflow-x:auto;white-space:pre}
.nstate{font-size:12px;font-weight:600;color:var(--muted);margin-left:8px} .nstate.local{color:var(--warn)}
.chref{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--ink);background:var(--sheet);border-radius:999px;padding:3px 13px;font-size:13.5px;font-weight:600;cursor:pointer}
.chref .pct{font-family:var(--f-num);font-size:14.5px;color:var(--muted)}
.cstep details summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted)}
.cstep details .rc{font-size:11.5px;font-weight:700;margin-left:9px;padding:0 8px;border-radius:9px;background:var(--ink);color:var(--paper)}
.cstep details>div{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.csig{display:block;font-size:12.5px;line-height:1.6;padding:6px 9px;white-space:pre-wrap}
/* the rooms inside a room */
.blkhead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.inplan{display:flex;flex-wrap:wrap;gap:2px;background:var(--ink);border:2px solid var(--ink);border-radius:10px;overflow:hidden}
.sroom{flex:1 1 168px;min-width:0;border:0;background:var(--zs);padding:10px 11px;text-align:left;cursor:pointer;display:grid;
  grid-template-columns:26px minmax(0,1fr);gap:4px 9px;align-items:center}
.sroom .pic{width:26px;height:26px;font-size:16px;border-radius:6px}
.sroom .nm{font-weight:700;font-size:13.5px;line-height:1.3;overflow-wrap:anywhere}
.sroom .sm{grid-column:2;display:flex;gap:8px;align-items:center;font-family:var(--f-num);font-size:14px;font-weight:600;color:var(--z);font-variant-numeric:tabular-nums}
.sroom:hover{background:var(--sheet)}
.sroom.ext{background:var(--sheet);box-shadow:inset 0 0 0 2px var(--sheet),inset 0 0 0 3.5px var(--z)}
.sroom.lit,.sroom.lit:hover{background:var(--z);color:var(--on)}
.sroom.lit .pic{background:var(--on);color:var(--z)} .sroom.lit .sm{color:var(--on)}
.sroom.lit .dots i:not(.f){background:var(--on);opacity:.32}
.tagx{font-family:var(--f-text);font-size:11.5px;font-weight:700;border:1.5px solid currentColor;border-radius:5px;padding:0 6px;line-height:17px;white-space:nowrap}
.crumb{background:none;border:0;padding:0;font-size:14px;font-weight:600;color:inherit;opacity:.85;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.out-line{display:flex;gap:9px;align-items:center;font-weight:600;font-size:14.5px}
.out-line .ic{font-size:18px}
/* a window: one Claude Code or Codex session, marked like a line on a transit map */
.wb{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;flex:none;
  background:var(--ink);color:var(--paper);font-family:var(--f-num);font-size:14.5px;font-weight:700;line-height:1}
.wb.q{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--muted)}
.room .wb{box-shadow:0 0 0 1.5px var(--on)}
.room .wb.q{color:var(--on);box-shadow:inset 0 0 0 1.5px var(--on)}
.room .more{font-family:var(--f-num);font-size:14px;font-weight:700}

/* what is being worked on: tasks from the journal the agent keeps, shown in the lines it wrote there for people */
.tasks,.since{display:flex;flex-direction:column;gap:10px}
.since[hidden]{display:none}
/* what changed lately: measured from the list's own history, the tasks' histories and the commits */
.sbody{background:var(--sheet);border:1.5px solid var(--hair);border-radius:12px;padding:13px 14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px 14px;align-items:start}
.sbody .wide{grid-column:1/-1}
.pchip .cnt{font-family:var(--f-num);font-size:15px;color:var(--z);font-variant-numeric:tabular-nums}
@media (max-width:560px){.sbody{grid-template-columns:minmax(0,1fr);gap:4px 0} .sbody .iot{padding-top:6px}}
.tasks[hidden]{display:none}
.thd{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.thd h2{font-size:21px;font-weight:900;margin:0}
.tcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:10px}
.tcard{display:flex;flex-direction:column;gap:8px;min-width:0;text-align:left;cursor:pointer;background:var(--sheet);
  border:1.5px solid var(--hair);border-radius:12px;padding:13px 14px 12px}
.tcard:hover{border-color:var(--ink)}
.tcard[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 5px 0 0 var(--ink)}
.tt{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.tn{font-weight:700;font-size:17px;line-height:1.3;overflow-wrap:anywhere}
.tnow{font-size:14px;line-height:1.5;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.tnow.none{color:var(--muted)}
.tf{display:flex;flex-wrap:wrap;gap:6px 9px;align-items:center;margin-top:auto;font-size:12.5px;color:var(--muted)}
.tpics{display:inline-flex;gap:3px}
.tpics .pic{width:22px;height:22px;font-size:14px;border-radius:6px}
.flag.me{background:var(--warn);color:var(--on)}
.tline{font-size:17px;font-weight:500;line-height:1.55;max-width:44em}
.flag.fin{color:var(--muted);border-color:var(--muted)}
.older summary{cursor:pointer;font-size:14px;font-weight:700;color:var(--muted);padding:2px 0}
.older[open] summary{margin-bottom:10px}
.older .tcard{padding:10px 13px 9px} .older .tn{font-size:15px}
.story{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:6px 12px;align-items:baseline;font-size:14.5px;line-height:1.5}
.story .sd{font-family:var(--f-num);font-size:15px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
/* what a finished step came to: three short answers, then the flow diagrams with the changed boxes marked */
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:1.5px;background:var(--hair);border:1.5px solid var(--hair);border-radius:10px;overflow:hidden}
.three>div{background:var(--sheet);padding:12px 14px 13px;min-width:0;display:flex;flex-direction:column;gap:4px}
.three h3{font-size:12.5px;font-weight:700;color:var(--muted);margin:0;letter-spacing:.04em}
.three p{margin:0;font-size:15px;line-height:1.55}
.chgh{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.chgh .crumb{font-size:16px;font-weight:700;opacity:1}
svg.flow.marked .fn:not(.mk){opacity:.5}
.fn.mk rect.fb{stroke-width:3.5}
.fmk rect{fill:var(--z1)} .fmk.chg rect{fill:var(--warn)}
.fmk text{font-family:var(--f-text);font-size:11px;font-weight:700;fill:var(--on)}
.mkey{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);align-items:center}
.mk-b{display:inline-block;font-size:11px;font-weight:700;line-height:18px;padding:0 8px;border-radius:9px;color:var(--on);background:var(--z1);white-space:nowrap}
.mk-b.chg{background:var(--warn)} .mk-b.gone{background:none;color:var(--muted);border:1.5px dashed var(--muted);line-height:15px}
.mk-b.off{background:none;color:var(--muted);border:1.5px solid var(--hair);line-height:15px}
.chgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:10px 24px;margin:0;padding:0;list-style:none}
.chgs li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 9px;align-items:baseline;font-size:14.5px;line-height:1.5}
.chgs b{font-weight:700} .chgs .gone b{text-decoration:line-through;color:var(--muted)}
.chgs span.tx{grid-column:2}

/* the sheet for what is picked */
.stage{border:3px solid var(--ink);border-radius:12px;background:var(--sheet);overflow:hidden;scroll-margin-top:14px}
.band{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:14px 18px;background:var(--ink);color:var(--paper)}
.band.wingc{background:var(--z);color:var(--on)}
.band .pic{width:46px;height:46px;font-size:27px;border-radius:10px;background:var(--on);color:var(--z)}
.band h2{margin:0;font-size:23px;font-weight:900;line-height:1.2}
.band .meta{font-family:var(--f-num);font-size:16px;font-weight:600;opacity:.9;font-variant-numeric:tabular-nums}
.band .what{flex:1 1 280px;font-size:15.5px;font-weight:500;max-width:40em}

.band code{background:transparent;border-color:currentColor;color:inherit}
.band .back{margin-left:auto;background:none;border:1.5px solid currentColor;border-radius:999px;padding:3px 14px;font-size:13px;font-weight:600;cursor:pointer;color:inherit}
.body{padding:18px;display:flex;flex-direction:column;gap:18px}
h3{font-size:13.5px;font-weight:700;margin:0;color:var(--muted)}
.blk{display:flex;flex-direction:column;gap:8px;min-width:0}
.care-line{display:flex;gap:9px;align-items:center;font-weight:600;font-size:14.5px;color:var(--warn)}
.care-line .ic{font-size:18px}
.canvas{border:1.5px solid var(--hair);border-radius:10px;padding:16px 12px;overflow-x:auto;
  background-color:var(--paper);background-image:radial-gradient(var(--dot) 1px,transparent 1.3px);background-size:22px 22px}
svg.flow{display:block;margin:0 auto}
.fn rect.fb{fill:var(--sheet);stroke:var(--z);stroke-width:2}
.fn.ext rect.fb{stroke:var(--ink);stroke-dasharray:6 4}
.fn rect.fp{fill:var(--z)}
.fn.ext rect.fp{fill:var(--ink)}
.fn .fi{fill:none;stroke:var(--on);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.fn .fl{font-family:var(--f-text);font-size:14px;font-weight:700;fill:var(--ink)}
.fn .fnote{font-family:var(--f-text);font-size:11.5px;fill:var(--muted)}
.fe{fill:none;stroke:var(--ink);stroke-width:1.8;opacity:.72}
.fah{fill:var(--ink)}
.felbg{fill:var(--sheet);stroke:var(--hair);stroke-width:1}
.fel{font-family:var(--f-text);font-size:12px;font-weight:600;fill:var(--ink)}
.fdot{fill:var(--z)}
.fkey{font-size:12.5px;color:var(--muted)}
.aged{font-size:12.5px;color:var(--muted);display:flex;gap:7px;align-items:center}
.aged.much{color:var(--warn);font-weight:600}
.aged .ic{font-size:15px}
.ask{font-size:13.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.say{font-family:var(--f-text);font-weight:600;color:var(--ink);background:var(--paper);border:1.5px solid var(--hair);border-radius:8px;padding:2px 10px;user-select:all;-webkit-user-select:all;cursor:text}
.fkey i{display:inline-block;width:24px;height:14px;border-radius:4px;border:1.5px dashed var(--ink);vertical-align:-2px;margin-right:7px}
.empty{border:1.5px dashed var(--hair);border-radius:10px;padding:22px;color:var(--muted);font-size:14.5px}
.cols3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px 30px;align-items:start}
.signs{display:flex;flex-direction:column;gap:9px}
.sign{display:grid;grid-template-columns:22px minmax(0,1fr);gap:9px;align-items:start;font-size:14.5px;line-height:1.5}
.sign .ic{font-size:19px;margin-top:1px;color:var(--warn)}
.sign .src{display:block;font-size:12px;color:var(--muted)}
.pals{display:flex;flex-wrap:wrap;gap:7px}
.pal{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--zs);border-radius:8px;padding:4px 11px 4px 4px;font-size:14px;font-weight:600;cursor:pointer}
.pal .pic{width:24px;height:24px;font-size:15px;border-radius:6px}
.pal .pct{font-family:var(--f-num);font-size:15px;color:var(--z);font-variant-numeric:tabular-nums}
.sub{font-size:13.5px;color:var(--muted)}
details summary{cursor:pointer;font-size:13.5px;font-weight:700;color:var(--muted)}
details .in{padding-top:8px;display:flex;flex-direction:column;gap:5px;font-size:13px}
details .tags{flex-direction:row;flex-wrap:wrap}
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;gap:2px;background:var(--sheet)}
.stack i{display:block;background:var(--z);min-width:6px}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:9px 30px}
.lrow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:15px}
.lrow .pic{width:28px;height:28px;font-size:17px;border-radius:7px}
.lrow b{font-weight:600}
.lrow .n{font-family:var(--f-num);font-size:18px;font-weight:700;display:inline-flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.lanes{display:flex;flex-direction:column;border:1.5px solid var(--hair);border-radius:10px;overflow:hidden}
.lane{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1.5fr);gap:6px 14px;align-items:center;width:100%;
  padding:10px 14px;border:0;border-top:1px solid var(--hair);background:none;text-align:left;cursor:pointer}
.lane:first-child{border-top:0}
.lane:hover{background:var(--paper)}
.lane[aria-pressed="true"]{background:var(--paper);box-shadow:inset 4px 0 0 var(--ink)}
.lane .wb{width:28px;height:28px;font-size:18px}
.lane .lt{font-weight:700;font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.lane .ls{display:block;font-size:12.5px;font-weight:400;color:var(--muted)}
.lane .ln{display:flex;flex-wrap:wrap;gap:4px 9px;align-items:center}
.lane .lsaid{display:block;font-size:13px;font-weight:500;line-height:1.45;margin-top:2px;overflow-wrap:anywhere}
/* how a window stands: at work, handed back to the person, stuck in the middle of a step, or quiet */
.st{font-size:11.5px;font-weight:700;border-radius:999px;padding:0 9px;line-height:19px;white-space:nowrap}
.st.working{background:var(--z1);color:var(--on)}
.st.waiting{background:var(--warn);color:var(--on)}
.st.held{color:var(--warn);box-shadow:inset 0 0 0 1.5px var(--warn)}
.st.idle{color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--hair)}
.clashes{display:flex;flex-direction:column;gap:7px}
.clash{display:flex;flex-wrap:wrap;gap:6px 9px;align-items:center;font-size:14px}
.clash.hard{color:var(--warn);font-weight:600} .clash.hard code{color:var(--ink);font-weight:400}
.clash .ic{font-size:17px} .clash .wbs{display:inline-flex;gap:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--zs);border-radius:8px;padding:3px 10px 3px 3px;font-size:13.5px;font-weight:600}
.chip .pic{width:22px;height:22px;font-size:14px;border-radius:6px}
.chip .n{font-family:var(--f-num);font-size:15.5px;color:var(--z);font-variant-numeric:tabular-nums}
.both{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:13.5px}
.both .wbs{display:inline-flex;gap:3px}
.nowby{display:flex;flex-wrap:wrap;gap:6px 9px;align-items:center;font-size:14.5px;font-weight:600}
.nowby .sub{font-weight:400}
.kwb{width:18px;height:18px;font-size:12px}
.band .wb{background:var(--paper);color:var(--ink);width:30px;height:30px;font-size:19px;vertical-align:-5px;margin-right:6px}
.band .wb.q{background:transparent;color:var(--paper);box-shadow:inset 0 0 0 1.5px var(--paper)}
.flag{font-family:var(--f-text);font-size:11.5px;font-weight:700;color:var(--warn);border:1.5px solid var(--warn);border-radius:5px;padding:0 6px;line-height:17px;white-space:nowrap}

/* footprints */
.work{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.whead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.whead h2{font-size:21px;font-weight:900;margin:0}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;background:var(--sheet);padding:2px}
.seg button{border:0;background:none;border-radius:999px;padding:3px 14px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.table{background:var(--sheet);border:1.5px solid var(--hair);border-radius:12px;padding:8px 8px 6px;overflow-x:auto}
.thead,.trow{display:grid;grid-template-columns:3.2em max-content minmax(140px,1fr);gap:14px;align-items:center;padding:6px 10px}
.thead{padding-bottom:3px}

d_voltage());\n}", "cut": false, "note": ""}, "app/app_motion_precondition.c:AppMotionPreConditionInit": {"file": "app/app_motion_precondition.c", "line": 150, "src": "void AppMotionPreConditionInit(void)\n{\n    kMotionPrecondition.emergency_brake_requested = false;\n    MotionLimitCheckInit(&kMotionPrecondition.limit);\n}", "cut": false, "note": ""}, "embedded_project/Y01/Board/board.c:BspInit": {"file": "embedded_project/Y01/Board/board.c", "line": 60, "src": "void BspInit(void)\n{\n    // 初始化固件升级\n#ifdef YH_RELEASE\n    drv_upgrade_init();\n#endif // YH_RELEASE\n\n    // 初始化抱闸定时器，输出抱闸信号为合闸状态\n    __HAL_TIM_SET_COMPARE(&BRAKE_PWM_TIM_HANDLE, BRAKE_PWM_TIM_CHANNEL, BRAKE_PWM_DUTY_CCR_ENGAGED);\n    HAL_TIM_PWM_Start(&BRAKE_PWM_TIM_HANDLE, BRAKE_PWM_TIM_CHANNEL);\n\n    // 触发规则通道队列DMA采样\n    HAL_ADC_Start_DMA(&DC_BUS_VOLTAGE_HANDLE, (uint32_t *)kBspData.adc1_raw_buffer, ADC1_REGULAR_RANK_NUMBER);\n    // 等待母线电压稳定\n    do\n    {\n        HAL_Delay(1);\n    } while (sys_bus_voltage_check() == VOLTAGE_STATUS_UNKNOWN);\n\n    HAL_ADC_Stop_DMA(&DC_BUS_VOLTAGE_HANDLE);\n\n    // 启动 ADC 校准\n    if (HAL_ADCEx_Calibration_Start(&UVW_CURRENT_U_HANDLE,\n                                    ADC_CALIB_OFFSET_LINEARITY, ADC_SINGLE_ENDED) != HAL_OK)\n    {\n        sys_set_bsp_error_state(ERROR_CURRENT_SAMPLE, ERROR_SET);\n    }\n    else if (HAL_ADCEx_Calibration_Start(&UVW_CURRENT_V_HANDLE,\n                                         ADC_CALIB_OFFSET_LINEARITY, ADC_SINGLE_ENDED) != HAL_OK)\n    {\n        sys_set_bsp_error_state(ERROR_CURRENT_SAMPLE, ERROR_SET);\n    }\n    else if (HAL_ADCEx_Calibration_Start(&UVW_CURRENT_W_HANDLE,\n                                         ADC_CALIB_OFFSET_LINEARITY, ADC_SINGLE_ENDED) != HAL_OK)\n    {\n        sys_set_bsp_error_state(ERROR_CURRENT_SAMPLE, ERROR_SET);\n    }\n\n    HAL_ADC_Start_DMA(&DC_BUS_VOLTAGE_HANDLE, (uint32_t *)kBspData.adc1_raw_buffer, ADC1_REGULAR_RANK_NUMBER);\n    HAL_ADC_Start_DMA(&TEMP_MOS_HANDLE, (uint32_t *)kBspData.adc2_raw_buffer, ADC2_REGULAR_RANK_NUMBER);\n    HAL_ADC_Start_DMA(&TEMP_MCU_HANDLE, (uint32_t *)kBspData.adc3_raw_buffer, ADC3_REGULAR_RANK_NUMBER);\n    HAL_Delay(5);\n\n    // 启动 1ms 任务\n    HAL_TIM_Base_Start_IT(&NRT_TASK_TIM_HANDLE);\n\n    // 位置环软中断初始化，可配置运行周期\n    //PositionLoopInit();\n\n    // 启动ADC注入中断\n    HAL_ADCEx_InjectedStart_IT(&UVW_CURRENT_U_HANDLE);\n    HAL_ADCEx_InjectedStart(&UVW_CURRENT_V_HANDLE);\n    HAL_ADCEx_InjectedStart(&UVW_CURRENT_W_HANDLE);\n\n    // 初始化时关闭pwm波\n    PWM_TIM_U_CCR_VAL = 0;\n    PWM_TIM_V_CCR_VAL = 0;\n    PWM_TIM_W_CCR_VAL = 0;\n    HAL_TIM_PWM_Start(&PWM_TIM_HANDLE, PWM_TIM_U_CHANNEL);\n    HAL_TIMEx_PWMN_Start(&PWM_TIM_HANDLE, PWM_TIM_U_CHANNEL);\n    HAL_TIM_PWM_Start(&PWM_TIM_HANDLE, PWM_TIM_V_CHANNEL);\n    HAL_TIMEx_PWMN_Start(&PWM_TIM_HANDLE, PWM_TIM_V_CHANNEL);\n    HAL_TIM_PWM_Start(&PWM_TIM_HANDLE, PWM_TIM_W_CHANNEL);\n    HAL_TIMEx_PWMN_Start(&PWM_TIM_HANDLE, PWM_TIM_W_CHANNEL);\n    bsp_set_pwm_state(PWM_DISABLE);\n    __HAL_TIM_ENABLE_IT(&PWM_TIM_HANDLE, TIM_IT_BREAK);\n\n#ifdef USE_CAN\n    // 初始化CAN外设\n    if (bsp_fdcan_init() != HAL_OK)\n    {\n        sys_set_bsp_error_state(ERROR_COMMS_INIT, ERROR_SET);\n    }\n    else\n    {\n        // CAN相关应用初始化\n        fdcan_app_init();\n    }\n#endif // USE_CAN\n\n    // 启动调试软件通讯\n    __HAL_UART_CLEAR_IDLEFLAG(&HOST_UART_HANDLE);\n    HAL_UART_Receive_DMA(&HOST_UART_HANDLE, mavlink_rx_buff, MAVLINK_RECV_BUFF_SIZE);\n    __HAL_UART_ENABLE_IT(&HOST_UART_HANDLE, UART_IT_IDLE);\n\n    HAL_Delay(10);\n#ifdef USE_ECAT\n    EcatTaskInit();\n#endif // USE_ECAT\n}", "cut": false, "note": ""}, "embedded_project/Y01/Board/bsp_api.c:sys_bus_voltage_check": {"file": "embedded_project/Y01/Board/bsp_api.c", "line": 74, "src": "VOLTAGE_CHECK_STATUS sys_bus_voltage_check(void)\n{\n#ifdef VIRTUAL_MOTOR_MODEL\n    return VOLTAGE_STATUS_NORMAL;\n#else\n    return BusVoltageCheck();\n#endif\n}", "cut": false, "note": ""}, "embedded_project/Y01/Board/bsp_fdcan.c:bsp_fdcan_init": {"file": "embedded_project/Y01/Board/bsp_fdcan.c", "line": 30, "src": "HAL_StatusTypeDef bsp_fdcan_init(void)\n{\n    HAL_StatusTypeDef ret = HAL_OK;\n\n    // 根据波特率配置时序参数（Nominal=仲裁段，Data=数据段，参数基于80MHz时钟）\n    switch (bsp_fdcan.baudrate)\n    {\n        // ... Other CAN Baudrates Slow\n        case FDCAN_BAUDRATE_500K_BPS:\n            // 80MHz / (10 * (1 + 13 + 2)) = 80MHz / (10*16) ≈ 500000\n            bsp_fdcan.handle->Init.NominalPrescaler = 10;\n            bsp_fdcan.handle->Init.NominalSyncJumpWidth = 2;\n            bsp_fdcan.handle->Init.NominalTimeSeg1 = 13;\n            bsp_fdcan.handle->Init.NominalTimeSeg2 = 2;\n            bsp_fdcan.handle->Init.DataPrescaler = 10;\n            bsp_fdcan.handle->Init.DataSyncJumpWidth = 2;\n            bsp_fdcan.handle->Init.DataTimeSeg1 = 13;\n            bsp_fdcan.handle->Init.DataTimeSeg2 = 2;\n            break;\n\n        case FDCAN_BAUDRATE_1M_BPS: // 1Mbps（默认）\n            // 80MHz / (4 * (1 + 14 + 5)) = 80MHz / (4*20) = 1000000\n            bsp_fdcan.handle->Init.NominalPrescaler = 4;\n            bsp_fdcan.handle->Init.NominalSyncJumpWidth = 2;\n            bsp_fdcan.handle->Init.NominalTimeSeg1 = 14;\n            bsp_fdcan.handle->Init.NominalTimeSeg2 = 5;\n            bsp_fdcan.handle->Init.DataPrescaler = 4;\n            bsp_fdcan.handle->Init.DataSyncJumpWidth = 2;\n            bsp_fdcan.handle->Init.DataTimeSeg1 = 14;\n            bsp_fdcan.handle->Init.DataTimeSeg2 = 5;\n            break;\n\n        // ... Other CAN Baudrates Fast\n        default:\n            return HAL_ERROR;\n    }\n\n    // 配置FDCAN句柄初始化参数（基于80MHz时钟）\n    bsp_fdcan.handle->Instance = CAN_FDCAN_NUMBER;\n    bsp_fdcan.handle->Init.FrameFormat = FDCAN_FRAME_FD_NO_BRS;         // 无速率切换的FD格式\n    bsp_fdcan.handle->Init.Mode = FDCAN_MODE_NORMAL;                    // 正常工作模式\n    bsp_fdcan.handle->Init.AutoRetransmission = ENABLE;                 // 启用自动重传\n    bsp_fdcan.handle->Init.TransmitPause = ENABLE;                      // 启用发送暂停\n    bsp_fdcan.handle->Init.ProtocolException = DISABLE;                 // 禁用协议异常处理\n    bsp_fdcan.handle->Init.MessageRAMOffset = 0;                        // 消息RAM偏移量为0\n    bsp_fdcan.handle->Init.StdFiltersNbr = 2;                           // 标准滤波器数量\n    bsp_fdcan.handle->Init.ExtFiltersNbr = 3;                           // 扩展滤波器数量\n    bsp_fdcan.handle->Init.TxFifoQueueMode = FDCAN_TX_FIFO_OPERATION;   // TX FIFO模式\n\n    // 初始化FDCAN外设\n    ret = HAL_FDCAN_Init(bsp_fdcan.handle);\n    if (ret != HAL_OK) return ret;\n\n    // 配置全局滤波：拒绝所有不匹配的标准/扩展帧和远程帧\n    ret = HAL_FDCAN_ConfigGlobalFilter(bsp_fdcan.handle, \\\n                                       FDCAN_REJECT, FDCAN_REJECT, \\\n                                       FDCAN_FILTER_REMOTE, FDCAN_FILTER_REMOTE);\n    if (ret != HAL_OK) return ret;\n\n// 配置FIFO0滤波器\n#ifdef USE_CANOPEN\n    // CANopen协议\n    bsp_fdcan.sFilterConfig.IdType = FDCAN_STANDARD_ID;                 // 使用标准ID\n    bsp_fdcan.sFilterConfig.FilterConfig = FDCAN_FILTER_TO_RXFIFO0;     // 过滤后的数据送入FIFO0\n    /* 第一组滤波器：接收所有广播帧 (NMT, SYNC) */\n    bsp_fdcan.sFilterConfig.FilterIndex = CANID_STD_FILTER_FUNC_GLOBAL; // 滤波器索引\n    bsp_fdcan.sFilterConfig.FilterType = FDCAN_FILTER_DUAL;             // 双ID过滤模式\n    bsp_fdcan.sFilterConfig.FilterID1 = 0x000;              // NMT ID\n    bsp_fdcan.sFilterConfig.FilterID2 = 0x080;              // SYNC ID\n    ret = HAL_FDCAN_ConfigFilter(bsp_fdcan.handle, &bsp_fdcan.sFilterConfig);\n    if (ret != HAL_OK) return ret;\n    /* 第二组滤波器：接收发给节点的单播帧 (SDO, PDO等) */\n    if (bsp_fdcan.id > CANOPEN_ID_MAX)\n    {\n        ret = HAL_ERROR;\n        return ret;\n    }\n    bsp_fdcan.sFilterConfig.FilterIndex = CANID_STD_FILTER_FUNC_SLAVE;  // 滤波器索引\n    bsp_fdcan.sFilterConfig.FilterType = FDCAN_FILTER_MASK;             // 掩码过滤模式\n    bsp_fdcan.sFilterConfig.FilterID1 = bsp_fdcan.id;       // 基准ID：高4位任意（设为0），低7位为目标节点号\n    bsp_fdcan.sFilterConfig.FilterID2 = CANOPEN_ID_MAX;     // 掩码：高4位0（不关心功能码），低7位1（严格匹配节点号）\n    ret = HAL_FDCAN_ConfigFilter(bsp_fdcan.handle, &bsp_fdcan.sFilterConfig);\n    if (ret != HAL_OK) return ret;\n    // 激活FIFO0新消息中断\n    ret = HAL_FDCAN_ActivateNotification(bsp_fdcan.handle, FDCAN_IT_RX_FIFO0_NEW_MESSAGE, 0);\n    if (ret != HAL_OK) return ret;\n#else //其他CAN协议\n    bsp_fdcan.sFilterConfig.IdType = FDCAN_STANDARD_ID;                 // 使用标准ID\n    bsp_fdcan.sFilterConfig.FilterConfig = FDCAN_FILTER_TO_RXFIFO0;     // 过滤后的数据送入FIFO0\n    bsp_fdcan.sFilterConfig.FilterIndex = 0;                            // 滤波器索引\n    bsp_fdcan.sFilterConfig.FilterType = FDCAN_FILTER_MASK;             // 掩码过滤模式\n    bsp_fdcan.sFilterConfig.FilterID1 = 0x000;              // 过滤ID（掩码模式下为基准ID）\n    bsp_fdcan.sFilterConfig.FilterID2 = 0x000;              // 掩码为0，不过滤任何ID\n    ret = HAL_FDCAN_ConfigFilter(bsp_fdcan.handle, &bsp_fdcan.sFilterConfig);\n    if (ret != HAL_OK) return ret;\n    // 激活FIFO0新消息中断\n    ret = HAL_FDCAN_ActivateNotification(bsp_fdcan.handle, FDCAN_IT_RX_FIFO0_NEW_MESSAGE, 0);\n    if (ret != HAL_OK) return ret;\n#endif /* USE_CANOPEN */\n\n// 配置FIFO1滤波器\n#if IS_USE_CAN_PASSTHROUGH == FC_CTRL_ON\n    bsp_fdcan.sFilterConfig.IdType = FDCAN_EXTENDED_ID;             // 使用扩展ID\n    bsp_fdcan.sFilterConfig.FilterType = FDCAN_FILTER_MASK;         // 掩码过滤模式\n    bsp_fdcan.sFilterConfig.FilterConfig = FDCAN_FILTER_TO_RXFIFO1; // 过滤后的数据送入FIFO1\n    /* ================= Filter 0：全局广播 =================\n     * flag = 2 (10b) 2bit\n     * 只匹配 flag 字段\n     */\n    bsp_fdcan.sFilterConfig.FilterIndex = CANID_EXT_FILTER_FUNC_GLOBAL;\n    bsp_fdcan.sFilterConfig.FilterID1   = (CANID_FLAG_GLOBAL \u003c\u003c CANID_FLAG_SHIFT);\n    bsp_fdcan.sFilterConfig.FilterID2   = CANID_FLAG_MASK;\n    ret = HAL_FDCAN_ConfigFilter(bsp_fdcan.handle, &bsp_fdcan.sFilterConfig);\n    if (ret != HAL_OK) return ret;\n\n    /* ================= Filter 1：系统内广播 =================\n     * flag = 1 (01b) 2bit\n     * 匹配 flag + sysid\n     */\n    bsp_fdcan.sFilterConfig.FilterIndex = CANID_EXT_FILTER_FUNC_SYSTEM;\n    bsp_fdcan.sFilterConfig.FilterID1   = (CANID_FLAG_SYSTEM \u003c\u003c CANID_FLAG_SHIFT) | \\\n                                          (bsp_fdcan.mav_sys_id \u003c\u003c CANID_SYSID_SHIFT);\n    bsp_fdcan.sFilterConfig.FilterID2   = CANID_FLAG_MASK | CANID_SYSID_MASK;\n    ret = HAL_FDCAN_ConfigFilter(bsp_fdcan.handle, &bsp_fdcan.sFilterConfig);\n    if (ret != HAL_OK) return ret;\n\n    /* ================= Filter 2：单设备通信 =================\n     * compid = 0xFF (1111 1111b) 8bit\n     * sysid  = 0x1F    (1 1111b) 5bit\n     * 匹配 compid + sysid\n     */\n    bsp_fdcan.sFilterConfig.FilterIndex = CANID_EXT_FILTER_FUNC_SLAVE;\n    bsp_fdcan.sFilterConfig.FilterID1   = (bsp_fdcan.mav_comp_id \u003c\u003c CANID_COMPID_SHIFT) | \\\n                                          (bsp_fdcan.mav_sys_id \u003c\u003c CANID_SYSID_SHIFT);\n    bsp_fdcan.sFilterConfig.FilterID2   = CANID_COMPID_MASK | CANID_SYSID_MASK;\n    ret = HAL_FDCAN_ConfigFilter(bsp_fdcan.handle, &bsp_fdcan.sFilterConfig);\n    if (ret != HAL_OK) return ret;\n\n    // 激活FIFO1新消息中断\n    ret = HAL_FDCAN_ActivateNotification(bsp_fdcan.handle, FDCAN_IT_RX_FIFO1_NEW_MESSAGE, 0);\n    if (ret != HAL_OK) return ret;\n#endif /* IS_USE_CAN_PASSTHROUGH */\n    // 启动FDCAN模块\n    ret = HAL_FDCAN_Start(bsp_fdcan.handle);\n    if (ret != HAL_OK) return ret;\n\n    return ret;\n}", "cut": false, "note": ""}, "embedded_project/Y01/Board/drv_can_app.c:fdcan_app_init": {"file": "embedded_project/Y01/Board/drv_can_app.c", "line": 57, "src": "void fdcan_app_init(void)\n{\n    drv_can_app.p_fdcan = bsp_fdcan_get_fdcan_handle();\n#ifdef USE_CANOPEN\n    fdcan_canopen_init(drv_can_app.p_fdcan);\n#endif\n}", "cut": false, "note": ""}, "embedded_project/Y01/Board/board.c:EcatTaskInit": {"file": "embedded_project/Y01/Board/board.c", "line": 243, "src": "static void EcatTaskInit(void)\n{\n    EXTI_HandleTypeDef sync_task_exit;\n    EXTI_ConfigTypeDef sync_task_exit_config;\n    sync_task_exit_config.GPIOSel = EXTI_GPIOB;\n    sync_task_exit_config.Line = ECAT_SYNC_EXTI_LINE_X;\n    sync_task_exit_config.Mode = EXTI_MODE_INTERRUPT;\n    sync_task_exit_config.Trigger = EXTI_TRIGGER_RISING;\n    HAL_EXTI_SetConfigLine(&sync_task_exit, &sync_task_exit_config);\n    HAL_NVIC_SetPriority(ECAT_SYNC_EXTIX_IRQN, ECAT_SYNC_NVIC_PRIORITY, 0);\n    HAL_NVIC_EnableIRQ(ECAT_SYNC_EXTIX_IRQN);\n\n    EXTI_HandleTypeDef pdi_task_exit;\n    EXTI_ConfigTypeDef pdi_task_exit_config;\n    pdi_task_exit_config.GPIOSel = EXTI_GPIOB;\n    pdi_task_exit_config.Line = ECAT_PDI_EXTI_LINE_X;\n    pdi_task_exit_config.Mode = EXTI_MODE_INTERRUPT;\n    pdi_task_exit_config.Trigger = EXTI_TRIGGER_RISING;\n    HAL_EXTI_SetConfigLine(&pdi_task_exit, &pdi_task_exit_config);\n    HAL_NVIC_SetPriority(ECAT_PDI_EXTIX_IRQN, ECAT_PDI_NVIC_PRIORITY, 0);\n    HAL_NVIC_EnableIRQ(ECAT_PDI_EXTIX_IRQN);\n}", "cut": false, "note": ""}, "embedded_project/Y01/Drivers/STM32H7xx_HAL_Driver/Src/stm32h7xx_hal_uart.c:HAL_UART_Receive_DMA": {"file": "embedded_project/Y01/Drivers/STM32H7xx_HAL_Driver/Src/stm32h7xx_hal_uart.c", "line": 1470, "src": "HAL_StatusTypeDef HAL_UART_Receive_DMA(UART_HandleTypeDef *huart, uint8_t *pData, uint16_t Size)\n{\n  /* Check that a Rx process is not already ongoing */\n  if (huart->RxState == HAL_UART_STATE_READY)\n  {\n    if ((pData == NULL) || (Size == 0U))\n    {\n      return HAL_ERROR;\n    }\n\n    /* Set Reception type to Standard reception */\n    huart->ReceptionType = HAL_UART_RECEPTION_STANDARD;\n\n    if (!(IS_LPUART_INSTANCE(huart->Instance)))\n    {\n      /* Check that USART RTOEN bit is set */\n      if (READ_BIT(huart->Instance->CR2, USART_CR2_RTOEN) != 0U)\n      {\n        /* Enable the UART Receiver Timeout Interrupt */\n        ATOMIC_SET_BIT(huart->Instance->CR1, USART_CR1_RTOIE);\n      }\n    }\n\n    return (UART_Start_Receive_DMA(huart, pData, Size));\n  }\n  else\n  {\n    return HAL_BUSY;\n  }\n}", "cut": false, "note": ""}, "SIL_project/main.c:main": {"file": "SIL_project/main.c", "line": 10, "src": "int main(void)\n{\n    RegisterSetAppCallback(set_app);\n    RegisterCheckErrorCallback(app_get_check_error_val);\n    RegisterCheckWarningCallback(app_get_check_warning_val);\n    RegisterCheckStatusCallback(app_get_check_status_val);\n    RegisterCheckIoInputsStatusCallback(app_get_check_di_io_val);\n\n    AppParamInit();\n    MotorCtrlInit();  //电机控制相关初始化\n    AppInit();\n    AppStatusScanInit();\n    ScopeInit();\n    AppBrakeControlInit();\n    AppMotionPreConditionInit();\n\n\n\n    int rc = ZmqHandlerInit();\n    if (rc != 0)\n    {\n        printf(\"zmq_init failed, rc = %d\\n\", rc);\n        return -1;\n    }\n\n    RegisterSendCallback(ZmqSendData);\n    RegisterRecvCallback(&MavlinkRecvCallback);\n\n    HighPrecisionTimer* motor_ctrl_timer = CreateHighPrecisionTimer(MotorCtrlTimerCallback, NULL, NULL);\n    StartHighPrecisionTimer(motor_ctrl_timer, 0, 1);\n    HighPrecisionTimer* unreal_time_timer = CreateHighPrecisionTimer(UnrealTimeCallback, NULL, NULL);\n    StartHighPrecisionTimer(unreal_time_timer, 0, 1);\n    HighPrecisionTimer* zmq_recv_timer = CreateHighPrecisionTimer(ZmqRecvTimerCallback, &kAxis, &kAxisDw);\n    StartHighPrecisionTimer(zmq_recv_timer, 0, 1);\n\n    printf(\"The virtual driver and motor are running, press Enter to stop...\\n\");\n    getchar();\n\n    DestroyHighPrecisionTimer(motor_ctrl_timer);\n    DestroyHighPrecisionTimer(unreal_time_timer);\n    DestroyHighPrecisionTimer(zmq_recv_timer);\n\n    ZmqDestroy();\n}", "cut": false, "note": ""}, "SIL_project/zmq/src/zmq_handler.c:ZmqHandlerInit": {"file": "SIL_project/zmq/src/zmq_handler.c", "line": 11, "src": "int ZmqHandlerInit(void)\n{\n    context = zmq_ctx_new();\n    responder = zmq_socket(context, ZMQ_PAIR);\n    int rc = zmq_bind(responder, \"tcp://localhost:5555\");\n    return rc;\n}", "cut": false, "note": ""}, "SIL_project/zmq/src/zmq_handler.c:RegisterRecvCallback": {"file": "SIL_project/zmq/src/zmq_handler.c", "line": 56, "src": "void RegisterRecvCallback(void* callback) {\n    msgs_callback.recv_callback = (void (*)(void *args, void *args_dw, uint8_t rx_data[], uint32_t len))callback;\n}", "cut": false, "note": ""}, "SIL_project/main.c:CreateHighPrecisionTimer": {"file": "SIL_project/main.c", "line": 85, "src": "HighPrecisionTimer* CreateHighPrecisionTimer(TimerCallback callback, void* context, void* context_dw) {\n    HighPrecisionTimer* timer = (HighPrecisionTimer*)malloc(sizeof(HighPrecisionTimer));\n    if (!timer) return NULL;\n\n    timer->callback = callback;\n    timer->context = context;\n    timer->context_dw = context_dw;\n    timer->timerHandle = NULL;\n    timer->dueTime.QuadPart = 0;\n    timer->period = 0;\n\n    return timer;\n}", "cut": false, "note": ""}, "SIL_project/main.c:StartHighPrecisionTimer": {"file": "SIL_project/main.c", "line": 110, "src": "BOOL StartHighPrecisionTimer(HighPrecisionTimer* timer, ULONGLONG initialDelayMs, LONG periodMs) {\n    if (!timer) return FALSE;\n\n    // 转换为100纳秒单位 (1毫秒=10000个100纳秒)\n    timer->dueTime.QuadPart = -((LONGLONG)initialDelayMs * 10000);\n    timer->period = periodMs;\n\n    // 创建定时器队列定时器\n    // 注意：第一个参数是输出参数，用于接收定时器句柄\n    BOOL success = CreateTimerQueueTimer(\n        &timer->timerHandle,  // 输出参数，接收新定时器的句柄\n        NULL,                 // 默认定时器队列\n        (WAITORTIMERCALLBACK)TimerAPCProc,\n        timer,                // 传递给回调的参数\n        initialDelayMs,       // 首次触发延迟(ms)\n        periodMs,             // 周期(ms)，0表示只触发一次\n        WT_EXECUTEINTIMERTHREAD | WT_EXECUTEONLYONCE);\n\n    return success;\n}", "cut": false, "note": ""}, "embedded_project/Y01/Board/board.c:HOST_UART_IRQ_TASK": {"file": "embedded_project/Y01/Board/board.c", "line": 432, "src": "void HOST_UART_IRQ_TASK(void)\n{\n    HAL_UART_IRQHandler(&HOST_UART_HANDLE); // 调用HAL库的UART中断处理函数\n\n    if (__HAL_UART_GET_FLAG(&HOST_UART_HANDLE, UART_FLAG_IDLE))\n    {\n        __HAL_UART_CLEAR_IDLEFLAG(&HOST_UART_HANDLE);\n\n        HAL_UART_DMAStop(&HOST_UART_HANDLE);\n\n        // 调用Mavlink数据接收回调函数，处理接收到的数据\n        // 参数为接收缓冲区和实际接收到的数据长度\n#ifndef USE_CAN_MAVLINK_HOST\n        MavlinkRecvCallback(&kAxis, &kAxisDw, mavlink_rx_buff, MAVLINK_RECV_BUFF_SIZE - __HAL_DMA_GET_COUNTER(HOST_UART_HANDLE.hdmarx));\n#endif /* USE_CAN_MAVLINK_HOST */\n        // 重新启动DMA接收，准备接收下一批数据\n        HAL_UART_Receive_DMA(&HOST_UART_HANDLE, mavlink_rx_buff, MAVLINK_RECV_BUFF_SIZE);\n    }\n\n    // 及时检查溢出错误(ORE)，清除错误标志并重新启动DMA接收\n    if (__HAL_UART_GET_FLAG(&HOST_UART_HANDLE, UART_FLAG_ORE))\n    {\n        __HAL_UART_CLEAR_FLAG(&HOST_UART_HANDLE, UART_FLAG_ORE);\n        HAL_UART_DMAStop(&HOST_UART_HANDLE);\n        HAL_UART_Receive_DMA(&HOST_UART_HANDLE, mavlink_rx_buff, MAVLINK_RECV_BUFF_SIZE);\n    }\n}", "cut": false, "note": ""}, "SIL_project/zmq/src/zmq_handler.c:ZmqAsyncRecv": {"file": "SIL_project/zmq/src/zmq_handler.c", "line": 36, "src": "void ZmqAsyncRecv(void* args, void* args_dw) {\n    zmq_msg_t msg;\n    zmq_msg_init(&msg);\n\n    // 非阻塞接收\n    int rc = zmq_msg_recv(&msg, responder, ZMQ_DONTWAIT);\n    if (rc == -1) {\n        zmq_msg_close(&msg);\n        return;\n    }\n\n    // 处理消息\n    size_t size = zmq_msg_size(&msg);\n    // 调用注册的回调函数\n    if (msgs_callback.recv_callback != NULL) {\n        msgs_callback.recv_callback(args, args_dw, (uint8_t*)zmq_msg_data(&msg), size);\n    }\n    zmq_msg_close(&msg);\n}", "cut": false, "note": ""}, "embedded_project/Y01/Board/board.c:CAN_FDCAN_RX_FIFO1_CALLBACK": {"file": "embedded_project/Y01/Board/board.c", "line": 502, "src": "void CAN_FDCAN_RX_FIFO1_CALLBACK(FDCAN_HandleTypeDef *hfdcan, uint32_t RxFifo1ITs)\n{\n    if ((hfdcan->Instance == CAN_FDCAN_NUMBER) && (RxFifo1ITs & FDCAN_IT_RX_FIFO1_NEW_MESSAGE) != RESET)\n    {\n        fdcan_app_fifo1_handle(hfdcan);\n    }\n}", "cut": false, "note": ""}, "embedded_project/Y01/Board/drv_can_app.c:fdcan_app_fifo1_handle": {"file": "embedded_project/Y01/Board/drv_can_app.c", "line": 92, "src": "void fdcan_app_fifo1_handle(FDCAN_HandleTypeDef* hfdcan)\n{\n    // Check if FDCAN handle is valid\n    if (drv_can_app.p_fdcan == NULL || drv_can_app.p_fdcan->handle != hfdcan)\n    {\n        sys_set_bsp_error_state(ERROR_COMMS_INIT, ERROR_SET);\n        return;\n    }\n\n    // Get message from RX FIFO\n    if (HAL_FDCAN_GetRxMessage(hfdcan, FDCAN_RX_FIFO1, &drv_can_app.p_fdcan->rx_header, \\\n                               drv_can_app.p_fdcan->rx_data) != HAL_OK)\n    {\n        //Error_Handler();\n        return;\n    }\n    #if IS_USE_CAN_PASSTHROUGH == FC_CTRL_ON\n        fdcan_passthrough_handle(drv_can_app.p_fdcan);\n    #endif // IS_USE_CAN_PASSTHROUGH\n}", "cut": false, "note": ""}, "embedded_project/Y01/Board/drv_can_app.c:fdcan_passthrough_handle": {"file": "embedded_project/Y01/Board/drv_can_app.c", "line": 358, "src": "static inline void fdcan_passthrough_handle(FDCAN_DeviceTypeDef* bsp_fdcan)\n{\n    // Custom protocol handling logic：\n    uint16_t len;\n\n    /* DLC → 实际字节长度 */\n    len = bsp_fdcan_dlc_to_bytes(bsp_fdcan->rx_header.DataLength);\n\n    /* 根据 BRS 区分消息类型 */\n    if (bsp_fdcan->rx_header.BitRateSwitch == FDCAN_BRS_OFF)\n    {\n    #ifdef USE_CAN_MAVLINK_HOST\n        MavlinkRecvCallback(&kAxis, &kAxisDw, bsp_fdcan->rx_data, len);\n    #endif /* USE_CAN_MAVLINK_HOST */\n    }\n}", "cut": false, "note": ""}, "communication/callback/mavlink/mavlink_callback.c:MavlinkRecvCallback": {"file": "communication/callback/mavlink/mavlink_callback.c", "line": 119, "src": "void MavlinkRecvCallback(Axis *axis, AxisDw *axis_dw, uint8_t rx_data[], uint32_t len)\n{\n    bool is_mavlink_parse_success = false;\n\n    if (len > MAVLINK_RECV_BUFF_SIZE) {\n        len = MAVLINK_RECV_BUFF_SIZE;\n    }\n\n    for (uint32_t i = 0; i \u003c len; i++) {\n        if (mavlink_parse_char(MAVLINK_COMM_0, rx_data[i], &msg, &status)) {\n            mavlink_parse_fail_cnt = 0;  // 解析成功，重置失败计数器\n            is_mavlink_parse_success = true;\n            break;\n        }\n        else {\n            // 解析失败，增加计数器\n            mavlink_parse_fail_cnt++;\n            // 超过阈值时重置状态和缓存\n            if (mavlink_parse_fail_cnt >= MAVLINK_PARSE_ERROR_THRESHOLD) {\n                // 重置MAVLink通道状态、清零接收缓冲区\n                mavlink_reset_channel_status(MAVLINK_COMM_0);\n                mavlink_message_t *rx_buffer = mavlink_get_channel_buffer(MAVLINK_COMM_0);\n                memset(rx_buffer, 0, sizeof(mavlink_message_t));\n                // 重置失败计数器\n                mavlink_parse_fail_cnt = 0;\n            }\n        }\n    }\n\n    if (!is_mavlink_parse_success) {\n        return;\n    }\n\n    uint8_t sys_id = get_app_Sys_id();\n    uint8_t comp_id = get_app_Comp_id();\n\n    if(msg.msgid == MAVLINK_MSG_ID_READ_PARAM){\n        mavlink_msg_read_param_decode(&msg, &read_param);\n        switch (read_param.struct_id){\n            case MAVLINK_MSG_ID_ScopeConfig:\n                mavlink_scope_config_callback(&scope_config, &kScopeObject, SCOPE_READ);\n                mavlink_msg_scopeconfig_encode(sys_id, comp_id, &send_msg, &scope_config);\n                break;\n            case MAVLINK_MSG_ID_ScopeControl:\n                mavlink_scope_control_callback(&scope_control, &kScopeObject, SCOPE_READ);\n                mavlink_msg_scopecontrol_encode(sys_id, comp_id, &send_msg, &scope_control);\n                break;\n            case MAVLINK_MSG_ID_ScopeData:\n                mavlink_get_scope_data_callback(&scope_data, &scope_control, &kScopeObject, SCOPE_READ);\n                mavlink_msg_scopedata_encode(sys_id, comp_id, &send_msg, &scope_data);\n                break;\n            case MAVLINK_MSG_ID_WaveformMap:\n                get_waveform_map(waveform_map.waveform_map_info);\n                mavlink_msg_waveformmap_encode(sys_id, comp_id, &send_msg, &waveform_map);\n                break;\n            case MAVLINK_MSG_ID_WaveformData:\n                get_waveform_data(waveform_data.waveform_data_array);\n                mavlink_msg_waveformdata_encode(sys_id, comp_id, &send_msg ite == 1)\n    {\n        master_cia402_write_callback(obj_index, obj_subindex, &obj_data);\n    }\n    else if (is_write == 0)\n    {\n        master_cia402_read_callback(obj_index, obj_subindex, &obj_data);\n    }\n    else\n    {\n        return;\n    }\n\n    // Prepare response\n    bsp_fdcan->tx_data[0] = is_write;\n    bsp_fdcan->tx_data[1] = obj_index & 0xFF;\n    bsp_fdcan->tx_data[2] = (obj_index >> 8) & 0xFF;\n    bsp_fdcan->tx_data[3] = obj_subindex;\n    bsp_fdcan->tx_data[4] = obj_data & 0xFF;\n    bsp_fdcan->tx_data[5] = (obj_data >> 8) & 0xFF;\n    bsp_fdcan->tx_data[6] = (obj_data >> 16) & 0xFF;\n    bsp_fdcan->tx_data[7] = (obj_data >> 24) & 0xFF;\n\n    // Send response\n    HAL_FDCAN_AddMessageToTxFifoQ(bsp_fdcan->handle, &bsp_fdcan->tx_can, bsp_fdcan->tx_data);\n}", "cut": false, "note": ""}, "communication/callback/cia402_od/master_cia402_callback.c:master_cia402_write_callback": {"file": "communication/callback/cia402_od/master_cia402_callback.c", "line": 5, "src": "UNS32 master_cia402_write_callback(uint16_t index, uint8_t subindex, void *data){\n    if(get_app_Comm_control_authority() == COMM_CONTROL_HOST){return ABORT_CODE_DRIVE_STATE_DENIED;}\n    switch(index){\n        case 0x6040: return OD_0x6040_Controlword_Write_Callback(subindex, data); break;\n        case 0x605A: return OD_0x605A_Quick_stop_option_code_Write_Callback(subindex, data); break;\n        case 0x6060: return OD_0x6060_Modes_of_operation_Write_Callback(subindex, data); break;\n        case 0x608F: return OD_0x608F_Position_encoder_resolution_Write_Callback(subindex, data); break;\n        case 0x6091: return OD_0x6091_Gear_ratio_Write_Callback(subindex, data); break;\n        case 0x607E: return OD_0x607E_Polarity_Write_Callback(subindex, data); break;\n        case 0x607A: return OD_0x607A_Target_position_Write_Callback(subindex, data); break;\n        case 0x607B: return OD_0x607B_Position_range_limit_Write_Callback(subindex, data); break;\n        case 0x607D: return ocol/CANopen/src/states.c:canDispatch": {"file": "communication/protocol/CANopen/src/states.c", "line": 63, "src": "void canDispatch(CO_Data* d, Message *m)\n{\n\tUNS16 cob_id = UNS16_LE(m->cob_id);\n\t switch(cob_id >> 7)\n\t{\n\t\tcase SYNC:\t\t/* can be a SYNC or a EMCY message */\n\t\t\tif(cob_id == 0x080)\t/* SYNC */\n\t\t\t{\n\t\t\t\tif(d->CurrentCommunicationState.csSYNC)\n\t\t\t\t\tproceedSYNC(d);\n\t\t\t} else \t\t/* EMCY */\n\t\t\t\tif(d->CurrentCommunicationState.csEmergency)\n\t\t\t\t\tproceedEMCY(d,m);\n\t\t\tbreak;\n\t\tcase TIME_STAMP:\n\t\tcase PDO1tx:\n\t\tcase PDO1rx:\n\t\tcase PDO2tx:\n\t\tcase PDO2rx:\n\t\tcase PDO3tx:\n\t\tcase PDO3rx:\n\t\tcase PDO4tx:\n\t\tcase PDO4rx:\n\t\t\tif (d->CurrentCommunicationState.csPDO)\n\t\t\t\tproceedPDO(d,m);\n\t\t\tbreak;\n\t\tcase SDOtx:\n\t\tcase SDOrx:\n\t\t\tif (d->CurrentCommunicationState.csSDO)\n\t\t\t\tproceedSDO(d,m);\n\t\t\tbreak;\n\t\tcase NODE_GUARD:\n\t\t\tif (d->CurrentCommunicationState.csLifeGuard)\n\t\t\t\tproceedNODE_GUARD(d,m);\n\t\t\tbreak;\n\t\tcase NMT:\n\t\t\tif (*(d->iam_a_slave))\n\t\t\t{\n\t\t\t\tproceedNMTstateChange(d,m);\n\t\t\t}\n            break;\n#ifdef CO_ENABLE_LSS\n\t\tcase LSS:\n\t\t\tif (!d->CurrentCommunicationState.csLSS)break;\n\t\t\tif ((*(d->iam_a_slave)) && cob_id==MLSS_ADRESS)\n\t\t\t{\n\t\t\t\tproceedLSS_Slave(d,m);\n\t\t\t}\n\t\t\telse if(!(*(d->iam_a_slave)) && cob_id==SLSS_ADRESS)\n\t\t\t{\n\t\t\t\tproceedLSS_Master(d,m);\n\t\t\t}\n\t\t\tbreak;\n#endif\n\t}\n}", "cut": false, "note": ""}, "communication/protocol/CANopen/src/sdo.c:proceedSDO": {"file": "communication/protocol/CANopen/src/sdo.c", "line": 751, "src": "UNS8 proceedSDO (CO_Data* d, Message *m)\n{\n\tUNS8 err;\n\tUNS8 cs;\n\tUNS8 line = 0;\n\tUNS32 nbBytes; \t\t/* received or to be transmited. */\n\tUNS8 nodeId = 0;  \t/* The node Id of the server if client otherwise unused */\n\tUNS8 CliServNbr;\n\tUNS8 whoami = SDO_UNKNOWN;  /* SDO_SERVER or SDO_CLIENT.*/\n\tUNS32 errorCode; /* while reading or writi

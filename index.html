line, CliServNbr, index, subIndex, SDO_UPLOAD_IN_PROGRESS);\n\t\t\t\t/* Transfer data from dictionary to the line structure. */\n\t\t\t\terrorCode = objdictToSDOline(d, line);\n\n\t\t\t\tif (errorCode) {\n\t\t\t\t\tMSG_ERR(0x1A94, \"SDO error : Unable to copy the data from object dictionary. Err code : \",\n\t\t\t\t\t\t\terrorCode);\n\t\t\t\t\tfailedSDO(d, CliServNbr, whoami, index, subIndex, errorCode);\n\t\t\t\t\treturn 0xFF;\n\t\t\t\t}\n\t\t\t\t/* Preparing the response.*/\n\t\t\t\tgetSDOlineRestBytes(d, line, &nbBytes);\t/* Nb bytes to transfer ? */\n\t\t\t\tif (nbBytes > 4) {\n\t\t\t\t\t/* normal transfer. (segmented). */\n\t\t\t\t\t/* code to send the initiate upload response. (cs = 2) */\n\t\t\t\t\tdata[0] = (UNS8)((2 \u003c\u003c 5) | 1);\n\t\t\t\t\tdata[1] = (UNS8)(index & 0xFF);        /* LSB */\n\t\t\t\t\tdata[2] = (UNS8)((index >> 8) & 0xFF); /* MSB */\n\t\t\t\t\tdata[3] = subIndex;\n\t\t\t\t\tdata[4] = (UNS8) nbBytes;\n\t\t\t\t\tdata[5] = (UNS8) (nbBytes >> 8);\n\t\t\t\t\tdata[6] = (UNS8) (nbBytes >> 16);\n\t\t\t\t\tdata[7] = (UNS8) (nbBytes >> 24);\n \t\t\t\t\tMSG_WAR(0x3A95, \"SDO. Sending normal upload initiate response defined at index 0x1200 + \", nodeId);", "cut": true, "note": ""}, "communication/protocol/CANopen/src/sdo.c:SDOlineToObjdict": {"file": "communication/protocol/CANopen/src/sdo.c", "line": 207, "src": "UNS32 SDOlineToObjdict (CO_Data* d, UNS8 line)\n{\n\tUNS32 size;\n\tUNS32 errorCode;\n\tMSG_WAR(0x3A08, \"Enter in SDOlineToObjdict \", line);\n\t/* if SDO initiated with e=0 and s=0 count is null, offset carry effective size*/\n\tif( d->transfers[line].count == 0)\n\t\td->transfers[line].count = d->transfers[line].offset;\n\tsize = d->transfers[line].count;\n\n#ifdef SDO_DYNAMIC_BUFFER_ALLOCATION\n\tif (size > SDO_MAX_LENGTH_TRANSFER)\n\t{\n\t\terrorCode = setODentry(d, d->transfers[line].index, d->transfers[line].subIndex,\n\t\t\t\t(void *) d->transfers[line].dynamicData, &size, 1);\n\t}\n\telse\n\t{\n\t\terrorCode = setODentry(d, d->transfers[line].index, d->transfers[line].subIndex,\n\t\t\t\t(void *) d->transfers[line].data, &size, 1);\n\t}\n#else //SDO_DYNAMIC_BUFFER_ALLOCATION\n\terrorCode = setODentry(d, d->transfers[line].index, d->transfers[line].subIndex,\n\t\t\t(void *) d->transfers[line].data, &size, 1);\n#endif //SDO_DYNAMIC_BUFFER_ALLOCATION\n\n\tif (errorCode != OD_SUCCESSFUL)\n\t\treturn errorCode;\n\tMSG_WAR(0x3A08, \"exit of SDOlineToObjdict \", line);\n\treturn 0;\n\n}", "cut": false, "note": ""}, "communication/protocol/CANopen/src/objacces.c:_setODentry": {"file": "communication/protocol/CANopen/src/objacces.c", "line": 173, "src": "UNS32 _setODentry( CO_Data* d,\n                   UNS16 wIndex,\n                   UNS8 bSubindex,\n                   void * pSourceData,\n                   UNS32 * pExpectedSize,\n                   UNS8 checkAccess,\n                   UNS8 endianize)\n{\n  (void)endianize;\n  UNS32 szData;\n  UNS8 dataType;\n  UNS32 errorCode;\n  const indextable *ptrTable;\n  ODCallback_t Callback;\n\n  ptrTable =(*d->scanIndexOD)(d, wIndex, &errorCode);\n  if (errorCode != OD_SUCCESSFUL)\n    return errorCode;\n\n  if( ptrTable->bSubCount \u003c= bSubindex ) {\n    /* Subindex not found */\n    accessDictionaryError(wIndex, bSubindex, 0, *pExpectedSize, OD_NO_SUCH_SUBINDEX);\n    return OD_NO_SUCH_SUBINDEX;\n  }\n  if (checkAccess && (ptrTable->pSubindex[bSubindex].bAccessType == RO)) {\n    MSG_WAR(0x2B25, \"Access Type : \", ptrTable->pSubindex[bSubindex].bAccessType);\n    accessDictionaryError(wIndex, bSubindex, 0, *pExpectedSize, OD_WRITE_NOT_ALLOWED);\n    return OD_WRITE_NOT_ALLOWED;\n  }\n\n\n  dataType = ptrTable->pSubindex[bSubindex].bDataType;\n  szData = ptrTable->pSubindex[bSubindex].size;\n  Callback = ptrTable->pSubindex[bSubindex].callback;\n\n  /* check the size, we must allow to store less bytes than data size, even for intergers\n\t (e.g. UNS40 : objdictedit will store it in a uint64_t, setting the size to 8 but PDO comes\n\t with 5 bytes so ExpectedSize is 5 */\n  if( *pExpectedSize == 0 || *pExpectedSize \u003c= szData )\n    {\n#ifdef CANOPEN_BIG_ENDIAN\n      /* re-endianize do not occur for bool, strings time and domains */\n      if(endianize && dataType > boolean && !(\n            dataType >= visible_string &&\n            dataType \u003c= domain))\n        {\n          /* we invert the data source directly. This let us do range\n            testing without */\n          /* additional temp variable */\n          UNS8 i;\n          for ( i = 0 ; i \u003c ( ptrTable->pSubindex[bSubindex].size >> 1)  ; i++)\n            {\n              UNS8 tmp =((UNS8 *)pSourceData) [(ptrTable->pSubindex[bSubindex].size - 1) - i];\n              ((UNS8 *)pSourceData) [(ptrTable->pSubindex[bSubindex].size - 1) - i] = ((UNS8 *)pSourceData)[i];\n              ((UNS8 *)pSourceData)[i] = tmp;\n            }\n        }\n#endif\n      errorCode = (*d->valueRangeTest)(dataType, pSourceData);\n      if (errorCode) {\n        accessDictionaryError(wIndex, bSubindex, szData, *pExpectedSize, errorCode);\n        return errorCode;\n      }\n\n      if(OD_Write_Callback) {\n        errorCode = OD_Write_Callback(wIndex,bSubindex,pSourceData);\n        OD_Write_Callback = 0;\n        if (errorCode != OD_SUCCESSFUL)\n          return errorCode;\n      }\n      else {\n        memcpy(ptrTable->pSubindex[bSubindex].pObject,pSourceData, *pExpectedSize);\n      }\n\n     /* TODO : CONFORM TO DS-301 :\n      *  - stop using NULL terminated strings\n      *  - store string size in td_subindex\n      * */\n      /* terminate visible_string with '\\0' */\n      if(dataType == visible_string && *pExpectedSize \u003c szData)\n        ((UNS8*)ptrTable->pSubindex[bSubindex].pObject)[*pExpectedSize] = 0;\n\n      *pExpectedSize = szData;\n\n      /* Callbacks */\n      if(Callback){\n        errorCode = (Callback)(d, ptrTable, bSubindex);\n        if(errorCode != OD_SUCCESSFUL)\n        {\n            return errorCode;\n        }\n      }\n\n      /* Store value if requested with user defined function\n\t     Function should return OD_ACCES_FAILED in case of store error */\n      if (ptrTable->pSubindex[bSubindex].bAccessType & TO_BE_SAVE){\n        return (*d->storeODSubIndex)(d, wIndex, bSubindex);\n      }\n      return OD_SUCCESSFUL;\n    }else{\n      *pExpectedSize = szData;\n      accessDictionaryError(wIndex, bSubindex, szData, *pExpectedSize, OD_LENGTH_DATA_INVALID);\n      return OD_LENGTH_DATA_INVALID;\n    }\n}", "cut": false, "note": ""}, "communication/callback/canopen/canopen_callback.c:SlaveOD_Write_Callback": {"file": "communication/callback/canopen/canopen_callback.c", "line": 11, "src": "UNS32 SlaveOD_Write_Callback(uint16_t index, uint8_t subindex, void *data)\n{\n    return master_cia402_write_callback(index, subindex, data);\n}", "cut": false, "note": ""}, "communication/protocol/CANopen/src/pdo.c:proceedPDO": {"file": "communication/protocol/CANopen/src/pdo.c", "line": 169, "src": "UNS8\nproceedPDO (CO_Data * d, Message * m)\n{\n  UNS8 numPdo;\n  UNS8 numMap;                  /* Number of the mapped varable */\n  UNS8 *pMappingCount = NULL;   /* count of mapped objects... */\n  /* pointer to the var which is mapped to a pdo... */\n  /*  void *     pMappedAppObject = NULL;   */\n  /* pointer fo the var which holds the mapping parameter of an\n     mapping entry */\n  UNS32 *pMappingParameter = NULL;\n  UNS8 *pTransmissionType = NULL;       /* pointer to the transmission\n                                           type */\n  UNS32 *pwCobId = NULL;\n  UNS8 Size;\n  UNS8 offset;\n  UNS8 status;\n  UNS32 objDict;\n  UNS16 offsetObjdict;\n  UNS16 lastIndex;\n\n  status = state2;\n\n  MSG_WAR (0x3935, \"proceedPDO, cobID : \", (UNS16_LE(m->cob_id) & 0x7ff));\n  offset = 0x00;\n  numPdo = 0;\n  numMap = 0;\n  if ((*m).rtr == NOT_A_REQUEST)\n    {\n      offsetObjdict = d->firstIndex->PDO_RCV;\n      lastIndex = d->lastIndex->PDO_RCV;\n\n      if (offsetObjdict)\n        while (offsetObjdict \u003c= lastIndex)\n          {\n            switch (status)\n              {\n\n              case state2:\n                pwCobId = d->objdict[offsetObjdict].pSubindex[1].pObject;\n                if (*pwCobId == UNS16_LE(m->cob_id))\n                  {\n                    /* The cobId is recognized */\n                    status = state4;\n                    MSG_WAR (0x3936, \"cobId found at index \",\n                             0x1400 + numPdo);\n                    break;\n                  }\n                else\n                  {\n                    /* received cobId does not match */\n                    numPdo++;\n                    offsetObjdict++;\n                    status = state2;\n                    break;\n                  }\n\n              case state4:     /* Get Mapped Objects Number */\n                /* The cobId of the message received has been found in the\n                   dictionnary. */\n                offsetObjdict = d->firstIndex->PDO_RCV_MAP;\n                lastIndex = d->lastIndex->PDO_RCV_MAP;\n                pMappingCount =\n                  (UNS8 *) (d->objdict + offsetObjdict +\n                            numPdo)->pSubindex[0].pObject;\n                numMap = 0;\n                while (numMap \u003c *pMappingCount)\n                  {\n                    UNS8 tmp[] = { 0, 0, 0, 0, 0, 0, 0, 0 };\n                    UNS32 ByteSize;\n                    pMappingParameter =\n                      (UNS32 *) (d->objdict + offsetObjdict +\n                                 numPdo)->pSubindex[numMap + 1].pObject;\n                    if (pMappingParameter == NULL)\n                      {\n                        MSG_ERR (0x1937, \"Couldn't get mapping parameter : \",\n                                 numMap + 1);\n                        return 0xFF;\n                      }\n                    /* Get the addresse of the mapped variable. */\n                    /* detail of *pMappingParameter : */\n                    /* The 16 hight bits contains the index, the medium 8 bits\n                       contains the subindex, */\n                    /* and the lower 8 bits contains the size of the mapped\n                       variable. */\n\n                    Size = (UNS8) (*pMappingParameter & (UNS32) 0x000000FF);\n\n                    /* set variable only if Size != 0 and\n                     * Size is lower than remaining bits in the PDO */\n                    if (Size && ((offset + Size) \u003c= (m->len \u003c\u003c 3)))\n                      {\n                        /* copy bit per bit in little endian */\n                        CopyBits (Size, (UNS8 *) & m->data[offset >> 3],\n                                  offset % 8, 0, ((UNS8 *) tmp), 0, 0);\n                        /*1->8 => 1 ; 9->16 =>2, ... */\n                        ByteSize = (UNS32)(1 + ((Size - 1) >> 3));\n\n                        objDict =\n                          setODentry (d, (UNS16) ((*pMappingParameter) >> 16),\n                                      (UNS8) (((*pMappingParameter) >> 8) &\n                                              0xFF), tmp, &ByteSize, 0);\n\n                        if (objDict != OD_SUCCESSFUL)\n                          {\n                            MSG_ERR (0x1938,\n                                     \"error accessing to the mapped var : \",\n                                     numMap + 1);\n                            MSG_WAR (0x2939, \"         Mapped at index : \",\n                                     (*pMappingParameter) >> 16);\n                            MSG_WAR (0x2940, \"                subindex : \",\n                                     ((*pMappingParameter) >> 8) & 0xFF);\n                            return 0xFF;\n                          }\n\n                        MSG_WAR (0x3942,\n                                 \"Variable updated by PDO cobid : \",\n                                 UNS16_LE(m->cob_id));\n                        MSG_WAR (0x3943, \"         Mapped at index : \",\n                                 (*pMappingParameter) >> 16);\n                        MSG_WAR (0x3944, \"                subindex : \",\n                                 ((*pMappingParameter) >> 8) & 0xFF);\n                        offset += Size;\n                      }\n                    numMap++;\n                  }             /* end loop while on mapped variables */\n                if (d->RxPDO_EventTimers)\n                {\n                    TIMEVAL EventTimerDuration = *(UNS16 *)d->objdict[offsetObjdict].pSubindex[5].pObject;\n                    if(EventTimerDuration){\n                        DelAlarm (d->RxPDO_EventTimers[numPdo]);\n                        d->RxPDO_EventTimers[numPdo] = SetAlarm (d, numPdo, d->RxPDO_EventTimers_Handler,\n                        MS_TO_TIMEVAL (EventTimerDuration), 0);\n                    }\n                }\n                return 0;\n\n              }                 /* end switch status */\n          }                     /* end while */\n    }                           /* end if Donnees */\n  else if ((*m).rtr == REQUEST)\n    {\n      MSG_WAR (0x3946, \"Receive a PDO request cobId : \", UNS16_LE(m->cob_id));\n      status = state1;\n      offsetObjdict = d->firstIndex->PDO_TRS;\n      lastIndex = d->lastIndex->PDO_TRS;\n      if (offsetObjdict)\n        while (offsetObjdict \u003c= lastIndex)\n          {\n            /* study of all PDO stored in the objects dictionary */\n\n            switch (status)\n              {\n\n              case state1:     /* check the CobId */\n                /* get CobId of the dictionary which match to the received PDO\n                 */\n                pwCobId =\n                   (d->objdict +\n                             offsetObjdict)->pSubindex[1].pObject;\n                if (*pwCobId == UNS16_LE(m->cob_id))\n                  {\n                    status = state4;\n                    break;\n                  }\n                else\n                  {\n                    numPdo++;\n                    offsetObjdict++;\n                  }\n                status = state1;\n                break;\n\n\n              case state4:     /* check transmission type */\n                pTransmissionType =\n                  (UNS8 *) d->objdict[offsetObjdict].pSubindex[2].pObject;\n                /* If PDO is to be sampled and send on RTR, do it */\n                if ((*pTransmissionType == TRANS_RTR))\n                  {\n                    status = state5;\n                    break;\n                  }\n                /* RTR_SYNC means data prepared at SYNC, transmitted on RTR */\n                else if ((*pTransmissionType == TRANS_RTR_SYNC))\n                  {\n                    if (d->PDO_status[numPdo].\n                        transmit_type_parameter & PDO_RTR_SYNC_READY)\n                      {\n                        /*Data ready, just send */\n                        canSend (d->canHandle,\n                                 &d->PDO_status[numPdo].last_message);\n                        return 0;\n                      }\n                    else\n                      {\n                        /* if SYNC did never occur, transmit current data */\n                        /* DS301 do not tell what to do in such a case... */\n                        MSG_ERR (0x1947,\n                                 \"Not ready RTR_SYNC TPDO send current data : \",\n                                 UNS16_LE(m->cob_id));\n                        status = state5;\n                      }\n                    break;\n                  }\n                else if ((*pTransmissionType == TRANS_EVENT_PROFILE) ||\n                         (*pTransmissionType == TRANS_EVENT_SPECIFIC))\n                  {\n                    /* Zap all timers and inhibit flag */\n                    d->PDO_status[numPdo].event_timer =\n                      DelAlarm (d->PDO_status[numPdo].event_timer);\n                    d->PDO_status[numPdo].inhibit_timer =\n                      DelAlarm (d->PDO_status[numPdo].inhibit_timer);\n                    d->PDO_status[numPdo].transmit_type_parameter &=\n                      ~PDO_INHIBITED;\n                    /* Call  PDOEventTimerAlarm for this TPDO,\n                     * this will trigger emission et reset timers */\n                    PDOEventTimerAlarm (d, numPdo);\n                    return 0;\n                  }\n                else\n                  {\n                    /* The requested PDO is not to send on request. So, does\n                       nothing. */\n                    MSG_WAR (0x2947, \"PDO is not to send on request : \",\n                             UNS16_LE(m->cob_id));\n                    return 0xFF;\n                  }\n\n              case state5:     /* build and send requested PDO */\n                {\n                  Message pdo;\n                  if (buildPDO (d, numPdo, &pdo))\n                    {\n                      MSG_ERR (0x1948, \" Couldn't build TPDO number : \", numPdo);\n                      return 0xFF;\n                    }\n                  canSend (d->canHandle, &pdo);\n                  return 0;\n                }\n              }                 /* end switch status */\n          }                     /* end while */\n    }                           /* end if Requete */\n\n  return 0;\n}", "cut": false, "note": ""}, "database/data_param.c:set_app_Target_update_state": {"file": "database/data_param.c", "line": 2951, "src": "uint32_t set_app_Target_update_state(uint8_t val)\n{\n    /* USER CODE BEGIN set_app_Target_update_state 0 */\n    /* USER CODE END set_app_Target_update_state 0 */\n    kAppMotionInfo.Target_update_state = val;\n    /* USER CODE BEGIN set_app_Target_update_state 1 */\n    /* USER CODE END set_app_Target_update_state 1 */\n    return APP_PARAM_SUCCESS;\n}", "cut": false, "note": ""}, "embedded_project/Y01/Board/drv_can_app.c:fdcan_encos_handle": {"file": "embedded_project/Y01/Board/drv_can_app.c", "line": 247, "src": "static inline void fdcan_encos_handle(FDCAN_DeviceTypeDef* bsp_fdcan)\n{\n    return; // TODO\n}", "cut": false, "note": ""}, "embedded_project/Y01/Board/drv_can_app.c:fdcan_custom_handle": {"file": "embedded_project/Y01/Board/drv_can_app.c", "line": 339, "src": "static inline void fdcan_custom_handle(FDCAN_DeviceTypeDef* bsp_fdcan)\n{\n    // Custom protocol handling logic：\n    bool is_ide = bsp_fdcan->rx_header.IdType == FDCAN_EXTENDED_ID;\n    if (bsp_fdcan->rx_header.FDFormat == FDCAN_CLASSIC_CAN)\n    {\n        bsp_can_send_message(drv_can_app.p_fdcan, bsp_fdcan->id, is_ide, \\\n                             false, bsp_fdcan->rx_data, bsp_fdcan->rx_header.DataLength);\n    }\n    else\n    {\n        bool is_brs = bsp_fdcan->rx_header.BitRateSwitch == FDCAN_BRS_ON;\n        bsp_fdcan_send_message(drv_can_app.p_fdcan, bsp_fdcan->id, is_ide, \\\n                               is_brs, bsp_fdcan->rx_data, bsp_fdcan->rx_header.DataLength);\n    }\n}", "cut": false, "note": ""}, "communication/protocol/EtherCAT_LAN925x/Src/ecatappl.c:MainLoop": {"file": "communication/protocol/EtherCAT_LAN925x/Src/ecatappl.c", "line": 978, "src": "void MainLoop(void)\n{\n\n    /*return if initialization not finished */\n    if(bInitFinished == FALSE)\n    {\n        return;\n    }\n\n\n\n        /* FreeRun-Mode:  bEscIntEnabled = FALSE, bDcSyncActive = FALSE\n           Synchron-Mode: bEscIntEnabled = TRUE, bDcSyncActive = FALSE\n           DC-Mode:       bEscIntEnabled = TRUE, bDcSyncActive = TRUE */\n        if (\n            (!bEscIntEnabled || !bEcatFirstOutputsReceived)     /* SM-Synchronous, but not SM-event received */\n          && !bDcSyncActive                                               /* DC-Synchronous */\n            )\n        {\n            /* if the application is running in ECAT Synchron Mode the function ECAT_Application is called\n               from the ESC interrupt routine,\n               in ECAT Synchron Mode it should be additionally checked, if the SM-event is received\n               at least once (bEcatFirstOutputsReceived = 1), otherwise no interrupt is generated\n               and the function ECAT_Application has to be called here (with interrupts disabled,\n               because the SM-event could be generated while executing ECAT_Application) */\n            if ( !bEscIntEnabled )\n            {\n                /* application is running in ECAT FreeRun Mode,\n                   first we have to check, if outputs were received */\n                UINT16 ALEvent = HW_GetALEventRegister();\n                ALEvent = SWAPWORD(ALEvent);\n\n                if ( ALEvent & PROCESS_OUTPUT_EVENT )\n                {\n                    /* set the flag for the state machine behavior */\n                    bEcatFirstOutputsReceived = TRUE;\n                    if ( bEcatOutputUpdateRunning )\n                    {\n                        /* update the outputs */\n                        PDO_OutputMapping();\n                    }\n                }\n                else if ( nPdOutputSize == 0 )\n                {\n                    /* if no outputs are transmitted, the watchdog must be reset, when the inputs were read */\n                    if ( ALEvent & PROCESS_INPUT_EVENT )\n                    {\n                        /* Outputs were updated, set flag for watchdog monitoring */\n                        bEcatFirstOutputsReceived = TRUE;\n                    }\n                }\n            }\n\n            DISABLE_ESC_INT();\n             ECAT_Application();\n\n/*ECATCHANGE_START(V5.13) ECAT 5*/\n             if ( (bEcatInputUpdateRunning  == TRUE) && (nPdInputSize > 0))\n/*ECATCHANGE_END(V5.13) ECAT 5*/\n             {\n                /* EtherCAT slave is at least in SAFE-OPERATIONAL, update inputs */\n                PDO_InputMapping();\n            }\n            ENABLE_ESC_INT();\n        }\n\n\n        if (u32CheckForDcOverrunCnt >= CHECK_DC_OVERRUN_IN_MS)\n        {\n            COE_SyncTimeStamp();\n        }\n\n        /* call EtherCAT functions */\n        ECAT_Main();\n\n        /* call lower prior application part */\n       COE_Main();\n       CheckIfEcatError();\n\n\n    if (pAPPL_MainLoop != NULL)\n    {\n        pAPPL_MainLoop();\n    }\n}", "cut": false, "note": ""}, "communication/protocol/EtherCAT_LAN925x/Src/ecatslv.c:ECAT_Main": {"file": "communication/protocol/EtherCAT_LAN925x/Src/ecatslv.c", "line": 2786, "src": "void ECAT_Main(void)\n{\n    UINT16 ALEventReg;\n    UINT16 EscAlControl = 0x0000;\n/*ECATCHANGE_START(V5.13) MBX1*/\n     UINT32 sm1Activate = SM_SETTING_ENABLE_VALUE;\n     UINT32 sm1Status = 0; /*SM1 status need to be read (not MBX_READ_EVENT) to handle readframes with invalid CRCs*/\n/*ECATCHANGE_END(V5.13) MBX1*/\n\n\n    /* check if services are stored in the mailbox */\n    MBX_Main();\n\n\n    if ( bMbxRunning )\n    {\n        /* Slave is at least in PREOP, Mailbox is running */\n\n/*ECATCHANGE_START(V5.13) MBX1*/\n        /*get registers 0x80C:0x80F and mask for SM active state (this is required to access an valid 32bit address)*/\n        HW_EscReadDWord(sm1Activate,(ESC_SYNCMAN_CONTROL_OFFSET + SIZEOF_SM_REGISTER));\n        sm1Activate = SWAPDWORD(sm1Activate);\n        sm1Status = sm1Activate;\n/*ECATCHANGE_END(V5.13) MBX1*/\n    }\n\n    /* Read AL Event-Register from ESC */\n    ALEventReg = HW_GetALEventRegister();\n    ALEventReg = SWAPWORD(ALEventReg);\n\n\n    if ((ALEventReg & AL_CONTROL_EVENT) && !bEcatWaitForAlControlRes)\n    {\n        /* AL Control event is set, get the AL Control register sent by the Master to acknowledge the event\n          (that the corresponding bit in the AL Event register will be reset) */\n        UINT32 tmpVal = 0;\n\n        HW_EscReadDWord( tmpVal, ESC_AL_CONTROL_OFFSET);\n        EscAlControl = (UINT16) SWAPDWORD(tmpVal);\n\n\n\n        /* reset AL Control event and the SM Change event (because the Sync Manager settings will be checked\n           in AL_ControlInd, too)*/\n            ALEventReg &= ~((AL_CONTROL_EVENT) | (SM_CHANGE_EVENT));\n\n            AL_ControlInd((UINT8)EscAlControl, 0); /* in AL_ControlInd the state transition will be checked and done */\n\n            /* SM-Change-Event was handled too */\n\n    }\n\n    if ( (ALEventReg & SM_CHANGE_EVENT) && !bEcatWaitForAlControlRes && (nAlStatus & STATE_CHANGE) == 0 && (nAlStatus & ~STATE_CHANGE) != STATE_INIT )\n    {\n        /* the SM Change event is set (Bit 4 of Register 0x220), when the Byte 6 (Enable, Lo-Byte of Register 0x806, 0x80E, 0x816,...)\n           of a Sync Manager channel was written */\n        ALEventReg &= ~(SM_CHANGE_EVENT);\n\n        /* AL_ControlInd is called with the actual state, so that the correct SM settings will be checked */\n        AL_ControlInd(nAlStatus & STATE_MASK, 0);\n    }\n\n    if(bEcatWaitForAlControlRes)\n    {\n        AL_ControlRes();\n    }\n    /*The order of mailbox event processing was changed to prevent race condition errors.\n        The SM1 activate Byte (Register 0x80E) was read before reading AL Event register.\n        1. Handle Mailbox Read event\n        2. Handle repeat toggle request\n        3. Handle Mailbox write event\n    */\n    if ( bMbxRunning )\n    {\n        /*SnycManger change event (0x220:4) could be acknowledged by reading the SM1 control register without notification to the local application\n        => check if the SyncManger 1 is still enabled*/\n            if (!(sm1Activate & SM_SETTING_ENABLE_VALUE))\n            {\n                AL_ControlInd(nAlStatus & STATE_MASK, 0);\n            }\n\n/*ECATCHANGE_START(V5.13) MBX1*/\n        if (((sm1Status & SM_STATUS_MBX_BUFFER_FULL) == 0)\n            && bSendMbxIsFull)\n/*ECATCHANGE_END(V5.13) MBX1*/\n        {\n            /* SM 1 (Mailbox Read) event is set, when the mailbox was read from the master,\n               to acknowledge the event the first byte of the mailbox has to be written,\n               by writing the first byte the mailbox is locked, too */\n            u32dummy = 0;\n            HW_EscWriteDWord(u32dummy,u16EscAddrSendMbx);\n\n            /* the Mailbox Read event in the variable ALEventReg shall be reset before calling\n               MBX_MailboxReadInd, where a new mailbox datagram (if available) could be stored in the send mailbox */\n            ALEventReg &= ~(MAILBOX_READ_EVENT);\n            MBX_MailboxReadInd();\n        }\n\n            /* bMbxRepeatToggle holds the last state of the Repeat Bit (Bit 1) */\n\n            if (((sm1Activate & SM_SETTING_REPAET_REQ_MASK) && !bMbxRepeatToggle)\n                || (!(sm1Activate & SM_SETTING_REPAET_REQ_MASK) && bMbxRepeatToggle))\n            {\n                /* Repeat Bit (Bit 1) has toggled, there is a repeat request, in MBX_MailboxRepeatReq the correct\n                   response will put in the send mailbox again */\n                MBX_MailboxRepeatReq();\n                /* acknowledge the repeat request after the send mailbox was updated by writing the Repeat Bit\n                   in the Repeat Ack Bit (Bit 1) of the PDI Ctrl-Byte of SM 1 (Register 0x80F) */\n                if (bMbxRepeatToggle)\n                {\n                    sm1Activate |= SM_SETTING_REPEAT_ACK; //set repeat acknowledge bit (bit 25)\n                }\n                else\n                {\n                    sm1Activate &= ~SM_SETTING_REPEAT_ACK; //clear repeat acknowledge bit (bit 25)\n                }\n\n                sm1Activate = SWAPDWORD(sm1Activate);\n                HW_EscWriteDWord(sm1Activate, (ESC_SYNCMAN_CONTROL_OFFSET + SIZEOF_SM_REGISTER));\n            }\n\n\n        /* Reload the AlEvent because it may be changed due to a SM disable, enable in case of an repeat request */\n        ALEventReg = HW_GetALEventRegister();\n        ALEventReg = SWAPWORD(ALEventReg);\n\n        if ( ALEventReg & (MAILBOX_WRITE_EVENT) )\n        {\n            /* SM 0 (Mailbox Write) event is set, when the mailbox was written from the master,\n               to acknowledge the event the first byte of the mailbox has to be read,\n               which will be done in MBX_CheckAndCopyMailbox */\n            /* the Mailbox Write event in the variable ALEventReg shall be reset before calling\n               MBX_CheckAndCopyMailbox, where the received mailbox datagram will be processed */\n            ALEventReg &= ~(MAILBOX_WRITE_EVENT);\n            MBX_CheckAndCopyMailbox();\n\n        }\n    }\n}", "cut": false, "note": ""}, "communication/protocol/EtherCAT_LAN925x/Src/mailbox.c:MBX_Main": {"file": "communication/protocol/EtherCAT_LAN925x/Src/mailbox.c", "line": 995, "src": "void MBX_Main(void)\n{\n    TMBX MBXMEM *pMbx = NULL;\n\n    do\n    {\n        UINT8 result = 0;\n\n        pMbx = GetOutOfMbxQueue(&sMbxReceiveQueue);\n        if ( pMbx )\n        {\n            result = MailboxServiceInd(pMbx);\n        }\n\n        if ( result != 0 )\n        {\n            /* Mailbox error response: type 0 (mailbox service protocol) */\n            pMbx->MbxHeader.Length     = 4;\n            pMbx->MbxHeader.Flags[MBX_OFFS_TYPE]        &= ~(MBX_MASK_TYPE);\n            pMbx->Data[0]                        = SWAPWORD(MBXSERVICE_MBXERRORCMD);\n            pMbx->Data[1]                        = SWAPWORD(result);\n            MBX_MailboxSendReq(pMbx, 0);\n        }\n    }\n    while ( pMbx != NULL );\n\n    //dump queued emcy message if send mailbox buffer is empty\n    if(bMbxRunning && !bSendMbxIsFull && !EMCY_IsQueueEmpty())\n    {\n        TEMCYMESSAGE EMCYMEM *pEmcy = GetOutOfSendEmcyQueue();\n        EMCY_SendEmergency(pEmcy);\n    }\n\n    if (bReceiveMbxIsLocked)\n    {\n        /* the work on the receive mailbox is locked, check if it can be unlocked (if all\n           mailbox commands has been sent */\n        MBX_CheckAndCopyMailbox();\n    }\n\n    /*ECATCHANGE_START(V5.13) EOE1*/\n    /*Try to send pending Mailbox data,\n       could be to pending previously due to local (memory) limitations which are no available*/\n    if (u8MailboxSendReqStored)\n    {\n        /* there are mailbox services stored to be sent */\n        if (u8MailboxSendReqStored & EOE_SERVICE)\n        {\n            /* reset the flag indicating that EoE service to be sent was stored */\n            u8MailboxSendReqStored &= ~EOE_SERVICE;\n            /* call EoE function that will send the stored EoE service */\n            EOE_ContinueInd();\n        }\n    }\n/*ECATCHANGE_END(V5.13) EOE1*/\n}", "cut": false, "note": ""}, "communication/protocol/EtherCAT_LAN925x/Src/mailbox.c:MailboxServiceInd": {"file": "communication/protocol/EtherCAT_LAN925x/Src/mailbox.c", "line": 457, "src": "UINT8 MailboxServiceInd(TMBX MBXMEM *pMbx)\n{\n    UINT8 result;\n\n    /*only FoE is allowed in Boot mode*/\n    if(bBootMode == TRUE && (MBX_TYPE_FOE != ((pMbx->MbxHeader.Flags[MBX_OFFS_TYPE] & MBX_MASK_TYPE) >> MBX_SHIFT_TYPE )))\n    {\n        return MBXERR_UNSUPPORTEDPROTOCOL;\n    }\n\n    switch ( (pMbx->MbxHeader.Flags[MBX_OFFS_TYPE] & MBX_MASK_TYPE) >> MBX_SHIFT_TYPE )\n    {\n    case MBX_TYPE_COE:\n        /* CoE datagram received */\n        result = COE_ServiceInd((TCOEMBX MBXMEM *) pMbx);\n        break;\n\n    case MBX_TYPE_EOE:\n        /* EoE datagram received */\n        result = EOE_ServiceInd(pMbx);\n        break;\n\n    case MBX_TYPE_FOE:\n        /* FoE datagram received */\n        result = FOE_ServiceInd((TFOEMBX MBXMEM *) pMbx);\n        break;\n\n    default:\n\n        result = MBXERR_UNSUPPORTEDPROTOCOL;\n        break;\n    }\n\n    return result;\n}", "cut": false, "note": ""}, "communication/protocol/EtherCAT_LAN925x/Src/ecatcoe.c:COE_ServiceInd": {"file": "communication/protocol/EtherCAT_LAN925x/Src/ecatcoe.c", "line": 104, "src": "UINT8 COE_ServiceInd(TCOEMBX MBXMEM *pCoeMbx)\n{\n    UINT8 result = 0;\n\n    switch ((pCoeMbx->CoeHeader & COEHEADER_COESERVICEMASK) >> COEHEADER_COESERVICESHIFT)\n    {\n    case COESERVICE_SDOREQUEST:\n        /* SDO-Request received, call SDOS_SdoInd to process the SDO-Request\n           if an existing SDO-Stack shall be used, the corresponding function\n            should be called */\n        result = SDOS_SdoInd( (TINITSDOMBX MBXMEM *) pCoeMbx );\n        break;\n\n    case COESERVICE_SDOINFO:\n        /* SDO-Information Request received, call SDOS_SdoInfoInd to process the SDO-Request */\n        result = SDOS_SdoInfoInd( (TSDOINFORMATION MBXMEM *) pCoeMbx );\n        /*NOERROR_INWORK is never returned by SDOS_SdoInfoInd() => delete return code handling*/\n        break;\n\n\n    case COESERVICE_SDORESPONSE:\n    case COESERVICE_EMERGENCY:\n    case COESERVICE_TXPDO:\n    case COESERVICE_RXPDO:\n    case COESERVICE_TXPDOREMREQ:\n    case COESERVICE_RXPDOREMREQ:\n        /* these CoE services are not supported yet */\n        result = MBXERR_SERVICENOTSUPPORTED;\n        break;\n\n    default:\n        result = MBXERR_INVALIDHEADER;\n        break;\n    }\n    return result;\n}", "cut": false, "note": ""}, "communication/protocol/EtherCAT_LAN925x/Src/sdoserv.c:SDOS_SdoInd": {"file": "communication/protocol/EtherCAT_LAN925x/Src/sdoserv.c", "line": 624, "src": "UINT8 SDOS_SdoInd(TINITSDOMBX MBXMEM *pSdoInd)\n{\n\tUINT8 abort = 0;\n\tUINT8 sdoHeader = (pSdoInd->SdoHeader.Sdo[SDOHEADER_COMMANDOFFSET] & SDOHEADER_COMMANDMASK) >> SDOHEADER_COMMANDSHIFT;\n\t/* the SDO-command is in bit 5-7 of the first SDO-Byte */\n\tUINT8 command = (sdoHeader & SDOHEADER_COMMAND);\n\t/* mbxSize contains the size of the mailbox (CoE-Header (2 Bytes) + SDO-Header (8 Bytes) + SDO-Data (if the data length is greater than 4)) */\n\tUINT16 mbxSize = SWAPWORD(pSdoInd->MbxHeader.Length);\n\tUINT16 index;\n\tUINT8 subindex;\n\tOBJCONST TOBJECT OBJMEM * pObjEntry;\n\t/* this variable contains the information, if all entries of an object will be read (bCompleteAccess > 0) or a single entry */\n\tUINT8 bCompleteAccess = 0;\n\tUINT32 objLength = 0;\n\tUINT32 dataSize = 0;\n\n\tif (bSdoInWork)\n\t{\n\t\t/* the last SDO is still in work */\n\t\treturn MBXERR_SERVICEINWORK;\n\t}\n\n/* ECATCHANGE_START(V5.13) COE5*/\n\tif (sdoHeader & SDOHEADER_COMPLETEACCESS)\n\t{\n\t\tbCompleteAccess = 1;\n\t}\n/* ECATCHANGE_END(V5.13) COE5*/\n\n\tswitch (command)\n\t{\n\tcase SDOSERVICE_INITIATEDOWNLOADREQ:\n\tcase SDOSERVICE_INITIATEUPLOADREQ:\n\t\t/* the variable index contains the requested index of the SDO service */\n\t\tindex = pSdoInd->SdoHeader.Sdo[SDOHEADER_INDEXHIOFFSET] & SDOHEADER_INDEXHIMASK;\n\t\tindex \u003c\u003c= 8;\n\t\tindex += (pSdoInd->SdoHeader.Sdo[SDOHEADER_INDEXLOOFFSET] >> SDOHEADER_INDEXLOSHIFT) & SDOHEADER_INDEXLOMASK;\n\t\t/* the variable subindex contains the requested subindex of the SDO service */\n\t\tsubindex = (pSdoInd->SdoHeader.Sdo[SDOHEADER_SUBINDEXOFFSET] >> SDOHEADER_SUBINDEXSHIFT) & SDOHEADER_SUBINDEXMASK;\n\n\n\n\n\n\t\t/* OBJ_GetObjectHandle checks if the requested index is defined in the object dictionary */\n\t\tpObjEntry = OBJ_GetObjectHandle(index);\n\n\t\tif (pObjEntry)\n\t\t{\n\t\t\t/* transferType contains the information if the SDO Download Request or the SDO Upload Response\n\t\t\t   can be an expedited service (SDO data length \u003c= 4, that means the data is stored in the\n\t\t\t\tSDO-Header completely */\n\t\t\tUINT8 bTransferType = 0;\n\t\t\t/* pData is the pointer to the received (SDO-Download) or sent (SDO-Upload) SDO data in the mailbox */\n\t\t\tUINT16 MBXMEM * pData = NULL;\n\t\t\tUINT8 segTransfer = 0;\n\n\t\t\t{\n\t\t\t\tUINT8 maxSubindex = (pObjEntry->ObjDesc.ObjFlags & OBJFLAGS_MAXSUBINDEXMASK) >> OBJFLAGS_MAXSUBINDEXSHIFT;\n\n\t\t\t\tif (subindex > maxSubindex)\n\t\t\t\t{\n\t\t\t\t\tabort = ABORTIDX_SUBINDEX_NOT_EXISTING;\n\t\t\t\t}\n\t\t\t\telse\n\t\t\t\t{\n\t\t\t\t\tdataSize = objLength = OBJ_GetObjectLength(index, subindex, pObjEntry, (UINT8)(sdoHeader & SDOHEADER_COMPLETEACCESS));\n\t\t\t\t}\n\n\t\t\t\tif (abort == 0)\n\t\t\t\t{\n\t\t\t\t\tif (command == SDOSERVICE_INITIATEUPLOADREQ)\n\t\t\t\t\t{\n\t\t\t\t\t\t/* SDO Upload */\n\t\t\t\t\t\tif (mbxSize != EXPEDITED_FRAME_SIZE)\n\t\t\t\t\t\t{\n\t\t\t\t\t\t\t/* a SDO Upload request has always a fixed size (2 Byte CoE-Header plus 8 Byte SDO-Header) */\n\t\t\t\t\t\t\treturn MBXERR_INVALIDSIZE;\n\t\t\t\t\t\t}\n\t\t\t\t\t\t/* distinguish between expedited and normal upload response within the length of the response data */\n\t\t\t\t\t\tif ((objLength \u003c= MAX_EXPEDITED_DATA) && objLength != 0)\n\t\t\t\t\t\t{\n\t\t\t\t\t\t\t/* Expedited Upload */\n\t\t\t\t\t\t\tbTransferType = 1;\n\t\t\t\t\t\t\t/* pData is the pointer where the object data has to be copied for the response */\n\t\t\t\t\t\t\tpData = (UINT16 MBXMEM *) ((TINITSDOUPLOADEXPRESMBX MBXMEM *) pSdoInd)->Data;\n\t\t\t\t\t\t\t\t\t\t\t\t\t/* initialize the 4 data bytes of the SDO upload response because the requested object data\n\t\t\t\t\t\t\t\t\t\t\t\t\t\tcould be less than 4 */\n\t\t\t\t\t\t\tpData[0] = 0;\n\t\t\t\t\t\t\tpData[1] = 0;\n\t\t\t\t\t\t}\n\t\t\t\t\t\telse\n\t\t\t\t\t\t{\n\t\t\t\t\t\t\t/* HBu 06.02.06: the variable dataSize has to be set to the available size in one mailbox */\n\t\t\t\t\t\t\tdataSize = u16SendMbxSize - MBX_HEADER_SIZE - UPLOAD_NORM_RES_SIZE;\n\t\t\t\t\t\t\tif (dataSize \u003c objLength)\n\t\t\t\t\t\t\t{\n\t\t\t\t\t\t\t\t/* Segmented Upload */\n\t\t\t\t\t\t\t\tsegTransfer = 1;\n\t\t\t\t\t\t\t}\n\n\n\t\t\t\t\t\t\telse\n\t\t\t\t\t\t\t{\n\t\t\t\t\t\t\t\t/* Normal Upload */\n\n\t\t\t\t\t\t\t\t/* pData is the pointer where the object data has to be copied for the response */\n\t\t\t\t\t\t\t\tpData = (UINT16 MBXMEM *) ((TINITSDOUPLOADNORMRESMBX MBXMEM *) pSdoInd)->Data;\n\t\t\t\t\t\t\t}\n\t\t\t\t\t\t}\n\t\t\t\t\t}\n\t\t\t\t\telse\n\t\t\t\t\t{\n\t\t\t\t\t\t/* SDO-Download: store if the request is a expedited or normal request  */\n\t\t\t\t\t\tbTransferType = sdoHeader & SDOHEADER_TRANSFERTYPE;\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t}\n\n\t\t\tif ((abort == 0) && (command == SDOSERVICE_INITIATEDOWNLOADREQ))\n\t\t\t{\n\t\t\t\t/* SDO Download */\n\t\t\t\tif (bTransferType)\n\t\t\t\t{\n\t\t\t\t\t/* Expedited Download */\n\t\t\t\t\tif (mbxSize != EXPEDITED_FRAME_SIZE)\n\t\t\t\t\t{\n\t\t\t\t\t\t/* an Expedited SDO Download request has always a fixed size (2 Byte CoE-Header plus 8 Byte SDO-Header) */\n\t\t\t\t\t\treturn MBXERR_INVALIDSIZE;\n\t\t\t\t\t}\n\t\t\t\t\t/* dataSize gets the real size of the downloaded object data (1,2,3 or 4) */\n\t\t\t\t\tdataSize = MAX_EXPEDITED_DATA - ((sdoHeader & SDOHEADER_DATASETSIZE) >> SDOHEADERSHIFT_DATASETSIZE);\n\t\t\t\t\t/* pData is the pointer to the downloaded object data */\n\t\t\t\t\tpData = (UINT16 MBXMEM *) &pSdoInd[1];\n\t\t\t\t}\n\t\t\t\telse\n\t\t\t\t{\n\t\t\t\t\t/* Normal Download */\n\t\t\t\t\t/* downloadSize gets the real size of the downloaded data */\n\t\t\t\t\t/* '&' operator was too much */\n\n\t\t\t\t\tUINT32 downloadSize = ((UINT32)(SWAPWORD(((TINITSDODOWNLOADNORMREQMBX MBXMEM *) pSdoInd)->CompleteSize[1])) \u003c\u003c 16) + (SWAPWORD(((TINITSDODOWNLOADNORMREQMBX MBXMEM *) pSdoInd)->CompleteSize[0]));\n\n\t\t\t\t\t/* HBu 29.03.06: if it is a segmented download the mbxSize has to be the complete mailbox size */\n\t\t\t\t\tif ((MBX_HEADER_SIZE + EXPEDITED_FRAME_SIZE + downloadSize) > u16ReceiveMbxSize)\n\t\t\t\t\t{\n\t\t\t\t\t\tif (mbxSize != (u16ReceiveMbxSize - MBX_HEADER_SIZE))\n\t\t\t\t\t\t{\n\t\t\t\t\t\t\treturn MBXERR_INVALIDSIZE;\n\t\t\t\t\t\t}\n\t\t\t\t\t}\n\t\t\t\t\telse\n\t\t\t\t\t{\n\t\t\t\t\t\tif (mbxSize != (EXPEDITED_FRAME_SIZE + downloadSize))\n\t\t\t\t\t\t{\n\t\t\t\t\t\t\t/* the mbxSize and the downloadSize are not consistent (mbxSize = downloadSize + 2 byte CoE-Header + 8 byte SDO Header */\n\t\t\t\t\t\t\treturn MBXERR_INVALIDSIZE;\n\t\t\t\t\t\t}\n\t\t\t\t\t}\n\n\t\t\t\t\t/* pData is the pointer to the downloaded object data */\n\t\t\t\t\tpData = (UINT16 MBXMEM *) ((TINITSDODOWNLOADNORMREQMBX MBXMEM *) pSdoInd)->Data;\n\t\t\t\t\t/* the received dataSize will be checked in the object specific functions called from\n\t\t\t\t\t   OBJ_Write (in objdef.c) */\n\t\t\t\t\tdataSize = downloadSize;\n\t\t\t\t\tif (dataSize > (UINT32)(mbxSize - DOWNLOAD_NORM_REQ_SIZE))\n\t\t\t\t\t{\n\t\t\t\t\t\t/* Segmented Download */\n\t\t\t\t\t\tsegTransfer = 1;\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t}\n\n/* ECATCHANGE_START(V5.13) COE5*/\n\t\t\tif ((abort == 0) && (bCompleteAccess == 1))\n/* ECATCHANGE_END(V5.13) COE5*/\n\t\t\t{\n\t\t\t\t// HBu 02.05.06: Complete Access is only supported with subindex 0 and 1\n\t\t\t\tif (subindex > 1)\n\t\t\t\t{\n\t\t\t\t\tabort = ABORTIDX_UNSUPPORTED_ACCESS;\n\t\t\t\t}\n\t\t\t}\n\n\t\t\tif (abort == 0)\n\t\t\t{\n\t\t\t\tif (segTransfer)\n\t\t\t\t{\n\t\t\t\t\tbSdoSegFollows = TRUE;\n\t\t\t\t\tbSdoSegLastToggle = 1;\n\t\t\t\t\tbSdoSegAccess = bCompleteAccess;\n\t\t\t\t\tnSdoSegIndex = index;\n\t\t\t\t\tnSdoSegSubindex = subindex;\n\t\t\t\t\tpSdoSegObjEntry = pObjEntry;\n\t\t\t\t\tif (command == SDOSERVICE_INITIATEUPLOADREQ)\n\t\t\t\t\t{\n\t\t\t\t\t\tnSdoSegCompleteSize = objLength;\n\t\t\t\t\t}\n\t\t\t\t\telse\n\t\t\t\t\t{\n\t\t\t\t\t\tnSdoSegCompleteSize = dataSize;\n\t\t\t\t\t}\n\n\t\t\t\t\tif (pSdoSegData != NULL)\n\t\t\t\t\t{\n\t\t\t\t\t\tFREEMEM((UINT16 VARMEM *) pSdoSegData);\n\t\t\t\t\t\tpSdoSegData = NULL;\n\t\t\t\t\t}\n\t\t\t\t\tpSdoSegData = (UINT16 VARMEM *) ALLOCMEM(ROUNDUPBYTE2WORD(nSdoSegCompleteSize));\n\n\t\t\t\t\tif (pSdoSegData == NULL)\n\t\t\t\t\t{\n\t\t\t\t\t\tif (bCompleteAccess)\n\t\t\t\t\t\t{\n\t\t\t\t\t\t\tabort = ABORTIDX_UNSUPPORTED_ACCESS;\n\t\t\t\t\t\t}\n\t\t\t\t\t\telse\n\t\t\t\t\t\t{\n\t\t\t\t\t\t\tabort = ABORTIDX_OUT_OF_MEMORY;\n\t\t\t\t\t\t}\n\t\t\t\t\t}\n\t\t\t\t\telse\n\t\t\t\t\t{\n\t\t\t\t\t\tif (command == SDOSERVICE_INITIATEUPLOADREQ)\n\t\t\t\t\t\t{\n\t\t\t\t\t\t\t/* Segmented Upload */\n\t\t\t\t\t\t\tabort = OBJ_Read(index, subindex, objLength, pObjEntry, (UINT16 MBXMEM *) pSdoSegData, bCompleteAccess);\n\t\t\t\t\t\t\tif (abort == 0)\n\t\t\t\t\t\t\t{\n\t\t\t\t\t\t\t\tMBXMEMCPY((UINT16 *)((TINITSDOUPLOADNORMRESMBX MBXMEM *) pSdoInd)->Data, pSdoSegData, dataSize);\n\t\t\t\t\t\t\t\tnSdoSegService = SDOSERVICE_UPLOADSEGMENTREQ;\n\t\t\t\t\t\t\t}\n\t\t\t\t\t\t\telse if (abort == ABORTIDX_WORKING)\n\t\t\t\t\t\t\t{\n\t\t\t\t\t\t\t\t/* the application generates the SDO-Response later on by calling SDOS_SdoRes (only possible if object access function pointer is defined) */\n\t\t\t\t\t\t\t\tu8PendingSdo = SDO_PENDING_SEG_READ;\n\t\t\t\t\t\t\t\tbStoreCompleteAccess = bCompleteAccess;\n\t\t\t\t\t\t\t\tu8StoreSubindex = subindex;\n\t\t\t\t\t\t\t\tu16StoreIndex = index;\n\t\t\t\t\t\t\t\tu32StoreDataSize = objLength;\n\t\t\t\t\t\t\t\tpStoreData = pSdoSegData;\n\t\t\t\t\t\t\t\tpSdoPendFunc = pObjEntry->Read;\n\n\t\t\t\t\t\t\t\tbSdoInWork = TRUE;\n\t\t\t\t\t\t\t\t/* we have to store the buffer and the response header */\n\t\t\t\t\t\t\t\tpSdoResStored = pSdoInd;\n\n\t\t\t\t\t\t\t\t/*update command field*/\n\t\t\t\t\t\t\t\tpSdoResStored->SdoHeader.Sdo[SDOHEADER_COMMANDOFFSET] &= ~SDOHEADER_COMMANDMASK;\n\t\t\t\t\t\t\t\tpSdoResStored->SdoHeader.Sdo[SDOHEADER_COMMANDOFFSET] |= (sdoHeader & (SDOHEADER_COMPLETEACCESS | SDOHEADER_COMMAND));\n\t\t\t\t\t\t\t\tnSdoSegService = SDOSERVICE_UPLOADSEGMENTREQ;\n\t\t\t\t\t\t\t\treturn 0;\n\t\t\t\t\t\t\t}\n\t\t\t\t\t\t}\n\t\t\t\t\t\telse\n\t\t\t\t\t\t{\n\t\t\t\t\t\t\t/* Segmented Download */\n\t\t\t\t\t\t\tMBXMEMCPY(pSdoSegData, (UINT16 *)((TINITSDODOWNLOADNORMREQMBX MBXMEM *) pSdoInd)->Data, mbxSize - DOWNLOAD_NORM_REQ_SIZE);\n\t\t\t\t\t\t\tnSdoSegService = SDOSERVICE_DOWNLOADSEGMENTREQ;\n\t\t\t\t\t\t\tdataSize = (mbxSize - DOWNLOAD_NORM_REQ_SIZE);\n\t\t\t\t\t\t}\n\n\t\t\t\t\t\tnSdoSegBytesToHandle = dataSize;\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t\telse\n\t\t\t\t{\n\t\t\t\t\tif (objLength == 0)\n\t\t\t\t\t{\n\t\t\t\t\t\t/* the objLength is not known, therefore the variables for a possible segmented transfer\n\t\t\t\t\t\t\tshould be initialized */\n\t\t\t\t\t\tnSdoSegIndex = index;\n\t\t\t\t\t\tnSdoSegSubindex = subindex;\n\t\t\t\t\t\tpSdoSegObjEntry = pObjEntry;\n\t\t\t\t\t}\n\t\t\t\t\tif (command == SDOSERVICE_INITIATEUPLOADREQ)\n\t\t\t\t\t{\n\t\t\t\t\t\t/* Expedited or Normal Upload */\n\t\t\t\t\t\tabort = OBJ_Read(index, subindex, objLength, pObjEntry, pData, bCompleteAccess);\n\t\t\t\t\t\tif (abort == ABORTIDX_WORKING)\n\t\t\t\t\t\t{\n\t\t\t\t\t\t\t/* the application generates the SDO-Response later on by calling SDOS_SdoRes (only possible if object access function pointer is defined) */\n\t\t\t\t\t\t\tu8PendingSdo = SDO_PENDING_READ;\n\t\t\t\t\t\t\tbStoreCompleteAccess = bCompleteAccess;\n\t\t\t\t\t\t\tu8StoreSubindex = subindex;\n\t\t\t\t\t\t\tu16StoreIndex = index;\n\t\t\t\t\t\t\tu32StoreDataSize = objLength;\n\t\t\t\t\t\t\tpStoreData = pData;\n\t\t\t\t\t\t\tpSdoPendFunc = pObjEntry->Read;\n\n\t\t\t\t\t\t\tbSdoInWork = TRUE;\n\t\t\t\t\t\t\t/* we have to store the buffer and the response header */\n\t\t\t\t\t\t\tpSdoResStored = pSdoInd;\n\n\t\t\t\t\t\t\t/*update command field*/\n\t\t\t\t\t\t\tpSdoResStored->SdoHeader.Sdo[SDOHEADER_COMMANDOFFSET] &= ~SDOHEADER_COMMANDMASK;\n\t\t\t\t\t\t\tpSdoResStored->SdoHeader.Sdo[SDOHEADER_COMMANDOFFSET] |= (sdoHeader & (SDOHEADER_COMPLETEACCESS | SDOHEADER_COMMAND));\n\t\t\t\t\t\t\treturn 0;\n\t\t\t\t\t\t}\n\t\t\t\t\t}\n\t\t\t\t\telse\n\t\t\t\t\t{\n\t\t\t\t\t\t/* Expedited or Normal Download */\n\t\t\t\t\t\tabort = OBJ_Write(index, subindex, dataSize, pObjEntry, pData, bCompleteAccess);\n\t\t\t\t\t\tif (abort == ABORTIDX_WORKING)\n\t\t\t\t\t\t{\n\t\t\t\t\t\t\t/* the application generates the SDO-Response later on by calling SDOS_SdoRes (only possible if object access function pointer is defined) */\n\t\t\t\t\t\t\tu8PendingSdo = SDO_PENDING_WRITE;\n\t\t\t\t\t\t\tbStoreCompleteAccess = bCompleteAccess;\n\t\t\t\t\t\t\tu8StoreSubindex = subindex;\n\t\t\t\t\t\t\tu16StoreIndex = index;\n\t\t\t\t\t\t\tu32StoreDataSize = dataSize;\n\t\t\t\t\t\t\tpStoreData = pData;\n\t\t\t\t\t\t\tpSdoPendFunc = pObjEntry->Write;\n\n\t\t\t\t\t\t\tbSdoInWork = TRUE;\n\t\t\t\t\t\t\t/* we have to store the buffer and the response header */\n\t\t\t\t\t\t\tpSdoResStored = pSdoInd;\n\n\t\t\t\t\t\t\t/*update command field*/\n\t\t\t\t\t\t\tpSdoResStored->SdoHeader.Sdo[SDOHEADER_COMMANDOFFSET] &= ~SDOHEADER_COMMANDMASK;\n\t\t\t\t\t\t\tpSdoResStored->SdoHeader.Sdo[SDOHEADER_COMMANDOFFSET] |= (sdoHeader & (SDOHEADER_COMPLETEACCESS | SDOHEADER_COMMAND));\n\t\t\t\t\t\t\treturn 0;\n\t\t\t\t\t\t}\n\t\t\t\t\t}\n\t\t\t\t} /* else if ( objLength == 0 ) */\n\t\t\t} /* if ( abort == 0 ) */\n\n\t\t} //if(pObjEntry) (Object handle found)\n\t\telse\n\t\t{\n\t\t\tabort = ABORTIDX_OBJECT_NOT_EXISTING;\n\t\t}\n\t\tbreak;\n\n\tcase SDOSERVICE_DOWNLOADSEGMENTREQ:\n\tcase SDOSERVICE_UPLOADSEGMENTREQ:\n\t\tif (command == nSdoSegService)\n\t\t{\n\t\t\tif (command == SDOSERVICE_DOWNLOADSEGMENTREQ)\n\t\t\t{\n\t\t\t\tabort = SdoDownloadSegmentInd((TDOWNLOADSDOSEGREQMBX MBXMEM *) pSdoInd);\n\t\t\t}\n\t\t\telse\n\t\t\t{\n\t\t\t\tabort = SdoUploadSegmentInd((TUPLOADSDOSEGREQMBX MBXMEM *) pSdoInd);\n\t\t\t}\n\t\t}\n\t\telse\n\t\t{\n\t\t\tabort = ABORTIDX_COMMAND_SPECIFIER_UNKNOWN;\n\t\t}\n\t\tbreak;\n\n\tdefault:\n\t\tabort = ABORTIDX_COMMAND_SPECIFIER_UNKNOWN;\n\t\tbreak;\n\t}\n\n\tif (abort != ABORTIDX_WORKING)\n\t{\n\t\t/*  type cast was added because of warning */\n\t\tSdoRes(abort, command, (UINT8)(sdoHeader & SDOHEADER_COMPLETEACCESS), (UINT16)dataSize, objLength, pSdoInd);\n\t}\n\n\treturn 0;\n}", "cut": false, "note": ""}, "communication/protocol/EtherCAT_LAN925x/Src/objdef.c:OBJ_Write": {"file": "communication/protocol/EtherCAT_LAN925x/Src/objdef.c", "line": 1340, "src": "UINT8 OBJ_Write( UINT16 index, UINT8 subindex, UINT32 dataSize, OBJCONST TOBJECT OBJMEM * pObjEntry, UINT16 MBXMEM * pData, UINT8 bCompleteAccess )\n{\n    UINT16 i = subindex;\n    /* get the information of ObjCode and MaxSubindex in local variables to support different types of microcontroller */\n    UINT8 objCode = (pObjEntry->ObjDesc.ObjFlags & OBJFLAGS_OBJCODEMASK) >> OBJFLAGS_OBJCODESHIFT;\n    UINT16 maxSubindex = 0;\n    UINT16 maxConfigured _POSITION_LOOP_CYCLE_INDEX);\n\n    bsp_set_timer_record_start(SYS_TIMER_RECORD_POSITION_LOOP_TIME_INDEX); // 测量位置环运行时间\n\n    #ifdef USE_ECAT\n    kBspData.cs.pl_period_cnt++;\n    if (kBspData.cs.pl_period_total != 0)\n    {\n        kBspData.cs.pl_period_index = (kBspData.cs.pl_period_cnt - 1) % kBspData.cs.pl_period_total;\n\n        if (kBspData.cs.pl_period_cnt > kBspData.cs.pl_period_total)\n        {\n            if (kBspData.cs.ctrl_source != CS_SOURCE_IRQ_SM)\n            {\n                // 同步周期变大或丢失，重新进行位置环同步\n                kBspData.cs.ctrl_source = CS_SOURCE_IDLE;\n                kBspData.cs.pl_period_total = 0;\n                kBspData.cs.sync0_trigger = false;\n            }\n        }\n        else if (kBspData.cs.ctrl_source != CS_SOURCE_IDLE && \\\n                 kBspData.cs.pl_period_index == kBspData.cs.latch_pl_period_index)\n        {\n            set_app_Target_update_state(true);\n        }\n    }\n    #endif // USE_ECAT\n\n#ifndef VIRTUAL_MOTOR_MODEL\n    if (sys_get_hardware_self_test_status() == false)\n    {\n        EncoderDataInit();\n        HardwareSelfTestRun();\n    }\n\n    // 编码器数据读取及处理\n    EncoderDataRead();\n    EncoderDataProcess();\n\n    bsp_pwm_ready_state_updata(); // 更新PWM输出准备状态\n#endif // VIRTUAL_MOTOR_MODEL\n    if (sys_get_hardware_self_test_status() == true)\n    {\n        PosSpeedLoopCtrl();\n    }\n    bsp_set_timer_record_stop(SYS_TIMER_RECORD_POSITION_LOOP_TIME_INDEX);\n}", "cut": false, "note": ""}, "embedded_project/Y01/Board/drv_encoder.c:EncoderDataInit": {"file": "embedded_project/Y01/Board/drv_encoder.c", "line": 177, "src": "void EncoderDataInit(void)\n{\n    for (ENCODER_ID enc_id = ENCODER_ID_1; enc_id \u003c= ENCODER_ID_MAXIMUN; enc_id ++)\n    {\n        encoder_data[enc_id].init(&encoder_data[enc_id]);\n    }\n}", "cut": false, "note": ""}, "embedded_project/Y01/Board/drv_encoder.c:ABZ_Encoder_Init": {"file": "embedded_project/Y01/Board/drv_encoder.c", "line": 469, "src": "static void ABZ_Encoder_Init(EncoderDataInfo_t* enc_data)\n{\n    enc_data->type = ENCODER_TYPE_INC_AB_ABZ;\n\n    enc_data->abz_ab_cnt = 0;\n    enc_data->abz_z_first_flag = true;\n    enc_data->abz_z_first_ab_cnt = 0;\n    enc_data->abz_z_last_ab_cnt = 0;\n\n    if (enc_data->id == ENCODER_ID_1)\n    {\n        enc_data->tim_handle = &ENCODER1_ABZ_TIM_HANDLE;\n    }\n    else if (enc_data->id == ENCODER_ID_2)\n    {\n        enc_data->tim_handle = &ENCODER2_ABZ_TIM_HANDLE;\n    }\n    else\n    {\n        enc_data->type = ENCODER_TYPE_NONE;\n        return;\n    }\n    enc_data->tim_handle->Instance->ARR = enc_data->a_single_res - 1; //设置为编码器4倍频增量计数分辨率 - 1\n    HAL_TIM_Encoder_Start(enc_data->tim_handle, TIM_CHANNEL_ALL);\n    HAL_TIM_IC_Start_IT(enc_data->tim_handle, TIM_CHANNEL_3); // 根据实际情况配置通道\n}", "cut": false, "note": ""}, "embedded_project/Y01/Board/drv_encoder.c:TAMAGAWA_Encoder_Init": {"file": "embedded_project/Y01/Board/drv_encoder.c", "line": 581, "src": "static void TAMAGAWA_Encoder_Init(EncoderDataInfo_t* enc_data)\n{\n    enc_data->type = ENCODER_TYPE_ABS_RS485_TAMAGAWA;\n    if (enc_data->id == ENCODER_ID_1)\n    {\n        enc_data->uart_handle = &ENCODER1_UART_HANDLE;\n    }\n    else if (enc_data->id == ENCODER_ID_2)\n    {\n        enc_data->uart_handle = &ENCODER2_UART_HANDLE;\n    }\n    else\n    {\n        enc_data->type = ENCODER_TYPE_NONE;\n        return;\n    }\n    enc_data->frame_len = (uint8_t)TAMAGAWA_FRAME_LEN_ID_0;\n    enc_data->cf =  (uint8_t)TAMAGAWA_CF_ID_0;\n\n    // 为兼容各厂家设计差异，防止数据帧错位等异常情况，启动过程多次重置UART DMA传输\n    if (enc_data->err_cnt)\n    {\n        enc_data->err_cnt = 0;\n        HAL_UART_DMAStop(enc_data->uart_handle);\n        __HAL_UART_DISABLE(enc_data->uart_handle);\n        __HAL_UART_ENABLE(enc_data->uart_handle);\n        HAL_UART_DMAResume(enc_data->uart_handle);\n    }\n}", "cut": false, "note": ""}, "embedded_project/Y01/Board/drv_encoder.c:MT68XX_Encoder_Init": {"file": "embedded_project/Y01/Board/drv_encoder.c", "line": 700, "src": "static void MT68XX_Encoder_Init(EncoderDataInfo_t* enc_data)\n{\n    enc_data->type = ENCODER_TYPE_ABS_SPI_MT68XX;\n    if (enc_data->id == ENCODER_ID_1)\n    {\n        enc_data->spi_handle = &ENCODER1_SPI_HANDLE;\n        /* SPI parameter reconfiguration*/\n        // enc_data->spi_handle->Init.CLKPolarity = SPI_POLARITY_HIGH;\n        // enc_data->spi_handle->Init.CLKPhase = SPI_PHASE_2EDGE;\n        // if (HAL_SPI_Init(enc_data->spi_handle) != HAL_OK)\n        // {\n        //     sys_set_bsp_error_state((BSP_ERROR_CODE)enc_data->id, ERROR_SET);\n        // }\n    }\n    else if (enc_data->id == ENCODER_ID_2)\n    {\n        enc_data->spi_handle = &ENCODER2_SPI_HANDLE;\n        /* SPI parameter reconfiguration*/\n        // enc_data->spi_handle->Init.CLKPolarity = SPI_POLARITY_HIGH;\n        // enc_data->spi_handle->Init.CLKPhase = SPI_PHASE_2EDGE;\n        // if (HAL_SPI_Init(enc_data->spi_handle) != HAL_OK)\n        // {\n        //     sys_set_bsp_error_state((BSP_ERROR_CODE)enc_data->id, ERROR_SET);\n        // }\n    }\n    else\n    {\n        enc_data->type = ENCODER_TYPE_NONE;\n        return;\n    }\n    enc_data->frame_len = (uint8_t)MT68XX_FRAME_LEN_RD_ANGLE;\n    enc_data->cf =  (uint8_t)MT68XX_CF_ID_RD;\n    // 首2字节为cf+reg，其他字节均为0\n    uint16_t tx_cmd = enc_data->cf \u003c\u003c 8 | MT_REG_ANGLE_H;\n    encoder_tx_buff[enc_data->id][0] = tx_cmd >> 8;\n    encoder_tx_buff[enc_data->id][1] = tx_cmd & 0xFF;\n    for (uint8_t i = 2; i \u003c enc_data->frame_len; i++)\n    {\n        encoder_tx_buff[enc_data->id][i] = 0x00;\n    }\n}", "cut": false, "note": ""}, "embedded_project/Y01/Board/drv_encoder.c:KTM59XX_Encoder_Init": {"file": "embedded_project/Y01/Board/drv_encoder.c", "line": 800, "src": "static void KTM59XX_Encoder_Init(EncoderDataInfo_t* enc_data)\n{\n    enc_data->type = ENCODER_TYPE_ABS_SPI_KTM59XX;\n    if (enc_data->id == ENCODER_ID_1)\n    {\n        enc_data->spi_handle = &ENCODER1_SPI_HANDLE;\n    }\n    else if (enc_data->id == ENCODER_ID_2)\n    {\n        enc_data->spi_handle = &ENCODER2_SPI_HANDLE;\n    }\n    else\n    {\n        enc_data->type = ENCODER_TYPE_NONE;\n        return;\n    }\n    enc_data->frame_len = (uint8_t)KTM59XX_FRAME_LEN_ID_3;\n    enc_data->cf =  (uint8_t)KTM59XX_CF_ID_3;\n    // 首字节为cf，其他字节均为0\n    encoder_tx_buff[enc_data->id][0] = enc_data->cf;\n    for (uint8_t i = 1; i \u003c enc_data->frame_len; i++)\n    {\n        encoder_tx_buff[enc_data->id][i] = 0x00;\n    }\n}", "cut": false, "note": ""}, "embedded_project/Y01/Board/drv_encoder.c:BISSC_Encoder_Init": {"file": "embedded_project/Y01/Board/drv_encoder.c", "line": 923, "src": "static void BISSC_Encoder_Init(EncoderDataInfo_t* enc_data)\n{\n    if (enc_data->id == ENCODER_ID_1)\n    {\n        enc_data->type = ENCODER1_TYPE_OPTION;\n        enc_data->spi_handle = &ENCODER1_SPI_HANDLE;\n    }\n    else if (enc_data->id == ENCODER_ID_2)\n    {\n        enc_data->type = ENCODER2_TYPE_OPTION;\n        enc_data->spi_handle = &ENCODER2_SPI_HANDLE;\n    }\n    else\n    {\n        enc_data->type = ENCODER_TYPE_NONE;\n        return;\n    }\n    enc_data->frame_len = (uint8_t)BISSC_FRAME_LEN_ID_0;\n    enc_data->cf =  (uint8_t)BISSC_CF_ID_0;\n    for (uint8_t i = 0; i \u003c enc_data->frame_len; i++)\n    {\n        encoder_tx_buff[enc_data->id][i] = enc_data->cf;\n    }\n}", "cut": false, "note": ""}, "embedded_project/Y01/Board/drv_encoder.c:Encoder_None": {"file": "embedded_project/Y01/Board/drv_encoder.c", "line": 457, "src": "static inline void Encoder_None(EncoderDataInfo_t* enc_data)\n{\n    enc_data->type = ENCODER_TYPE_NONE;\n    return;\n}", "cut": false, "note": ""}, "board_public/system_manage/system_init.c:HardwareSelfTestRun": {"file": "board_public/system_manage/system_init.c", "line": 71, "src": "void HardwareSelfTestRun(void)\n{\n    static uint32_t position_irq_cnt = 0;\n    static uint32_t motor_encoder_cnt = 0;     // 电机端编码器单圈值\n    static uint32_t load_encoder_cnt = 0;      // 负载端编码器单圈值\n    static int64_t motor_encoder_turns = 0;    // 电机端编码器多圈值\n    static int64_t load_encoder_turns = 0;     // 负载端编码器多圈值\n\n    position_irq_cnt++;\n\n    // 检查编码器是否准备好\n    if (bsp_get_encoder_state(ENCODER_ID_MOTOR) == true && \\\n        bsp_get_encoder_state(ENCODER_ID_LOAD) == true)\n    {\n        // 编码器已准备好，获取编码器数据并初始化电机控制状态\n        motor_encoder_cnt = bsp_get_encoder_cnt(ENCODER_ID_MOTOR);\n        load_encoder_cnt = bsp_get_encoder_cnt(ENCODER_ID_LOAD);\n        motor_encoder_turns = bsp_get_encoder_turns(ENCODER_ID_MOTOR);\n        load_encoder_turns = bsp_get_encoder_turns(ENCODER_ID_LOAD);\n\n        MotorCtlSmStateInit(&kAxis, &kAxisDw, \\\n                            motor_encoder_turns, motor_encoder_cnt, \\\n                            load_encoder_turns, load_encoder_cnt);\n\n        position_irq_cnt = 0;\n\n        // 编码器准备好，设置硬件自检状态为true\n        sys_msg.hardware_self_test_status = true;\n    }\n    else\n    {\n        // 编码器未准备好，检查是否超时\n        if (position_irq_cnt >= HARDWARE_SELF_TEST_RUN_CNT)\n        {\n            // 超时处理：使用默认值初始化电机控制状态\n            MotorCtlSmStateInit(&kAxis, &kAxisDw, 0, 0, 0, 0);\n\n            // 设置编码器错误状态\n            if (bsp_get_encoder_state(ENCODER_ID_MOTOR) == false)\n            {\n                sys_set_bsp_error_state(ERROR_ENCODER_MOTOR, ERROR_SET);\n            }\n            if (bsp_get_encoder_state(ENCODER_ID_LOAD) == false)\n            {\n                sys_set_bsp_error_state(ERROR_ENCODER_LOAD, ERROR_SET);\n            }\n\n            // 重置计数器\n            position_irq_cnt = 0;\n        }\n        // 编码器未准备好，保持硬件自检状态为false\n        sys_msg.hardware_self_test_status = false;\n    }\n\n    // 硬件自检也检测相关状态\n    AppStatusScanFast();\n}", "cut": false, "note": ""}, "embedded_project/Y01/Board/bsp_api.c:bsp_get_encoder_state": {"file": "embedded_project/Y01/Board/bsp_api.c", "line": 454, "src": "bool bsp_get_encoder_state(ENCODER_ID const enc_id)\n{\n#ifdef VIRTUAL_MOTOR_MODEL\n    return true;\n#else\n    return get_encoder_status(enc_id);\n#endif\n}", "cut": false, "note": ""}, "motor_control/motor_ctl_sm.c:MotorCtlSmStateInit": {"file": "motor_control/motor_ctl_sm.c", "line": 203, "src": "void MotorCtlSmStateInit(Axis *const axis, AxisDw *const axis_dw,\n                         int64_T motor_circle_int_n, uint32_T motor_pos_now_p,\n                         int64_T load_circle_int_n, uint32_T load_pos_now_p)\n{\n   axis->motor_pos_sensor_config.init_pos_p = motor_circle_int_n * axis->motor_pos_sensor_config.enc_line_p_n;\n   // TODO：负载端多圈值处理\n\n   axis_dw->motor_pos_sensor_InstanceData.rtdw.enc_counts_now_last = motor_pos_now_p;\n   axis_dw->load_pos_sensor_InstanceData.rtdw.enc_counts_now_last = load_pos_now_p;\n\n   axis->motor_pos_sensor_input.enc_counts_now_p = motor_pos_now_p;\n\n   // 运行电机端位置传感器数据处理\n   motor_pos_sensor(&axis->motor_pos_sensor_input,\n                    &axis->motor_pos_sensor_config,\n                    &axis->motor_pos_sensor_output,\n                    &(axis_dw->motor_pos_sensor_InstanceData.rtdw));\n\n   axis->pos_speed_ctl_input.pos_now_p = axis->motor_pos_sensor_output.enc_sum_p; // 获取电机端当前绝对位置\n\n   // 运行负载端位置传感器数据处理\n   load_pos_sensor(&axis->load_pos_sensor_input,\n                   &axis->load_pos_sensor_config,\n                   &axis->load_pos_sensor_output,\n                   &(axis_dw->load_pos_sensor_InstanceData.rtdw));\n\n   axis_dw->speed_obs_pll_InstanceData.rtdw.pos_now_p_last = axis->pos_speed_ctl_input.pos_now_p; // 初始化速度观测器当前位置\n\n   // 运行速度观测器 进行速度估计\n   axis->speed_obs_pll_input.pos_now_p = axis->pos_speed_ctl_input.pos_now_p;\n\n   speed_obs_pll(&axis->speed_obs_pll_input, &axis->speed_obs_pll_config,\n                 &axis->speed_obs_pll_output,\n                 &(axis_dw->speed_obs_pll_InstanceData.rtdw));\n\n   axis->pos_speed_ctl_input.speed_now_rad_s = axis->speed_obs_pll_output.ev_rad_s; // 速度观测器输出\n}", "cut": false, "note": ""}, "app/app_status_check.c:AppStatusScanFast": {"file": "app/app_status_check.c", "line": 811, "src": "void AppStatusScanFast(void)\n{\n    kAppCheck.now_ctrl_word = get_app_Controlword();\n    // 控制字发送0->3，清错\n    if (kAppCheck.pre_ctrl_word == APP_CTRL_DISABLE &&\n        (kAppCheck.now_ctrl_word == APP_CTRL_CLEAR_ERROR))\n    {\n        if (kAppCheck.p_bsp_error->bit_band.error_bus_voltage || \\\n            kAppCheck.p_bsp_error->bit_band.error_nfault) // 此2错误无法被清除  只能复位\n        {\n            ;;;\n        }\n        else\n        {\n            kAppCheck.error.all = 0;\n            kAppCheck.p_bsp_error->code = 0;\n        }\n    }\n    kAppCheck.pre_ctrl_word = kAppCheck.now_ctrl_word;\n\n    // 遍历错误检测函数\n    for (uint8_t i = 0; i \u003c kAppCheck.scan_ring_num; i++)\n    {\n        if (CheckTable[i].scan_fast == true)\n        {\n            kAppCheck.error.all |= (CheckTable[i].check_func() \u003c\u003c i); // 对应bit置1\n        }\n    }\n\n    // 发生错误失能电机\n    if (kAppCheck.error.all != 0)\n    {\n        // TODO：根据不同错误类型执行不同保护动作，目前统一失能\n        set_app_Controlword(APP_CTRL_DISABLE);\n    }\n\n    AppMotorEnableStateCheck();\n    set_app_Encoder_zero_crossing_state(AppEncoderZeroCrossingStateCheck());\n}", "cut": false, "note": ""}, "embedded_project/Y01/Board/drv_encoder.c:EncoderDataRead": {"file": "embedded_project/Y01/Board/drv_encoder.c", "line": 191, "src": "void EncoderDataRead(void)\n{\n    for (ENCODER_ID enc_id = ENCODER_ID_1; enc_id \u003c= ENCODER_ID_MAXIMUN; enc_id ++)\n    {\n        // 转存上周期读取的编码器器数据\n        for (uint8_t i = 0; i \u003c encoder_data[enc_id].frame_len; i++)\n        {\n            encoder_data[enc_id].data_raw[i] = encoder_rx_buff[enc_id][i];\n            encoder_rx_buff[enc_id][i] = 0;\n        }\n\n        encoder_data[enc_id].read(&encoder_data[enc_id]);\n    }\n}", "cut": false, "note": ""}, "embedded_project/Y01/Board/drv_encoder.c:ABZ_Encoder_Data_Read": {"file": "embedded_project/Y01/Board/drv_encoder.c", "line": 500, "src": "static void ABZ_Encoder_Data_Read(EncoderDataInfo_t* enc_data)\n{\n    enc_

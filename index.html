w);\n\n    // 3. 输出电机控制电压  失能状态到使能状态 上升沿使能电机\n    if (kAxis.motor_ctl_sm_output.state == MOTOR_CTL_SM_STATE_ENABLE)\n    {\n        if (sys_get_current_calibration_status() == CURRENT_CALIBRATION_STATUS_OK)\n        {\n            if (kAxis.motor_ctl_sm_output.state_last == MOTOR_CTL_SM_STATE_DISABLE)\n            {\n                bsp_set_pwm_state(PWM_ENABLE);\n            }\n        }\n        else\n        {\n            sys_current_calibration_step();\n        }\n    }\n    else // 失能状态    其他状态都失能电机  包括错误状态\n    {\n        bsp_set_pwm_state(PWM_DISABLE);\n    }\n\n    // 4. 更新硬件准备状态\n    if (bsp_get_pwm_state() == true &&\\\n        sys_get_current_calibration_status() == CURRENT_CALIBRATION_STATUS_OK)\n    {\n        kAxis.motor_ctl_sm_input.hw_ready_state = 1;\n    }\n    else\n    {\n        kAxis.motor_ctl_sm_input.hw_ready_state = 0;\n    }\n    // 记录上一次控制层状态机状态\n    kAxis.motor_ctl_sm_output.state_last = kAxis.motor_ctl_sm_output.state;\n\n\n    // 同步控制层变量到应用层,实现波形动态刷新和离线波形采集\n    AppParamSyncUser();\n\n    // 运行离线波形采样\n    ScopeIsrHandle();\n}", "cut": false, "note": ""}, "SIL_project/main.c:MotorCtrlTimerCallback": {"file": "SIL_project/main.c", "line": 55, "src": "void MotorCtrlTimerCallback(void* arg, void* arg_dw)\n{\n    for (size_t i = 0; i \u003c 20; i++)\n    {\n        static volatile uint8_t position_frq_div = 0;\n        CurrentLoopCtrl();\n        SimPlantStep();\n        if (position_frq_div == 0)\n        {\n            PosSpeedLoopCtrl();\n            position_frq_div = 1; // 1:10KHZ 位置环   3:5KHZ 位置环\n        }\n        else\n        {\n            position_frq_div--;\n        }\n    }\n}", "cut": false, "note": ""}, "embedded_project/Y01/Board/bsp_api.c:bsp_get_encoder_cnt": {"file": "embedded_project/Y01/Board/bsp_api.c", "line": 467, "src": "uint32_t bsp_get_encoder_cnt(ENCODER_ID const enc_id)\n{\n#ifdef VIRTUAL_MOTOR_MODEL\n    return kAxis.sim_plant_output.enc_counts_P;\n#else\n    return get_encoder_cnt(enc_id);\n#endif\n}", "cut": false, "note": ""}, "embedded_project/Y01/Board/drv_encoder.c:get_encoder_cnt": {"file": "embedded_project/Y01/Board/drv_encoder.c", "line": 303, "src": "uint32_t get_encoder_cnt(ENCODER_ID const enc_id)\n{\n    return encoder_data[enc_id].single_cnt;\n}", "cut": false, "note": ""}, "SIL_project/bsp_api_virtual.c:bsp_get_encoder_cnt": {"file": "SIL_project/bsp_api_virtual.c", "line": 252, "src": "uint32_t bsp_get_encoder_cnt(ENCODER_ID const enc_id)\n{\n    if (enc_id == ENCODER_ID_MOTOR)\n    {\n        return kAxis.sim_plant_output.enc_counts_P;\n    }\n    else if (enc_id == ENCODER_ID_LOAD)\n    {\n        return kAxis.sim_plant_output.enc_counts_P;\n    }\n\n    return kAxis.sim_plant_output.enc_counts_P;\n}", "cut": false, "note": ""}, "database/data_param.c:get_app_Internal_control_authority": {"file": "database/data_param.c", "line": 3884, "src": "uint8_t get_app_Internal_control_authority(void)\n{\n    /* USER CODE BEGIN get_app_Internal_control_authority */\n    /* USER CODE END get_app_Internal_control_authority */\n    return kAppPermissionConfig.Internal_control_authority;\n}", "cut": false, "note": ""}, "app/app_status_check.c:AppStatusCheck": {"file": "app/app_status_check.c", "line": 933, "src": "void AppStatusCheck(void)\n{\n    // 遍历数字输入IO状态，更新对应bit。\n    uint32_t di_io_status = 0;\n    for (DIGITAL_INPUTS_IO_BIT io = DI_IO_MIN; io \u003c= DI_IO_MAX; io++)\n    {\n        di_io_status |= (bsp_get_digital_input_state(io) \u003c\u003c io);\n        // 可根据需要在以下添加IO输入状态变化，处理触发事件等功能逻辑\n    }\n    kAppCheck.di_io.all = di_io_status;\n}", "cut": false, "note": ""}, "app/app_motion_precondition.c:AppMotionPreConditionRun": {"file": "app/app_motion_precondition.c", "line": 160, "src": "void AppMotionPreConditionRun(void)\n{\n    // 运行限位检查\n    kMotionPrecondition.emergency_brake_requested = MotionLimitCheckRun(&kMotionPrecondition.limit);\n    set_app_Emergency_brake_requested(kMotionPrecondition.emergency_brake_requested);\n}", "cut": false, "note": ""}, "communication/protocol/CiA402/PDS_FSA/cia402_error_code.c:Cia402ErrorCodeScan": {"file": "communication/protocol/CiA402/PDS_FSA/cia402_error_code.c", "line": 11, "src": "void Cia402ErrorCodeScan(void)\n{\n    CheckErrorCode_t check_error_val = (CheckErrorCode_t)app_get_check_error_val();\n    // 无错误不检查\n    if (check_error_val.all)\n    {\n        //free_to_rotate_error_handle();\n        // 按照错误优先级顺序检查每个错误位\n        if (check_error_val.bits.drive_overload) {\n            set_Error_code(Load_error_error);\n            return;\n        }\n        if (check_error_val.bits.drive_peak_current_overload) {\n            set_Error_code(Driver_peak_current_overload_error);\n            return;\n        }\n        if (check_error_val.bits.drive_over_current_error) {\n            set_Error_code(Continuous_over_current_output_No_2_error);\n            return;\n        }\n        if (check_error_val.bits.dc_bus_over_voltage) {\n            set_Error_code(DC_link_over_voltage_error);\n            return;\n        }\n        if (check_error_val.bits.dc_bus_under_voltage) {\n            set_Error_code(DC_link_under_voltage_error);\n            return;\n        }\n        if (check_error_val.bits.over_temperature_drive) {\n            set_Error_code(Excess_temperature_device_error);\n            return;\n        }\n        if (check_error_val.bits.under_temperature_drive) {\n            set_Error_code(Too_low_temperature_device_error);\n            return;\n        }\n        if (check_error_val.bits.over_temperature_motor) {\n            set_Error_code(Motor_blocked_error);\n            return;\n        }\n        if (check_error_val.bits.under_temperature_motor) {\n            set_Error_code(Under_temperature_motor_error);\n            return;\n        }\n        if (check_error_val.bits.over_temperature_mcu) {\n            set_Error_code(Excess_temperature_drive_error);\n            return;\n        }\n        if (check_error_val.bits.under_temperature_mcu) {\n            set_Error_code(Too_low_temperature_drive_error);\n            return;\n        }\n        if (check_error_val.bits.over_speed) {\n            set_Error_code(Velocity_speed_controller_error);\n            return;\n        }\n        if (check_error_val.bits.position_following_error) {\n            set_Error_code(Following_error_error);\n            return;\n        }\n        if (check_error_val.bits.motor_encoder_error) {\n            set_Error_code(Incremental_sensor_1_fault_error);\n            return;\n        }\n        if (check_error_val.bits.load_encoder_error) {\n            set_Error_code(Incremental_sensor_2_fault_error);\n            return;\n        }\n        if (check_error_val.bits.flash_store_error) {\n            set_Error_code(Non_volatile_data_memory_error);\n            return;\n        }\n        if (check_error_val.bits.nfault_error) {\n            set_Error_code(Drv_nfault_error);\n            return;\n        }\n        if (check_error_val.bits.drv_init_error) {\n            set_Error_code(Drv_init_error);\n            return;\n        }\n        if (check_error_val.bits.current_sample_error) {\n            set_Error_code(Current_sample_error);\n            return;\n        }\n        if (check_error_val.bits.drive_bus_voltage_error) {\n            set_Error_code(Drive_bus_voltage_error);\n            return;\n        }\n        if (check_error_val.bits.can_bus_disconnection_error) {\n            set_Error_code(Can_bus_disconnection_error);\n            return;\n        }\n        if (check_error_val.bits.external_inhibit_input_detected) {\n            set_Error_code(External_inhibit_input_detected_error);\n            return;\n        }\n    }\n    else\n    {\n        set_Error_code(0);\n    }\n}", "cut": false, "note": ""}, "communication/protocol/CiA402/PDS_FSA/cia402_fsm.c:PDS_FSA_Run": {"file": "communication/protocol/CiA402/PDS_FSA/cia402_fsm.c", "line": 328, "src": "void PDS_FSA_Run(void) {\n\n    //内部紧急停车（QuickStop）需求，运行一次状态机更新进入QuickStop状态\n    if (CurrentState == kOperationEnable && get_app_Emergency_brake_requested()) {\n        ControlwordChange_PDAS_FSA();\n    }\n\n    //任何状态触发错误，直接跳转到故障状态\n    if(Transition_13_Event()) {\n        CurrentState = kFaultReactionActive;\n        Transition_13_Action();\n        PDS_FSA_set_statusword(CurrentState);\n    }\n\n    //自动切换状态机(自动跳转标志为true)\n    for (uint8_t i = 0; i \u003c CIA402_ARRAY_SIZE(stateTable); i++) {\n        //The events shall initiate the transition. The transition shall be terminated, after the action has been performed.\n        if (stateTable[i].CurrentState == CurrentState && stateTable[i].auto_transition) {\n            if(stateTable[i].action != NULL){\n                stateTable[i].action();\n            }\n            CurrentState = stateTable[i].NextState;\n            PDS_FSA_set_statusword(CurrentState);\n        }\n    }\n\n    //启动quick stop功能，在kOperationEnable完成急停动作后，由内部跳转到kQuickStopActive状态\n    if (quick_stop_start_flag == true) {\n        //如果quick stop动作已经完成，则跳转到kQuickStopActive状态\n        if (QuickStopRun() == true) {\n            CurrentState = kQuickStopActive;\n            Transition_11_Action();\n            PDS_FSA_set_statusword(CurrentState);\n            quick_stop_start_flag = false;\n        }\n    }\n}", "cut": false, "note": ""}, "communication/protocol/CiA402/PDS_FSA/cia402_fsm.c:Transition_13_Event": {"file": "communication/protocol/CiA402/PDS_FSA/cia402_fsm.c", "line": 218, "src": "bool Transition_13_Event(void) {\n    if(get_Error_code() != 0){\n        return true;\n    }\n    else{\n        return false;\n    }\n}", "cut": false, "note": ""}, "communication/protocol/CiA402/PDS_FSA/cia402_fsm.c:PDS_FSA_set_statusword": {"file": "communication/protocol/CiA402/PDS_FSA/cia402_fsm.c", "line": 368, "src": "void PDS_FSA_set_statusword(Cia402State CurrentState){\n\n    Od6041Mask val = 0;  // 初始化状态值为0\n\n    switch (CurrentState) {\n        case kStart:\n            val = kOd6041_Start;\n            break;\n        case kNotReadyToSwitchOn:\n            val = kOd6041_NotReadyToSwitchOn;\n            break;\n        case kSwitchOnDisable:\n            val = kOd6041_SwitchedOnDisable;\n            break;\n        case kReadyToSwitchOn:\n            val = kOd6041_ReadyToSwitchOn;\n            break;\n        case kSwitchOn:\n            val = kOd6041_SwitchedOn;\n            break;\n        case kOperationEnable:\n            val = kOd6041_OperationEnable;\n            break;\n        case kQuickStopActive:\n            val = kOd6041_QuickStopActive;\n            break;\n        case kFaultReactionActive:\n            val = kOd6041_FaultReactionActive;\n            break;\n        case kFault:\n            val = kOd6041_Fault;\n            break;\n        default:\n            val = 0;  // 其他状态值保持为0\n            break;\n    }\n\n    uint16_t state_out_mark = CIA402_READ_BIT(get_Statusword(), (~kOd6041_StateMark));  //读取掩码外位的状态\n\n    set_Statusword(state_out_mark | val);//掩码外状态保留，设置当前状态\n}", "cut": false, "note": ""}, "communication/protocol/CiA402/PDS_FSA/cia402_fsm.c:QuickStopRun": {"file": "communication/protocol/CiA402/PDS_FSA/cia402_fsm.c", "line": 423, "src": "bool QuickStopRun(void)\n{\n    set_app_Controlword(MOTOR_CTL_SM_MOTOR_EMERGENCY_BRAKE);  //通过应用层控制电机急停\n\n    //速度为0，快速停止完成\n    if (get_velocity_zero_state()) {\n        return true;\n    }\n    else {\n        return false;\n    }\n}", "cut": false, "note": ""}, "communication/protocol/CiA402/PDS_FSA/cia402_fsm.c:Transition_11_Action": {"file": "communication/protocol/CiA402/PDS_FSA/cia402_fsm.c", "line": 192, "src": "void Transition_11_Action(void) {\n    if ((APP_Emergency_Brake_Mode)get_Quick_stop_option_code() \u003c= EMERGENCY_BRAKE_MODE_VOLTAGE_LIMIT){\n        CurrentState = kSwitchOnDisable;\n    }\n}", "cut": false, "note": ""}, "app/app_scheduler.c:AppRun": {"file": "app/app_scheduler.c", "line": 40, "src": "void AppRun(uint8_t hw_ready_state)\n{\n    // 遍历应用程序列表\n    for (int i = 0; i \u003c APP_NUM; i++)\n    {\n        if (kAppInfo[i].enable)\n        {\n\n            // 启动应用程序\n            if (kAppInfo[i].app_state == APP_STA_READY)\n            {\n\n                if (kAppInfo[i].app_ptr->start != NULL)\n                {\n                    kAppInfo[i].app_result = kAppInfo[i].app_ptr->start();\n                    if (kAppInfo[i].app_result == APP_RET_RUNNING)\n                    { // start处于等待状态\n                        kAppInfo[i].app_state = APP_STA_READY;\n                    }\n                    else if (kAppInfo[i].app_result == APP_RET_SUCCESS)\n                    { // start成功,进入run状态\n                        kAppInfo[i].app_state = APP_STA_RUNNING;\n                    }\n                    else if (kAppInfo[i].app_result == APP_RET_FAIL)\n                    { // start失败,进入错误状态\n                        kAppInfo[i].app_state = APP_STA_ERROR;\n                    }\n                }\n            }\n\n            // 运行应用程序\n            if (kAppInfo[i].app_state == APP_STA_RUNNING)\n            {\n                if (kAppInfo[i].app_ptr->run != NULL)\n                {\n                    // 回读PWM准备好状态，准备好则运行APP 否则等待处于 READY 状态\n                    if (hw_ready_state)\n                    {\n                        kAppInfo[i].app_result = kAppInfo[i].app_ptr->run();\n                        if (kAppInfo[i].app_result == APP_RET_RUNNING)\n                        {\n                            kAppInfo[i].app_state = APP_STA_RUNNING;\n                        }\n                        else if (kAppInfo[i].app_result == APP_RET_SUCCESS)\n                        {\n                            kAppInfo[i].app_state = APP_STA_SUCCESS;\n                        }\n                        else if (kAppInfo[i].app_result == APP_RET_FAIL)\n                        {\n                            kAppInfo[i].app_state = APP_STA_ERROR;\n                        }\n                    }\n                    else\n                    {\n                        kAppInfo[i].app_state = APP_STA_READY;\n                    }\n                }\n            }\n\n            // 停止应用程序\n            if ((kAppInfo[i].app_state == APP_STA_SUCCESS) || (kAppInfo[i].app_state == APP_STA_ERROR))\n            {\n                if (kAppInfo[i].app_ptr->stop != NULL)\n                {\n                    kAppInfo[i].app_ptr->stop();\n                }\n                kAppInfo[i].enable = false;           // 禁用应用程序\n                kAppInfo[i].app_state = APP_STA_IDLE; // 设置应用程序状态为空闲\n            }\n        }\n    }\n}", "cut": false, "note": ""}, "app/app_profile_position_mode.c:PpModeRun": {"file": "app/app_profile_position_mode.c", "line": 40, "src": "AppResult PpModeRun(void)\n{\n    kPpMode.now_Controlword = (APP_CONTROL_WORD)get_app_Controlword();\n\n    uint8_t load_enc_type = bsp_get_encoder_type(ENCODER_ID_LOAD);  //获取负载端编码器类型\n    int64_t home_offset = get_app_Home_position_offset_value();     //获取存储的回零内部偏移值\n\n    if (kPpMode.now_Controlword == APP_CTRL_ENABLE)\n    {\n        if (!get_app_Emergency_brake_requested())\n        {\n            if (kPpMode.pre_Controlword == APP_CTRL_DISABLE)\n            {\n                // 重新使能后初始化规划器\n                PosTrajectoryPlanningInit();\n                kPpMode.position_target_last = get_app_Position_actual_value(); // 目标位置 等于 当前位置\n                kPpMode.traj.pos_tar_p = get_app_Motor_position_actual_value();\n            }\n\n            // 总线控制时pp模式下检测控制字bit4上升沿事件，或，非总线控制时bit4上升沿事件一直有效更新目标位置\n            if (kPpMode.start_upedge_state == true ||\n                (APP_COMM_CONTROL_AUTHORITY)get_app_Comm_control_authority() == COMM_CONTROL_HOST)\n            {\n                kPpMode.start_upedge_latch = true;\n                kPpMode.start_upedge_state = false;\n            }\n\n            // 规划速度为0的情况：1. 暂停指令生效 2. 抱闸状态不为松闸\n            if (get_app_Halt_running_cmd() == true || get_app_Brake_state() != BRAKE_STATE_RELEASED)\n            {\n                kPpMode.start_upedge_latch = false; // 暂停后重新使能\n                kPpMode.traj.profile_speed = 0;     // 如果处于暂停状态，规划速度为0\n            }\n            else\n            {\n                kPpMode.traj.profile_speed = get_app_Profile_velocity() * get_app_Motor_rpm_2_pps() *\n                                             get_app_Reduction_ratio();\n            }\n\n            // 设置规划器参数\n            // 计算目标位置和当前位置差值\n            if (true == kPpMode.start_upedge_latch)\n            {\n                kPpMode.start_upedge_latch = false;\n                kPpMode.position_target_last = get_app_Target_position(); // 上升沿更新目标位置\n            }\n\n            kPpMode.pos_tar_p_add = (float)(kPpMode.position_target_last - get_app_Position_actual_value()) *\n                                    get_app_Reduction_ratio() * get_app_P_load_2_motor();\n\n#ifdef GEAR_BACKLASH_MOTOR_PULSE // 定义了齿轮间隙参数才会对间隙进行处理\n            if (kPpMode.pos_tar_p_add \u003c GEAR_BACKLASH_MOTOR_PULSE && kPpMode.pos_tar_p_add > -GEAR_BACKLASH_MOTOR_PULSE)\n            {\n                // 处理齿轮间隙\n                kPpMode.traj.pos_tar_p = get_app_Motor_position_actual_value(); // 急停在当前位置 避免定位振动\n                kPpMode.traj.profile_speed = 0;\n                kPpMode.traj.profile_acc = 2e9f;\n                kPpMode.traj.profile_dec = 2e9f;\n            }\n            else\n            {\n                kPpMode.traj.pos_tar_p = kPpMode.pos_tar_p_add + get_app_Motor_position_actual_value(); //  转化到内环目标位置\n\n                kPpMode.traj.profile_acc = get_app_Profile_acceleration() * get_app_Motor_rpm_2_pps() *\n                                           get_app_Reduction_ratio();\n                kPpMode.traj.profile_dec = get_app_Profile_deceleration() * get_app_Motor_rpm_2_pps() *\n                                           get_app_Reduction_ratio();\n            }\n#else\n            if(load_enc_type == 0x00) //负载端无编码器 目标位置进行绝对位置控制\n            {\n                if (get_app_Reduction_ratio_num() == 1) //减速比1:1  直接以电机端编码器位置为反馈\n                {\n                    kPpMode.traj.pos_tar_p = kPpMode.position_target_last + home_offset;\n                }\n                else //减速比大于1  以负载端位置为参考进行绝对位置控制\n                {\n                    kPpMode.traj.pos_tar_p = PosUnitLoadToMotor(kPpMode.position_target_last + home_offset);;\n                }\n            }\n            else  //负载端有编码器 目标位置进行相对位置控制\n            {\n                kPpMode.traj.pos_tar_p = kPpMode.pos_tar_p_add + get_app_Motor_position_actual_value(); //  转化到内环目标位置\n            }\n\n            kPpMode.traj.profile_acc = get_app_Profile_acceleration() * get_app_Motor_rpm_2_pps() *\n                                       get_app_Reduction_ratio();\n            kPpMode.traj.profile_dec = get_app_Profile_deceleration() * get_app_Motor_rpm_2_pps() *\n                                       get_app_Reduction_ratio();\n\n#endif\n        }\n        else\n        {\n            set_app_Controlword(APP_CTRL_EMERGENCY_BRAKE); // 强制进入紧急停车（QuickStop）状态\n            kPpMode.now_Controlword = APP_CTRL_EMERGENCY_BRAKE;\n        }\n    }\n\n    // 紧急停车（QuickStop）处理\n    if (kPpMode.now_Controlword == APP_CTRL_EMERGENCY_BRAKE)\n    {\n        kPpMode.traj.profile_speed = 0; // 如果处于急停状态，规划速度为0\n\n        kPpMode.emergency_brake_mode = get_app_Quick_stop_option_code();\n        if (kPpMode.emergency_brake_mode == EMERGENCY_BRAKE_MODE_QUICK_STOP_RAMP ||\n            kPpMode.emergency_brake_mode == EMERGENCY_BRAKE_MODE_QUICK_STOP_RAMP_ENABLE ||\n            kPpMode.emergency_brake_mode == EMERGENCY_BRAKE_MODE_CURRENT_LIMIT ||\n            kPpMode.emergency_brake_mode == EMERGENCY_BRAKE_MODE_CURRENT_LIMIT_ENABLE)\n        {\n            kPpMode.traj.profile_acc = get_app_Quick_stop_deceleration() * get_app_Motor_rpm_2_pps() *\n                                       get_app_Reduction_ratio();\n            kPpMode.traj.profile_dec = kPpMode.traj.profile_acc;\n        }\n        else if (kPpMode.emergency_brake_mode != EMERGENCY_BRAKE_MODE_DISABLED)\n        {\n            // TODO: 电压限制急停先不实现按正常减速斜率停机\n            kPpMode.traj.profile_acc = get_app_Profile_acceleration() * get_app_Motor_rpm_2_pps() *\n                                       get_app_Reduction_ratio();\n            kPpMode.traj.profile_dec = get_app_Profile_deceleration() * get_app_Motor_rpm_2_pps() *\n                                       get_app_Reduction_ratio();\n        }\n        // 在急停后失能电机模式下，检测到零速后电机失能\n        if (kPpMode.emergency_brake_mode \u003c= EMERGENCY_BRAKE_MODE_VOLTAGE_LIMIT)\n        {\n            kPpMode.check_status_val = (CheckStatusVal_t)app_get_check_status_val();\n            if (kPpMode.emergency_brake_mode == EMERGENCY_BRAKE_MODE_DISABLED ||\n                kPpMode.check_status_val.bits.velocity_zero == true)\n            {\n                set_app_Controlword(APP_CTRL_DISABLE);\n                kPpMode.now_Controlword = APP_CTRL_DISABLE;\n            }\n        }\n    }\n\n    if (kPpMode.now_Controlword != APP_CTRL_DISABLE)\n    {\n        PosTrajectoryPlanningHandle(&kPpMode.traj);\n    }\n\n    kPpMode.pre_Controlword = kPpMode.now_Controlword;\n\n    AppPositionTargetReachedStateCheck();\n\n    return APP_RET_RUNNING;\n}", "cut": false, "note": ""}, "app/app_trajectory.c:PosTrajectoryPlanningHandle": {"file": "app/app_trajectory.c", "line": 28, "src": "void PosTrajectoryPlanningHandle(POS_TRAJECTORY_DATA *pos_traj_data)\n{\n    int8_T state_now = 0;\n    pos_traj_data->period_s = axis->pmsm_config.tp_s;\n\n    pos_trajectory_planning(&pos_traj_data->pos_tar_p,\n                            &pos_traj_data->profile_speed,\n                            &pos_traj_data->profile_acc,\n                            &pos_traj_data->profile_dec,\n                            &pos_traj_data->period_s,\n                            &axis->input_shaping_input.pos_cmd_p,\n                            &pos_traj_data->pos_out_dec_p,\n                            &axis->pos_speed_ctl_input.speed_tar_p_s,\n f (kPvMode.emergency_brake_mode \u003c= EMERGENCY_BRAKE_MODE_VOLTAGE_LIMIT)\n        {\n            kPvMode.check_status_val = (CheckStatusVal_t)app_get_check_status_val();\n            if (kPvMode.emergency_brake_mode == EMERGENCY_BRAKE_MODE_DISABLED ||\\\n                kPvMode.check_status_val.bits.velocity_zero == true)\n            {\n                set_app_Controlword(APP_CTRL_DISABLE);\n                kPvMode.now_Controlword = APP_CTRL_DISABLE;\n            }\n        }\n    }\n\n    if (kPvMode.now_Controlword != APP_CTRL_DISABLE)\n    {\n        SpeedTrajectoryPlanningHandle(&kPvMode.traj);\n    }\n\n    kPvMode.pre_Controlword = kPvMode.now_Controlword;\n\n    AppVelocityTargetReachedStateCheck();\n\n    return APP_RET_RUNNING;\n}", "cut": false, "note": ""}, "app/app_trajectory.c:SpeedTrajectoryPlanningHandle": {"file": "app/app_trajectory.c", "line": 54, "src": "void SpeedTrajectoryPlanningHandle(SPEED_TRAJECTORY_DATA *speed_traj_data)\n{\n    int8_T state_now = 0;\n    speed_traj_data->period_s = axis->pmsm_config.tp_s;\n\n    linear_trajectory_planning(&speed_traj_data->speed_tar_p,\n                               &speed_traj_data->acc,\n                               &speed_traj_data->period_s,\n                               &axis->pos_speed_ctl_input.speed_tar_p_s,\n                               &state_now, &(kSpeedTrajDw));\n}", "cut": false, "note": ""}, "app/app_profile_torque_mode.c:PtModeRun": {"file": "app/app_profile_torque_mode.c", "line": 30, "src": "AppResult PtModeRun(void)\n{\n    kPtMode.now_Controlword = (APP_CONTROL_WORD)get_app_Controlword();\n\n    if (kPtMode.now_Controlword == APP_CTRL_ENABLE)\n    {\n        if (!get_app_Emergency_brake_requested())\n        {\n            if (kPtMode.pre_Controlword == APP_CTRL_DISABLE)\n            {\n                // 重新使能后初始化规划器\n                TorqueTrajectoryPlanningInit();\n            }\n\n            // 规划力矩为0的情况：1. 暂停指令生效 2. 抱闸状态不为松闸\n            if (get_app_Halt_running_cmd() == id) {\n\n    uint16_t statusword = get_Statusword();\n\n    CIA402_SET_BIT(statusword, kOd6041_Remote);\n\n    const StateTableEntry *entry = state_table;\n\n    kCheckStatusVal = (CheckStatusVal_t)app_get_check_status_val();\n    kCheckErrorVal = (CheckErrorCode_t)app_get_check_error_val();\n\n    for (uint8_t i = 0; i \u003c CIA402_ARRAY_SIZE(state_table); i++, entry++) {\n        if ((entry->op_mode == get_Modes_of_operation()) || (entry->op_mode == kOd6060_ANY)) {\n            if (entry->check_state()) {\n                CIA402_SET_BIT(statusword, entry->bit_mask);\n            }\n            else {\n                CIA402_CLEAR_BIT(statusword, entry->bit_mask);\n            }\n        }\n    }\n    set_Statusword(statusword);\n}", "cut": false, "note": ""}, "motor_control/motor_ctl_sm.c:PosSpeedCtlLoopTask": {"file": "motor_control/motor_ctl_sm.c", "line": 302, "src": "void PosSpeedCtlLoopTask(Axis *const axis, AxisDw *const axis_dw)\n{\n   uint32_T error_code = 0;\n\n   // 运行电机端位置传感器数据处理\n   motor_pos_sensor(&axis->motor_pos_sensor_input,\n                    &axis->motor_pos_sensor_config,\n                    &axis->motor_pos_sensor_output,\n                    &(axis_dw->motor_pos_sensor_InstanceData.rtdw));\n\n   axis->pos_speed_ctl_input.pos_now_p = axis->motor_pos_sensor_output.enc_sum_p; // 获取电机端当前绝对位置\n\n   // 运行负载端位置传感器数据处理\n   load_pos_sensor(&axis->load_pos_sensor_input,\n                   &axis->load_pos_sensor_config,\n                   &axis->load_pos_sensor_output,\n                   &(axis_dw->load_pos_sensor_InstanceData.rtdw));\n\n   // 运行速度观测器 进行速度估计\n   axis->speed_obs_pll_input.pos_now_p = axis->pos_speed_ctl_input.pos_now_p;\n\n   speed_obs_pll(&axis->speed_obs_pll_input, &axis->speed_obs_pll_config,\n                 &axis->speed_obs_pll_output,\n                 &(axis_dw->speed_obs_pll_InstanceData.rtdw));\n\n   axis->pos_speed_ctl_input.speed_now_rad_s = axis->speed_obs_pll_output.ev_rad_s; // 速度观测器输出\n\n   // 保护检测  更新状态机错误代码\n   protect_check(&axis->current_ctl_input.iabc_now_A[0], &axis->current_ctl_input.dc_bus_now_V,\n                 &axis->current_ctl_input.driver_temp,\n                 &axis->pos_speed_ctl_output.pos_ctl_error_p,\n                 &axis->pos_speed_ctl_input.speed_now_rad_s,\n                 &axis->motor_ctl_sm_config,\n                 &error_code);\n\n   // 状态机切换\n   // 错误状态\n   if (error_code != MOTOR_CTL_SM_NONE_ERROR) // 有错误 进入错误状态\n   {\n      axis->motor_ctl_sm_output.state = MOTOR_CTL_SM_STATE_ERROR;\n      axis->motor_ctl_sm_output.error = error_code;\n   }\n\n   if (axis->motor_ctl_sm_output.state == MOTOR_CTL_SM_STATE_ERROR)\n   {\n      if (axis->motor_ctl_sm_input.motor_enable == MOTOR_CTL_SM_MOTOR_CLEAR_ERROR &&\n          axis->motor_ctl_sm_output.motor_enable_last == MOTOR_CTL_SM_MOTOR_DISABLE) // 清除错误  0->3 清除错误\n      {\n         axis->pos_speed_ctl_output.pos_ctl_error_p = 0;               // 清除位置跟随误差\n         axis->motor_ctl_sm_output.state = MOTOR_CTL_SM_STATE_DISABLE; // 进入空闲状态\n         axis->motor_ctl_sm_output.error = MOTOR_CTL_SM_NONE_ERROR;    // 清除错误\n      }\n      axis->motor_ctl_sm_output.motor_enable_last = axis->motor_ctl_sm_input.motor_enable;\n      return; // 没有清除错误指令 直接退出\n   }\n\n   // 其他状态下 失能指令会立即进入失能状态\n   if (axis->motor_ctl_sm_input.motor_enable == MOTOR_CTL_SM_MOTOR_DISABLE) // 失能电机状态\n   {\n      axis->motor_ctl_sm_output.state = MOTOR_CTL_SM_STATE_DISABLE; // 进入失能状态\n   }\n\n   // 失能状态\n   if (axis->motor_ctl_sm_output.state == MOTOR_CTL_SM_STATE_DISABLE)\n   {\n      // 电流环 进入 电压控制  输出电压为 0\n      axis->current_ctl_input.idq_tar_A[0] = 0.0f;\n      axis->current_ctl_input.idq_tar_A[1] = 0.0f;\n      axis->current_ctl_input.mode = 0; // 电压直接控制模式\n      axis->current_ctl_input.uabc_tar_V[0] = 0.0f;\n      axis->current_ctl_input.uabc_tar_V[1] = 0.0f;\n      axis->current_ctl_input.uabc_tar_V[2] = 0.0f;\n      axis->pos_speed_ctl_output.pos_ctl_error_p = 0; // 清除位置跟随误差\n   }\n\n   // 空闲状态\n   if (axis->motor_ctl_sm_output.state == MOTOR_CTL_SM_STATE_DISABLE) // 空闲状态等待使能指令\n   {\n      // 使能状态  0->1 电机进入使能状态\n      if (axis->motor_ctl_sm_input.motor_enable == MOTOR_CTL_SM_MOTOR_ENABLE &&\n          axis->motor_ctl_sm_output.motor_enable_last == MOTOR_CTL_SM_MOTOR_DISABLE)\n      {\n         ModeCheckInInit(axis, axis_dw);                              // 使能前初始化\n         axis->motor_ctl_sm_output.state = MOTOR_CTL_SM_STATE_ENABLE; // 进入使能状态\n      }\n   }\n\n   // 使能状态 且 硬件准备就绪\n   if (axis->motor_ctl_sm_output.state == MOTOR_CTL_SM_STATE_ENABLE)\n   {\n      if (axis->motor_ctl_sm_input.hw_ready_state)\n      {\n         ModeRun(axis, axis_dw); // 模式运行\n      }\n   }\n\n   // 记录上个周期指令和状态\n   axis->motor_ctl_sm_output.motor_enable_last = axis->motor_ctl_sm_input.motor_enable;\n}", "cut": false, "note": "每个位置环周期由 `PosSpeedLoopCtrl` 调一次。顺序固定：先把传感器读数变成位置和速度，再做保护检查，最后按状态机决定这一周期是清零输出、做使能前初始化，还是交给 `ModeRun` 跑当前模式。它自己不开关 PWM，只改 `motor_ctl_sm_output.state`；PWM 由调用方按这个状态去开关。\n\n**一、读位置和速度（不论什么状态都跑）**\n\n- `motor_pos_sensor(&axis->motor_pos_sensor_input, ...)`：处理电机端编码器。输入的单圈计数 `enc_counts_now_p` 是调用方刚用 `bsp_get_encoder_cnt(ENCODER_ID_MOTOR)` 填进去的，输出里的 `enc_sum_p` 是累计的多圈绝对位置。\n- `axis->pos_speed_ctl_input.pos_now_p = axis->motor_pos_sensor_output.enc_sum_p;`：从这一行起，这一周期的“当前位置”才确定，后面的速度观测、保护和各模式都用它。\n- `load_pos_sensor(...)`：同样处理负载端编码器。这里没有接着用它的输出，留给后面 `ModeRun` 里需要负载端位置的模式。\n- `axis->speed_obs_pll_input.pos_now_p = axis->pos_speed_ctl_input.pos_now_p;` 然后 `speed_obs_pll(...)`：速度不是直接测的，是锁相环观测器从位置估出来的。\n- `axis->pos_speed_ctl_input.speed_now_rad_s = axis->speed_obs_pll_output.ev_rad_s;`：估出的速度，单位 rad/s，写进位置速度环的输入。\n\n传感器处理放在状态机前面，所以失能、甚至错误状态下位置和速度也一直在更新，上位机看到的位置不会停住，使能那一刻也不会有跳变。\n\n**二、保护检查**\n\n- `protect_check(&axis->current_ctl_input.iabc_now_A[0], ..., &error_code);`：拿三相电流、母线电压、驱动器温度、位置跟随误差和刚估出的速度，对照 `motor_ctl_sm_config` 里的限值检查，有问题就把错误码写进局部变量 `error_code`（开头初始化为 0）。\n- 其中电流、电压、温度是电流环那边采样放进 `current_ctl_input` 的；`pos_ctl_error_p` 是**上一个周期**位置环算出的跟随误差，因为这一周期的模式还没跑。\n- `if (error_code != MOTOR_CTL_SM_NONE_ERROR)`：一旦有错，不管原来是什么状态，直接改成 `MOTOR_CTL_SM_STATE_ERROR`，并记下错误码 `motor_ctl_sm_output.error`。\n\n**三、错误状态：只等“清除错误”**\n\n- `if (axis->motor_ctl_sm_output.state == MOTOR_CTL_SM_STATE_ERROR)`：这个块最后无条件 `return;`，所以错误状态下后面的失能处理和 `ModeRun` 都不会执行。电流环的目标值不在这里清零；电机停下来靠的是调用方看到状态不是使能，就 `bsp_set_pwm_state(PWM_DISABLE)` 关掉 PWM。\n- `motor_enable == MOTOR_CTL_SM_MOTOR_CLEAR_ERROR && motor_enable_last == MOTOR_CTL_SM_MOTOR_DISABLE`：清除错误要的是指令从 0 变成 3 的那个“上升沿”，一直保持 3 不算。所以主站要先发 0 再发 3。\n- 清除时做三件事：跟随误差 `pos_ctl_error_p` 归零（否则下一周期保护检查又会因为旧误差报错）、状态回到 `MOTOR_CTL_SM_STATE_DISABLE`、错误码归零。注意回到的是失能，不是使能，要转起来还得再发一次使能。\n- `return` 之前先写 `motor_enable_last`：因为提前返回会跳过函数末尾那一行，这里不补上，上升沿就没法判断了。\n\n**四、失能指令优先**\n\n- `if (axis->motor_ctl_sm_input.motor_enable == MOTOR_CTL_SM_MOTOR_DISABLE)`：只要不在错误状态，收到 0 就马上进失能，不等当前模式走完。其他指令值（比如 2 紧急停车）在这里不处理，状态保持不变，交给应用层和模式自己去处理。\n\n**五、失能状态：清零输出**\n\n- 第一个 `if (state == MOTOR_CTL_SM_STATE_DISABLE)`：把电流环切到电压直接控制（`current_ctl_input.mode = 0`），dq 电流目标和三相电压目标全部写 0，跟随误差归零。这样即使 PWM 还开着，也只输出零电压；跟随误差归零是为了下次使能时保护检查不会拿旧误差误报。\n\n**六、失能到使能的上升沿**\n\n- 第二个 `if (state == MOTOR_CTL_SM_STATE_DISABLE)` 条件和上一个完全一样，只是拆开写：上一个块负责清零，这一个块负责等使能。\n- `motor_enable == MOTOR_CTL_SM_MOTOR_ENABLE && motor_enable_last == MOTOR_CTL_SM_MOTOR_DISABLE`：同样只认 0→1 的上升沿。如果失能时指令一直停在 1（比如正转着被保护打断、清错后又发了 1），不会自己再使能，要先发 0 再发 1。\n- `ModeCheckInInit(axis, axis_dw);`：按当前模式 `motor_ctl_sm_config.mode` 做使能前的初始化。位置、速度、力矩、MIT 模式这里是空的；各种辨识、往复运动、参考信号模式会复位自己的内部状态，并把当前位置 `enc_sum_p` 记作起点，所以使能那一刻不会往旧起点跳。\n- 然后状态改成 `MOTOR_CTL_SM_STATE_ENABLE`。\n\n**七、使能状态：跑当前模式**\n\n- `if (axis->motor_ctl_sm_input.hw_ready_state)`：硬件就绪才调 `ModeRun`。`hw_ready_state` 由调用方在本函数返回**之后**更新（PWM 已打开且电流校准完成才为 1）。\n- 所以刚使能的那个周期，`hw_ready_state` 还是上一周期的 0，`ModeRun` 不会跑；调用方看到状态从失能变成使能，这时才打开 PWM；下一周期 `hw_ready_state` 变成 1，模式才真正开始跑。中间这一周期的输出就是第五步清零的结果。\n- 如果使能后硬件变成不就绪，`ModeRun` 不再跑，但 `current_ctl_input` 里不会被清零，保留的是最后一次 `ModeRun` 写进去的值。\n- `ModeRun(axis, axis_dw);`：按 `motor_ctl_sm_config.mode` 用 `switch` 分到 `PositionStep`、`SpeedStep`、`TorqueStep` 或各种辨识模式，最后写出电流环的目标。\n\n**八、记住这一周期的指令**\n\n- `axis->motor_ctl_sm_output.motor_enable_last = axis->motor_ctl_sm_input.motor_enable;`：给下一周期判断上升沿用。错误状态走不到这里，所以第三步里单独写了一次。"}, "embedded_project/Y01/Board/bsp_api.c:bsp_set_pwm_state": {"file": "embedded_project/Y01/Board/bsp_api.c", "line": 126, "src": "void bsp_set_pwm_state(bool state)\n{\n    kBspData.pwm_en_state = state;\n#ifdef VIRTUAL_MOTOR_MODEL\n\n#else\n    if (state == PWM_ENABLE)\n    {\n        __HAL_TIM_MOE_ENABLE(&PWM_TIM_HANDLE);\n    }\n    else\n    {\n        __HAL_TIM_MOE_DISABLE_UNCONDITIONALLY(&PWM_TIM_HANDLE);\n    }\n#endif\n}", "cut": false, "note": ""}, "embedded_project/Y01/Board/bsp_api.c:sys_current_calibration_step": {"file": "embedded_project/Y01/Board/bsp_api.c", "line": 87, "src": "void sys_current_calibration_step(void)\n{\n#ifdef VIRTUAL_MOTOR_MODEL\n    return;\n#else\n    CurrentCalibrationStep();\n#endif\n}", "cut": false, "note": ""}, "database/data_param.c:AppParamSyncUser": {"file": "database/data_param.c", "line": 304, "src": "void AppParamSyncUser(void)\n{\n    get_app_Statusword();\n    get_app_Error_word();\n\n    get_app_Position_demand_value();\n    get_app_Position_actual_value_inc();\n    get_app_Position_actual_value();\n    get_app_Following_error_actual_value();\n    get_app_Velocity_demand_value();\n    get_app_Velocity_actual_value();\n    get_app_Torque_demand_value();\n\n    get_app_Torque_actual_value();\n    get_app_Current_actual_value();\n    get_app_DC_link_circuit_voltage();\n\n    get_app_Drive_temperature();\n\n    get_app_D_current_actual_value();\n\n    get_app_Alarm_word();\n\n    get_app_Modes_of_operation_display();\n\n    get_app_Version();\n\n    get_app_U_current_actual_value();\n    get_app_V_current_actual_value();\n    get_app_W_current_actual_value();\n\n    get_app_Motor_position_demand_value();\n    get_app_Motor_position_actual_value();\n    get_app_Motor_following_error_actual_value();\n    get_app_Motor_velocity_demand_value();\n    get_app_Motor_velocity_actual_value();\n\n    get_app_Motor_power();\n\n    get_app_Current_loop_time();\n    get_app_Position_loop_time();\n    get_app_Current_loop_cycle();\n    get_app_Position_loop_cycle();\n}", "cut": false, "note": ""}, "common/software_scope/scope_app.c:ScopeIsrHandle": {"file": "common/software_scope/scope_app.c", "line": 412, "src": "void ScopeIsrHandle(void) {\n    //初始化未完成，则直接返回\n    if (kInitSuccessFlag != kScopeObject.init_flag) { return; }\n\n    //示波器状态异常\n    if (kScopeError == kScopeObject.status_word) { return; }\n\n    /* 如果采集完成，则打包采集到的数据 */\n    if ((kSampleComplete == kScopeObject.sample_complete_flag) &&\n        (kScopeObject.status_word != kSampleSuccess)) {\n        kScopeObject.status_word = kSampleSuccess;\n        kScopeObject.sample_isr_flag = kSampleIsrClose;\n\n        sample_complete_deal();\n    }\n\n    /* 如果采样中断没有打开，则直接返回 */\n    if (kSampleIsrOpen != kScopeObject.sample_isr_flag) { return; }\n\n    /* 返回值，如果已经采集完成，则返回 */\n    if (kSampleComplete == kScopeObject.sample_complete_flag) { return; }\n\n    /* 进行采样间隙判断 */\n    kScopeObject.sample_interval_count++;\n    if (kScopeObject.sample_interval_count \u003c kScopeObject.sample_interval) { return; }\n\n    kScopeObject.sample_interval_count = 0;\n    /* 进行数据记录 */\n    scope_data_sample_run();\n    /* 捕捉触发边沿 */\n    scope_trigger_catch();\n    /* 判断是否已经采集完成 */\n    sample_complete_judge();\n}", "cut": false, "note": ""}, "simulink_code_gen/motor_pos_sensor.c:motor_pos_sensor": {"file": "simulink_code_gen/motor_pos_sensor.c", "line": 31, "src": "void motor_pos_sensor(const MotorPosSensorInput *rtu_input, const\n                      MotorPosSensorConfig *rtu_config, MotorPosSensorOutput\n                      *rty_output, motor_pos_sensor_DW_f *localDW)\n{\n    int64_T tmp;\n    uint32_T enc_line_half;\n    uint32_T qY;\n    uint32_T rtb_Merge;\n\n    /* If: '\u003cS1>/If' */\n    if (rtu_config->dir > 0)\n    {\n        /* Outputs for IfAction SubSystem: '\u003cS1>/If Action Sub t.signal_out;\n      axis->current_ctl_input.idq_tar_A[1] = 0.0f;\n      axis->current_ctl_input.elec_angle_speed_rad_s =\n          axis->pos_speed_ctl_input.speed_now_rad_s * axis->pmsm_config.pn;                      // 获取当前电角速度\n      axis->current_ctl_input.elec_theta_rad = axis->motor_pos_sensor_output.elec_angle_now_rad; // 获取当前电角度;\n      axis->current_ctl_input.mode = 1;\n      break;\n   case REFERENCE_SIGNAL_TARGET_Q_CURRENT: // q轴\n                                           // 由用户指令电流控制直接控制\n      axis->current_ctl_input.idq_tar_A[0] = 0.0f;\n      axis->current_ctl_input.idq_tar_A[1] = axis->reference_signal_output.signal_out;\n      axis->current_ctl_input.elec_angle_speed_rad_s =\n          axis->pos_speed_ctl_input.speed_now_rad_s * axis->pmsm_config.pn;                      // 获取当前电角速度\n      axis->current_ctl_input.elec_theta_rad = axis->motor_pos_sensor_output.elec_angle_now_rad; // 获取当前电角度;\n      axis->current_ctl_input.mode = 1;\n      break;\n   case REFERENCE_SIGNAL_TARGET_SPEED: // 速度\n      axis->pos_speed_ctl_input.speed_tar_p_s = axis->reference_signal_output.signal_out;\n\n      axis->pos_speed_ctl_config.mode = POS_SPEED_CTL_MODE_SPEED;\n      pos_speed_ctl_pip(\n          &axis->pos_speed_ctl_input,\n          &axis->pos_speed_ctl_config,\n          &axis->pos_speed_ctl_output,\n          &(axis_dw->pos_speed_ctl_pip_InstanceData.rtdw));\n\n      // 转矩脉动与摩擦补偿\n      TqFcComStep(axis, axis_dw);\n\n      // 指令电流滤波\n      CommandCurrentFilter(axis, axis_dw);\n      break;\n   case REFERENCE_SIGNAL_TARGET_POSITION: // 位置\n      PosReferenceSignalTemp(&axis->reference_signal_config,\n                             &axis->reference_signal_output,\n                             &(axis_dw->reference_signal_InstanceData.rtdw));\n\n      axis->input_shaping_input.pos_cmd_p = axis->reference_signal_output.signal_pos;\n      axis->pos_speed_ctl_input.speed_tar_p_s = axis->reference_signal_output.signal_vel;\n      axis->pos_speed_ctl_input.acc_tar_p_ L_MOTOR_MODEL\n        SimPlantStep();\n#endif\n        bsp_set_timer_record_stop(SYS_TIMER_RECORD_CURRENT_LOOP_TIME_INDEX);\n\n        // 第一次运行完电流环后启动常规非同步周期位置环\n        if (kBspData.pl_start_state == false)\n        {\n            kBspData.pl_start_state = true;\n\n            // 1. 重置计数器\n            POSITION_LOOP_TIM_HANDLE.Instance->CNT = 0;\n            // 2. 使能中断和计数器\n            POSITION_LOOP_TIM_HANDLE.Instance->DIER |= TIM_DIER_UIE;\n            POSITION_LOOP_TIM_HANDLE.Instance->CR1 |= TIM_CR1_CEN;\n            // 3. 生成更新事件\n            POSITION_LOOP_TIM_HANDLE.Instance->EGR |= TIM_EGR_UG;\n        }\n    }\n}", "cut": false, "note": ""}, "embedded_project/Y01/Board/bsp_api.c:sys_get_hardware_self_test_status": {"file": "embedded_project/Y01/Board/bsp_api.c", "line": 61, "src": "bool sys_get_hardware_self_test_status(void)\n{\n#ifdef VIRTUAL_MOTOR_MODEL\n    return true;\n#else\n    return get_hardware_self_test_status();\n#endif\n}", "cut": false, "note": ""}, "embedded_project/Y01/Board/bsp_api.c:sys_get_current_calibration_status": {"file": "embedded_project/Y01/Board/bsp_api.c", "line": 100, "src": "CURRENT_CALIBRATION_STATUS sys_get_current_calibration_status(void)\n{\n#ifdef VIRTUAL_MOTOR_MODEL\n    return CURRENT_CALIBRATION_STATUS_OK;\n#else\n    return get_current_calibration_status();\n#endif\n}", "cut": false, "note": ""}, "motor_control/motor_ctl_loop.c:CurrentLoopCtrl": {"file": "motor_control/motor_ctl_loop.c", "line": 179, "src": "void CurrentLoopCtrl(void)\n{\n    // 电流环系统输入\n    // 1. 读取当前实际三相电流\n    bsp_get_phase_current(kAxis.current_ctl_input.iabc_now_A);\n\n    // 2. 执行电流环控制算法\n    CurrentCtlLoopTask(&kAxis, &kAxisDw);\n\n    // 3. 输出电机控制电压\n    bsp_set_phase_voltage(kAxis.current_ctl_output.uabc_tar_comp_V);\n}", "cut": false, "note": ""}, "motor_control/motor_ctl_loop.c:SimPlantStep": {"file": "motor_control/motor_ctl_loop.c", "line": 264, "src": "void SimPlantStep(void)\n{\n    // 运行虚拟电机模型,在电流环中断中调用,一个电流环执行1次虚拟模型计算\n    for (uint8_ TASK(TIM_HandleTypeDef *htim)\n{\n    if (htim->Instance == NRT_TASK_TIM_HANDLE.Instance)\n    {\n        UnrealTimeBase1ms();\n    }\n#ifdef USE_CANOPEN\n    else if (htim->Instance == CANOPEN_TIM_HANDLE.Instance)\n    {\n        CANopen_DispatchFromISR();\n    }\n#endif // USE_CANOPEN\n#ifdef USE_ECAT\n    else if (htim->Instance == ECAT_LAN9252_TIM_HANDLE.Instance)\n    {\n        ECAT_CheckTimer();\n    }\n#endif // USE_ECAT\n}", "cut": false, "note": ""}, "motor_control/motor_ctl_loop.c:UnrealTimeBase1ms": {"file": "motor_control/motor_ctl_loop.c", "line": 117, "src": "void UnrealTimeBase1ms(void)\n{\n    float data_org = 0.0f;\n    float data_org_p = 0.0f;\n    float lpf_k = K_LPF_TEMP; // 滤波系数  100HZ  1ms周期\n\n    // 1. 读取母线电压\n    data_org = bsp_get_dc_bus_voltage();\n\n    math_lib_first_order_lpf_iir(&data_org, &lpf_k,\n                                 &kAxis.current_ctl_input.dc_bus_now_V,\n                                 &kAxis.current_ctl_input.dc_bus_now_V);\n\n    // 2. 读取驱动器温度\n    data_org = bsp_get_mos_temperature();\n\n    math_lib_first_order_lpf_iir(&data_org, &lpf_k,\n                                 &kAxis.current_ctl_input.driver_temp,\n                                 &kAxis.current_ctl_input.driver_temp);\n\n    // 3. 读取MCU温度\n    data_org_p = bsp_get_mcu_temperature();\n\n    math_lib_first_order_lpf_iir(&data_org_p, &lpf_k,\n                                 &kAppStatusInfo.Mcu_temperature,\n                                 &kAppStatusInfo.Mcu_temperature);\n\n    // 4. 读取电机温度\n    data_org = bsp_get_motor_temp();\n\n    math_lib_first_order_lpf_iir(&data_org, &lpf_k,\n                                 &kAppStatusInfo.Motor_temperature,\n                                 &kAppStatusInfo.Motor_temperature);\n\n    // 5. 更新母线电流\n    bsp_get_dc_bus_current();\n\n    // 6. 状态扫描\n    AppStatusScanSlow();\n\n    // 7. 更新抱闸控制\n    AppBrakeControlRun();\n\n    // 8. 更新LED状态\n    AppLedStateUpdata1ms();\n\n    // 9. flash参数存储\n    AppStoreUpdata1ms();\n\n    // 10. 固件升级运行主函数\n#ifdef YH_RELEASE\n    bsp_run_fw_upgrade();\n#endif // YH_RELEASE\n\n#ifdef MOTOR_CTL_TEST // 控制层示例测试代码\n    motor_ctl_test();\n#endif\n}", "cut": false, "note": ""}, "embedded_project/Y01/Board/drv_can_app.c:CANopen_DispatchFromISR": {"file": "embedded_project/Y01/Board/drv_can_app.c", "line": 166, "src": "void CANopen_DispatchFromISR(void)\n{\n    // 若已外部判断清除中断标志位，无需重复清除\n    drv_can_app.canopen.last_counter_val = 0;\n    drv_can_app.canopen.elapsed_time = 0;\n    TimeDispatch();\n}", "cut": false, "note": ""}, "communication/protocol/CANopen/src/timer.c:TimeDispatch": {"file": "communication/protocol/CANopen/src/timer.c", "line": 121, "src": "void TimeDispatch(void)\n{\n\tTIMER_HANDLE i;\n\tTIMEVAL next_wakeup = TIMEVAL_MAX; /* used to compute when should normaly occur next wakeup */\n\t/* First run : change timer state depending on time */\n\t/* Get time since timer signal */\n\tUNS32 overrun = (UNS32)getElapsedTime();\n\n\tTIMEVAL real_total_sleep_time = total_sleep_time + overrun;\n\n\ts_timer_entry *row;\n\n\tfor(i=0, row = timers; i \u003c= last_timer_raw; i++, row++)\n\t{\n\t\tif (row->state & TIMER_ARMED) /* if row is active */\n\t\t{\n\t\t\tif (row->val \u003c= real_total_sleep_time) /* to be trigged */\n\t\t\t{\n\t\t\t\tif (!row->interval) /* if simply outdated */\n\t\t\t\t{\n\t\t\t\t\trow->state = TIMER_TRIG; /* ask for trig */\n\t\t\t\t}\n\t\t\t\telse /* or period have expired */\n\t\t\t\t{\n\t\t\t\t\t/* set val as interval, with 32 bit overrun correction, */\n\t\t\t\t\t/* modulo for 64 bit not available on all platforms     */\n\t\t\t\t\trow->val = row->interval - (overrun % (UNS32)row->interval);\n\t\t\t\t\trow->state = TIMER_TRIG_PERIOD; /* ask for trig, periodic */\n\t\t\t\t\t/* Check if this new timer value is the soonest */\n\t\t\t\t\tif(row->val \u003c next_wakeup)\n\t\t\t\t\t\tnext_wakeup = row->val;\n\t\t\t\t}\n\t\t\t}\n\t\t\telse\n\t\t\t{\n\t\t\t\t/* Each armed timer value in decremented. */\n\t\t\t\trow->val -= real_total_sleep_time;\n\n\t\t\t\t/* Check if this new timer value is the soonest */\n\t\t\t\tif(row->val \u003c next_wakeup)\n\t\t\t\t\tnext_wakeup = row->val;\n\t\t\t}\n\t\t}\n\t}\n\n\t/* Remember how much time we should sleep. */\n\ttotal_sleep_time = next_wakeup;\n\n\t/* Set timer to soonest occurence */\n\tsetTimer(next_wakeup);\n\n\t/* Then trig them or not. */\n\tfor(i=0, row = timers; i\u003c=last_timer_raw; i++, row++)\n\t{\n\t\tif (row->state & TIMER_TRIG)\n\t\t{\n\t\t\trow->state &= ~TIMER_TRIG; /* reset trig state (will be free if not periodic) */\n\t\t\tif(row->callback)\n\t\t\t\t(*row->callback)(row->d, row->id); /* trig ! */\n\t\t}\n\t}\n}", "cut": false, "note": ""}, "communication/protocol/EtherCAT_LAN925x/Src/ecatappl.c:ECAT_CheckTimer": {"file": "communication/protocol/EtherCAT_LAN925x/Src/ecatappl.c", "line": 341, "src": "void ECAT_CheckTimer(void)\n{\n\n    /*decrement the state transition timeout counter*/\n    if(bEcatWaitForAlControlRes &&  (EsmTimeoutCounter > 0))\n    {\n        EsmTimeoutCounter--;\n    }\n\n\n    ECAT_SetLedIndication();\n\n    DC_CheckWatchdog();\n\n\n\n/*ECATCHANGE_START(V5.13) */\n    /* Increment the counter every ms between two updates based on the system time (32Bit overrun is handled in COE_SyncTimeStamp) */\n    if (!b32BitDc || ((u64Timestamp & 0xFFFFFFFF) \u003c= 4293000000UL))\n/*ECATCHANGE_END(V5.13) */\n    {\n\n        /* the timestamp is stored in ns */\n        u64Timestamp = u64Timestamp + 1000000;\n\n    }\n    else if(b32BitDc)\n    {\n        /* in case of a 32Bit DC and almost expired time stamp check for a DC overrun*/\n        u32CheckForDcOverrunCnt = CHECK_DC_OVERRUN_IN_MS;\n    }\n\n    u32CheckForDcOverrunCnt++;\n\n\n}", "cut": false, "note": ""}, "SIL_project/main.c:UnrealTimeCallback": {"file": "SIL_project/main.c", "line": 74, "src": "void UnrealTimeCallback(void* arg, void* arg_dw)\n{\n    UnrealTimeBase1ms();\n}", "cut": false, "note": ""}, "app/app_status_check.c:AppStatusScanSlow": {"file": "app/app_status_check.c", "line": 860, "src": "void AppStatusScanSlow(void)\n{\n    // 部分通用检测数据更新\n    kAppCheck.idq_now[0] = get_app_D_current_actual_value();\n    kAppCheck.idq_now[1] = get_app_Current_actual_value();\n    kAppCheck.idq_squared_now = kAppCheck.idq_now[0] * kAppCheck.idq_now[0] + kAppCheck.idq_now[1] * kAppCheck.idq_now[1];\n    kAppCheck.drive_temp_now = get_app_Drive_temperature();\n    kAppCheck.motor_temp_now = get_app_Motor_temperature();\n    kAppCheck.mcu_temp_now = get_app_Mcu_temperature();\n    kAppCheck.load_rpm_now = get_app_Velocity_actual_value();\n\n    // 遍历错误检测函数\n    for (uint8_t i = 0; i \u003c kAppCheck.scan_ring_num; i++)\n    {\n        if (CheckTable[i].scan_fast == false)\n        {\n            kAppCheck.error.all |= (CheckTable[i].check_func() \u003c\u003c i); // 对应bit置1\n        }\n    }\n\n    // 扫描到 nFault 错误，设置到控制层\n    if (kAppCheck.p_bsp_error->bit_band.error_nfault)\n    {\n        kAppCheck.error.bits.nfault_error = true;\n        axis->motor_ctl_sm_output.state = MOTOR_CTL_SM_STATE_ERROR;\n        axis->motor_ctl_sm_output.error = MOTOR_CTL_SM_NFAULT_ERROR;\n    }\n\n    // 发生错误失能电机\n    if (kAppCheck.error.all != 0)\n    {\n        // TODO：根据不同错误类型执行不同保护动作，目前统一失能\n        set_app_Controlword(APP_CTRL_DISABLE);\n\n        // 低速进行错误记录存储兼容高速部分\n        if (kAppCheck.error_record_addr[0] != kAppCheck.error.all) // 错误中，再新增其它错误再加入新记录\n        {\n            kAppCheck.error_record_latch_flag = false;\n        }\n        if (kAppCheck.error_record_latch_flag == false)\n        {\n            if (axis->motor_ctl_sm_output.state != MOTOR_CTL_SM_STATE_ENABLE && \\\n                get_app_Storage_status() != FLASH_STORE_STATUS_BUSY)    // 等待Flash空闲\n            {\n                // 数组FIFO，更新错误记录，低优先级更新避免重复记录错误\n                for (uint8_t i = ERROR_RECORD_NUM - 1; i > 0; i--)\n                {\n                    kAppCheck.error_record_addr[i] = kAppCheck.error_record_addr[i - 1];\n                }\n                kAppCheck.error_record_addr[0] = kAppCheck.error.all;\n                kAppCheck.error_record_latch_flag = true;\n                set_app_Storage_cmd(FLASH_STORE_CMD_WRITE_ERROR);\n            }\n        }\n    }\n    else\n    {\n        kAppCheck.error_record_latch_flag = false;\n    }\n\n    // 检查速度是否为零状态\n    AppVelocityZeroStateCheck();\n    AppTargetReachedStateCheck();\n}", "cut": false, "note": ""}, "app/app_brake_control.c:AppBrakeControlRun": {"file": "app/app_brake_control.c", "line": 27, "src": "void AppBrakeControlRun(void)\n{\n    if (brake_ctrl.mode == BRAKE_CONTROL_MODE_IO_AUTO || \\\n        brake_ctrl.mode == BRAKE_CONTROL_MODE_PWM_AUTO)\n    {\n        // 自动模式下，通过判断伺服当前状态进行设置抱闸/松闸请求\n        brake_ctrl.do_req = BRAKE_NULL;\n        APP_CONTROL_WORD now_Controlword = (APP_CONTROL_WORD)get_app_Controlword();\n        // 伺服使能或紧急制动时设置为松闸请求，其他状态时一律设置为抱闸请求\n        brake_ctrl.now_release_enable = (now_Controlword == APP_CTRL_ENABLE || \\\n                                        now_Controlword == APP_CTRL_EMERGENCY_BRAKE) ? \\\n                                        true : false;\n    }\n    else\n    {\n        // 手动模式下，根据外部控制的DO_IO_SET_BRAKE位判断抱闸/松闸请求\n        uint32_t u32_temp = ((uint32_t)1 \u003c\u003c DO_IO_SET_BRAKE) & \\\n                   get_app_Digital_io_outputs_phys() & \\\n                   get_app_Digital_io_outputs_mask();\n        brake_ctrl.do_req = (u32_temp != 0) ? BRAKE_RELEASE : BRAKE_ENGAGE;\n        brake_ctrl.now_release_enable = (brake_ctrl.do_req == BRAKE_RELEASE) ? true : false;\n    }\n\n    switch (brake_ctrl.state)\n    {\n        // 抱闸完成\n        case BRAKE_STATE_ENGAGED:\n            if (brake_ctrl.now_release_enable)\n            {\n                // 有 松闸请求\n                // 手动模式下直接松闸，自动模式下满足松闸延迟时间\n                brake_ctrl.timer += brake_ctrl.dt;\n                if (brake_ctrl.do_req == BRAKE_RELEASE || \\\n                    brake_ctrl.timer >= get_app_Brake_release_delay_time())\n                {\n                    // 切换到松闸进行中状态\n                    brake_ctrl.timer = 0.0f;\n                    brake_ctrl.state = BRAKE_STATE_RELEASING;\n                }\n            }\n            else\n            {\n                // 无/取消 松闸请求\n                brake_ctrl.timer = 0.0f;\n            }\n            break;\n        // 松闸进行中\n        case BRAKE_STATE_RELEASING:\n            if (brake_ctrl.now_release_enable)\n            {\n                // 松闸过程中，松闸机械动作时间\n                brake_ctrl.timer += brake_ctrl.dt;\n                if (brake_ctrl.timer >= get_app_Brake_release_time())\n                {\n                    // 松闸完成\n                    brake_ctrl.timer = 0.0f;\n                    brake_ctrl.state = BRAKE_STATE_RELEASED;\n                }\n            }\n            else\n            {\n                // 松闸过程中，抱闸\n                brake_ctrl.timer = 0.0f;\n                brake_ctrl.state = BRAKE_STATE_ENGAGING;\n            }\n            break;\n        // 松闸完成\n        case BRAKE_STATE_RELEASED:\n            if (!brake_ctrl.now_release_enable)\n            {\n                // 有 抱闸请求\n                // 手动模式下无需延时，自动模式下满足抱闸延迟时间或抱闸制动速度阈值\n                brake_ctrl.timer += brake_ctrl.dt;\n                if (brake_ctrl.do_req == BRAKE_ENGAGE || \\\n                    brake_ctrl.timer >= get_app_Brake_engage_delay_time() || \\\n                    MATH_ABS(get_app_Motor_velocity_actual_value()) \u003c= get_app_Dynamic_brake_speed_threshold())\n                {\n                    // 切换到抱闸进行中状态\n                    brake_ctrl.timer = 0.0f;\n                    brake_ctrl.state = BRAKE_STATE_ENGAGING;\n                }\n            }\n            else\n            {\n                // 无/取消 抱闸请求\n                brake_ctrl.timer = 0.0f;\n            }\n            break;\n        // 抱闸过程中\n        case BRAKE_STATE_ENGAGING:\n            if (!brake_ctrl.now_release_enable)\n            {\n                // 抱闸过程中\n                brake_ctrl.timer += brake_ctrl.dt;\n                if (brake_ctrl.timer >= get_app_Brake_engage_time())\n                {\n                    // 抱闸完成\n                    brake_ctrl.timer = 0.0f;\n                    brake_ctrl.state = BRAKE_STATE_ENGAGED;\n                }\n            }\n            else\n            {\n                // 抱闸过程中，松闸\n                brake_ctrl.timer = 0.0f;\n                brake_ctrl.state = BRAKE_STATE_RELEASING;\n            }\n            break;\n        default:\n            break;\n    }\n\n    // 更新抱闸PWM定时器配置参数及当前抱闸输出状态\n    bsp_set_brake_pwm_timer_config(brake_ctrl.state);\n    set_app_Brake_state((uint8_t)brake_ctrl.state);\n}", "cut": false, "note": ""}, "app/app_status_check.c:AppLedStateUpdata1ms": {"file": "app/app_status_check.c", "line": 951, "src": "void AppLedStateUpdata1ms(void)\n{\n    static uint16_t run_led_times_count = 0; // 运行LED闪烁计数\n    static uint16_t run_led_blink_period = LED_NORMAL_STATE_PERIOD; // 运行LED闪烁周期\n\n    if (app_get_check_error_val() != 0) // 有错误\n    {\n        bsp_set_error_led_state(1); // 错误LED常亮\n        run_led_blink_period = LED_ERROR_STATE_PERIOD;\n    }\n    else\n    {\n        bsp_set_error_led_state(0); // 错误LED常灭\n        run_led_blink_period = LED_NORMAL_STATE_PERIOD;\n    }\n\n    // 运行LED闪烁逻辑\n    if (run_led_times_count++ >= run_led_blink_period)\n    {\n        run_led_times_count = 0;        // 重置计数\n        bsp_set_run_led_toggle(); // 翻转运行LED状态\n    }\n}", "cut": false, "note": ""}, "app/app_store_param.c:AppStoreUpdata1ms": {"file": "app/app_store_param.c", "line": 450, "src": "void AppStoreUpdata1ms(void)\n{\n    FLASHDB_STATUS flashdb_status = FLASHDB_NO_ERR;\n\n    FLASH_STORE_CMD store_cmd = get_app_Storage_cmd();\n    FLASH_STORE_STATUS store_status = get_app_Storage_status();\n\n    // 窗口检查擦写频率，是否保护Flash不被频繁擦写\n    if (IsFlashWriteGuard(store_cmd))\n    {\n        // flashdb_status = FLASHDB_PROTECT_ERR;\n        set_app_Storage_status(FLASH_STORE_STATUS_PROTECT);\n        sys_set_bsp_error_state(ERROR_FLASH_STORE, ERROR_SET);\n        set_app_Storage_cmd(FLASH_STORE_CMD_NULL);\n        return;\n    }\n\n    if (store_cmd != FLASH_STORE_CMD_NULL &&\n        store_status != FLASH_STORE_STATUS_BUSY)\n    {\n        // 实测参数存储耗时\n        //set_timer_record_start(9);\n        uint32_t *p_AppErrorRecordsList = get_app_Error_records_list_addr();\n\n        set_app_Storage_status(FLASH_STORE_STATUS_BUSY);\n        switch (store_cmd)\n        {\n            // 数据库参数存储相关\n            case FLASH_STORE_CMD_READ_PARAM:\n                flashdb_status = bsp_flashdb_read(FLASHDB_KEY_INDEX_ALL_PARAM);\n\n                if (flashdb_status == FLASHDB_NO_ERR)\n                {\n                    // flash参数赋值到内部变量\n                    flash_param_init();\n                    app_param_update();\n                }\n                break;\n            case FLASH_STORE_CMD_WRITE_PARAM:\n                flash_param_update();\n\n                flashdb_status = bsp_flashdb_write(FLASHDB_KEY_INDEX_ALL_PARAM);\n                break;\n            case FLASH_STORE_CMD_ERASE_PARAM:\n                // 先恢复出厂再写入flash，成功后系统复位\n                bsp_system_global_irq_disable(); // 禁用全局中断，防止参数初始化过程中运行任务异常\n                AppParamInit();     //应用层数据库初始化\n                MotorCtrlInit();    //控制层数据库初始化\n                flash_param_update();\n\n                bsp_flashdb_key_delete(FLASHDB_KEY_INDEX_TQ_FC_TABLE);\n                flashdb_status = bsp_flashdb_write(FLASHDB_KEY_INDEX_ALL_PARAM);\n\n                if (flashdb_status == FLASHDB_NO_ERR)\n                {\n                    bsp_system_reset();\n                }\n                bsp_system_global_irq_enable(); // 恢复失败，使能全局中断，允许其他任务执行\n                break;\n            // 错误记录相关\n            case FLASH_STORE_CMD_READ_ERROR:\n                flashdb_status = bsp_flashdb_read(FLASHDB_KEY_INDEX_ERROR_RECORD);\n\n                if (flashdb_status == FLASHDB_NO_ERR)\n                {\n                    for (uint16_t i = 0; i \u003c ERROR_RECORD_NUM; i++)\n                    {\n                        p_AppErrorRecordsList[i] = kFlashHistoricalInfo.Error_records_list[i];\n                    }\n                }\n                break;\n            case FLASH_STORE_CMD_WRITE_ERROR:\n                for (uint16_t i = 0; i \u003c ERROR_RECORD_NUM; i++)\n                {\n                    kFlashHistoricalInfo.Error_records_list[i] = p_AppErrorRecordsList[i];\n                }\n\n                flashdb_status = bsp_flashdb_write(FLASHDB_KEY_INDEX_ERROR_RECORD);\n                break;\n            case FLASH_STORE_CMD_ERASE_ERROR:\n                for (uint16_t i = 0; i \u003c ERROR_RECORD_NUM; i++)\n                {\n                    p_AppErrorRecordsList[i] = 0;\n                    kFlashHistoricalInfo.Error_records_list[i] = p_AppErrorRecordsList[i];\n                }\n\n                flashdb_status = bsp_flashdb_write(FLASHDB_KEY_INDEX_ERROR_RECORD);\n                break;\n            // 转矩摩擦补偿表相关\n            case FLASH_STORE_CMD_READ_TQ_FC:\n                flashdb_status = bsp_flashdb_read(FLASHDB_KEY_INDEX_TQ_FC_TABLE);\n                break;\n            case FLASH_STORE_CMD_WRITE_TQ_FC:\n                flashdb_status = bsp_flashdb_write(FLASHDB_KEY_INDEX_TQ_FC_TABLE);\n                break;\n            case FLASH_STORE_CMD_ERASE_TQ_FC:\n                flashdb_status = bsp_flashdb_key_delete(FLASHDB_KEY_INDEX_TQ_FC_TABLE);\n                break;\n            default:\n                flashdb_status = FLASHDB_PART_NOT_FOUND;\n                break;\n        }\n\n        if (flashdb_status != FLASHDB_NO_ERR)\n        {\n            set_app_Storage_status(FLASH_STORE_STATUS_ERROR);\n            sys_set_bsp_error_state(ERROR_FLASH_STORE, ERROR_SET);\n        }\n        else\n        {\n            set_app_Storage_status(FLASH_STORE_STATUS_SUCCESS);\n        }\n\n        set_app_Storage_cmd(FLASH_STORE_CMD_NULL);\n\n        //set_time_record_stop(9);\n    }\n}", "cut": false, "note": ""}, "motor_control/motor_ctl_loop.c:motor_ctl_test": {"file": "motor_control/motor_ctl_loop.c", "line": 718, "src": "static void motor_ctl_test(void)\n{\n    switch (kMotorCtlTestMode)\n    {\n    case 1: // 参数设置关联更新测试\n        motor_ctl_test_param_updata();\n        break;\n    case 2: // 安全保护模块参数设置\n        motor_ctl_test_security();\n        break;\n    case 3: // 电机控制状态机测试\n        motor_ctl_test_motor_ctl_sm();\n        break;\n\n    case 4: // 电气辨识模式\n        motor_ctl_test_elec_id_mode();\n        break;\n\n    case 5: // 方向辨识模式\n        motor_ctl_test_dir_id_mode();\n        break;\n\n    case 6: // 极对数辨识\n        motor_ctl_test_pole_pairs_id_mode();\n        break;\n    case 7: // 电角度辨识\n        motor_ctl_test_elec_angle_id_mode();\n        break;\n    case 8: // 机械特性辨识模式\n        motor_ctl_test_mec_id_mode();\n        break;\n\n    case 9: // 参数设置关联更新测试\n        motor_ctl_test_tp_fc_id_mode();\n        break;\n\n    case 10: // PT模式\n        motor_ctl_test_pt_mode();\n        break;\n    case 11: // PV模式\n        motor_ctl_test_pv_mode();\n        break;\n    case 12: // PP模式\n        motor_ctl_test_pp_mode();\n        break;\n\n    case 13: // MIT模式\n        motor_ctl_test_mit_mode();\n        break;\n    default:\n        break;\n    }\n}", "cut": false, "note": ""}}, "notesFile": "docs/calls-notes.md", "frame": {"nodes": [{"name": "上位机", "note": "调试软件", "icon": "user", "ext": false, "to": "", "outer": true}, {"name": "总线主站", "note": "PLC 或运动控制器", "icon": "user", "ext": false, "to": "", "outer": true}, {"name": "电机", "note": "真实电机", "icon": "spark", "ext": true, "to": "", "outer": true}, {"name": "模型、契约与工具", "note": "在电脑上设计模型、定义契约、生成代码，不在驱动器里运行", "icon": "", "ext": false, "to": "w3", "outer": false}, {"name": "硬件与运行平台", "note": "", "icon": "", "ext": false, "to": "w2", "outer": false}, {"name": "对外通信", "note": "", "icon": "", "ext": false, "to": "w1", "outer": false}, {"name": "伺服控制核心", "note": "", "icon": "", "ext": fa     links.forEach(function(e){var a=idx[e.a],b=idx[e.b];if(a==null||b==null)return;w[a+'>'+b]=e.n;use[a]=(use[a]||0)+e.n;used[b]=(used[b]||0)+e.n;maxN=Math.max(maxN,e.n);});

    if(per<2){per=2;NW=Math.floor((avail-PAD*2-GX)/2);}

    if(sepY)s+='<line class="rsep" x1="'+PAD+'" x2="'+(avail-PAD)+'" y1="'+sepY+'" y2="'+sepY+'"/><text class="rlone" x="'+PAD+'" y="'+(sepY+16)+'">'+esc(T.lone)+'</text>';

  // ---- what a unit is, in a few sentences; and its call chains ----

  function keepNote(k,v){try{if(v===inRepo(k))localStorage.removeItem(noteSlot(k));else localStorage.setItem(noteSlot(k),v);}catch(e){}}
  function unsaved(){return Object.keys(FNS).filter(function(k){var l=localNote(k);return l!=null&&l.trim()!==inRepo(k).trim();});}
  Object.keys(FNS).forEach(function(k){var l=localNote(k);if(l!=null&&l.trim()===inRepo(k).trim())keepNote(k,inRepo(k));}); // carried over since: no longer a draft
  function noteFile(keys){return keys.map(function(k){return '## '+k+'\n\n'+noteOf(k).trim()+'\n';}).join('\n');}
  function copyText(text,btn){function done(){var was=btn.textContent;btn.textContent=T.fnCopied;setTimeout(function(){btn.textContent=was;},1400);}
    function byHand(){var a=document.createElement('textarea');a.value=text;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');done();}catch(e){}document.body.removeChild(a);}
    try{navigator.clipboard.writeText(text).then(done,byHand);}catch(e){byHand();}}
  function md(t){var out=[],para=[],list=[],code=null; // a note is Markdown: paragraphs, lists, code, a little emphasis
    function inl(x){return esc(x).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}
    function endP(){if(para.length){out.push('<p>'+para.map(inl).join('<br>')+'</p>');para=[];}}
    function endL(){if(list.length){out.push('<ul>'+list.map(function(x){return '<li>'+inl(x)+'</li>';}).join('')+'</ul>');list=[];}}
    String(t).split('\n').forEach(function(line){
      if(/^\s*```/.test(line)){if(code==null){endP();endL();code=[];}else{out.push('<pre class="csig">'+esc(code.join('\n'))+'</pre>');code=null;}return;}
      if(code!=null){code.push(line);return;}
      var m=/^\s*(?:[-*]|\d+[.)])\s+(.*)$/.exec(line),h=/^\s*#{1,6}\s+(.*)$/.exec(line);
      if(m){endP();list.push(m[1]);}else if(h){endP();endL();out.push('<p><b>'+inl(h[1])+'</b></p>');}else if(!line.trim()){endP();endL();}else{endL();para.push(line);}});
    if(code!=null)out.push('<pre class="csig">'+esc(code.join('\n'))+'</pre>');endP();endL();return out.join('');}
  function noteState(k){var v=noteOf(k).trim();return !v?'':(v===inRepo(k).trim()?'<span class="nstate">'+f(T.fnSaved,{f:'<code>'+esc(D.notesFile)+'</code>'})+'</span>':'<span class="nstate local">'+T.fnLocal+'</span>');}

    var at=on.indexOf(i),prev=at>0?on[at-1]:null,next=at>=0&&at<on.length-1?on[at+1]:null,loc=s.file?esc(s.file)+(s.line?':'+s.line:''):'';

      '<div class="ctop"><span class="rk">'+no[i]+'</span><h3 class="fnh"><code>'+esc(s.name)+'()</code></h3>'+
      (u?'<button type="button" class="pchip cunit '+u.z+'" data-to="'+esc(s.unit)+'">'+pic(u.icon)+'<span>'+esc(u.name)+'</span></button>':'')+(loc?'<code class="cloc">'+loc+'</code>':'')+'</div>'+
      (s.what?'<p class="cwhat">'+rich(s.what)+'</p>':s.auto?'<p class="cwhat auto">'+T.chAutoNone+'<span class="tagx">'+T.chAuto+'</span></p>':'')+(s.more&&s.more.length?'<div class="cmore">'+s.more.map(function(x){return '<p>'+rich(x)+'</p>';}).join('')+'</div>':'')+
      (s.sig?'<code class="csig">'+esc(s.sig)+'</code>':'')+ioTable(s)+

          :'<div class="empty">'+T.fnNoSrc+(loc?' <code>'+loc+'</code>':'')+'</div>')+'</div>'+

        '<textarea class="nedit" id="note-edit" data-key="'+esc(s.key)+'" placeholder="'+esc(T.fnPh)+'">'+esc(noteOf(s.key))+'</textarea>'+
        '<div class="nview" id="note-view">'+(noteOf(s.key).trim()?md(noteOf(s.key)):'<span class="sub">'+T.fnEmpty+'</span>')+'</div>'+

  // One card a function, in the colour of the part its file belongs to. A fork is a row of cases to pick from.
  function chainCards(c,ci){
    var h='<div class="csteps">',no=fnNo(c);
    function rails(d){var at=[];for(var k=0;k<d;k++)at.push('calc('+k+'*var(--ind) + 11px) 0');
      return at.length?'background-image:'+at.map(function(){return 'linear-gradient(var(--muted),var(--muted))';}).join(',')+';background-position:'+at.join(',')+';background-size:1.5px 100%;':'';}
    c.steps.forEach(function(s,i){
      if(s.kind==='branch'||!shown(ci,s))return;
      if(s.kind==='case'){ // the first case of a fork draws the fork: what varies, and the cases to pick from
        if(s.group!==i)return;
        var up=c.steps[s.up],lab=up&&up.kind==='branch'?up:null,sel=pickOf(ci,i),cur=c.steps[sel];
        var ways=[];c.steps.forEach(function(x,k){if(x.kind==='case'&&x.group===i)ways.push(k);});
        h+='<div class="crow'+(s.d?' sub':'')+'" style="--d:'+s.d+';'+rails(s.d)+'"><div class="cfork"><div class="cforkh">'+ic('fork')+'<b>'+T.chFork+esc(lab?lab.what:'')+'</b>'+(lab&&lab.note?'<span>'+rich(lab.note)+'</span>':'')+
          '<span class="sub">'+f(T.chWays,{n:ways.length})+'</span></div>'+(lab&&lab.more.length?'<div class="cmore">'+lab.more.map(function(x){return '<p>'+rich(x)+'</p>';}).join('')+'</div>':'')+
          '<div class="rchips">'+ways.map(function(k){return '<button type="button" data-ccase="'+k+'" aria-pressed="'+(k===sel)+'">'+esc(c.steps[k].what)+'</button>';}).join('')+'</div>'+
          (cur.note||cur.more.length?'<div class="cmore">'+(cur.note?'<p>'+rich(cur.note)+'</p>':'')+cur.more.map(function(x){return '<p>'+rich(x)+'</p>';}).join('')+'</div>':'')+
          (c.steps.some(function(x){return x.up===sel;})?'':'<div class="fkey">'+T.chNoStep+'</div>')+'</div></div>';
        return;}
      var u=s.unit?byId(s.unit):null;
      var warn=[];if(s.state==='lost')warn.push(T.chLost);if(s.state==='many')warn.push(T.chMany);if(s.loose)warn.push(T.chLoose);
      var loc=s.file?esc(s.file)+(s.line?':'+s.line:''):'';
      var ran=s.ran?'<details><summary>'+T.chRan+'</summary><div><div class="fkey">'+f(T.chRanH,{d:esc(s.ran.recorded||'?'),r:esc(s.ran.route)})+'</div><div class="rvals"><span class="h">'+T.runDir+'</span><span class="h">'+T.runName+'</span><span class="h">'+T.runCol+'</span>'+
        s.ran.ins.map(function(v){return [T.runIn,v];}).concat(s.ran.outs.map(function(v){return [T.runOut,v];})).map(function(x){return '<span class="d">'+x[0]+'</span><span>'+esc(x[1].name)+'</span><span class="v">'+esc(x[1].value)+'</span>';}).join('')+'</div></div></details>':'';
      h+='<div class="crow'+(s.d?' sub':'')+(s.loose?' loose':'')+'" style="--d:'+s.d+';'+rails(s.d)+'"><div class="cstep '+(u?u.z:'zx')+'" id="cstep-'+i+'">'+
        '<div class="ctop"><span class="rk">'+no[i]+'</span><code class="cfn">'+esc(s.name)+'()</code>'+
        (u?'<button type="button" class="pchip cunit '+u.z+'" data-to="'+esc(s.unit)+'">'+pic(u.icon)+'<span>'+esc(u.name)+'</span></button>':'')+
        (loc?'<code class="cloc">'+loc+'</code>':'')+
        (s.key?'<button type="button" class="nbtn'+(noteOf(s.key).trim()?' has':'')+'" data-fnopen="'+i+'">'+(noteOf(s.key).trim()?T.fnNote:T.fnNoteOpen)+'</button>':'')+'</div>'+
        (s.what?'<p class="cwhat">'+rich(s.what)+'</p>':s.auto?'<p class="cwhat auto">'+(s.doc?esc(s.doc):T.chAutoNone)+'<span class="tagx">'+T.chAuto+'</span></p>':'')+
        (s.more&&s.more.length?'<div class="cmore">'+s.more.map(function(x){return '<p>'+rich(x)+'</p>';}).join('')+'</div>':'')+
        (s.sig?'<code class="csig'+(s.key?' open':'')+'"'+(s.key?' data-fnopen="'+i+'" role="button" tabindex="0" title="'+esc(T.fnNoteOpen)+'"':'')+'>'+esc(s.sig)+'</code>':'')+
        ioTable(s)+
        (warn.length?'<div class="runwarn">'+warn.join(T.sep)+'</div>':'')+
        (s.cands&&s.cands.length?'<div class="rloc">'+s.cands.map(function(x){return '<code>'+esc(x)+'</code>';}).join('')+'</div>':'')+
        (s.state==='text'?'<div class="fkey">'+T.chText+'</div>':'')+
        (s.doc&&!s.auto?'<details><summary>'+T.chDoc+'</summary><div><p class="cmore">'+esc(s.doc)+'</p></div></details>':'')+ran+
        '</div></div>';});
    return h+'</div>'+(c.more?'<div class="fkey">'+f(T.chMore,{n:c.more})+'</div>':'')+(c.passed?'<div class="fkey">'+f(T.chPassed,{n:c.passed})+'</div>':'')+'<div class="fkey">'+T.chCap+(c.forks?' '+T.chForkCap:'')+(c.file?' '+f(T.chFile,{f:'<code>'+esc(c.file)+'</code>'}):'')+'</div>';}
  function drawCalls(){var box=$('alt');
    if(!CHAINS.length){box.innerHTML='<div class="empty">'+T.chNone+'</div><div class="ask" style="margin-top:12px">'+T.chAskAny+'<span class="say">'+esc(T.chSayAny)+'</span></div>';return;}
    if(curChain>=CHAINS.length)curChain=0;
    var c=CHAINS[curChain],ci=curChain;
    box.innerHTML='<div class="cv"><div class="cvlist">'+CHAINS.map(function(x,i){
      return '<button type="button" class="cvpick" data-chain="'+i+'" aria-pressed="'+(i===curChain)+'"><span class="cvn">'+esc(chainName(i))+'</span><span class="cvm">'+f(T.chMeta1,{n:x.n})+(x.forks?T.sep+f(T.chForks,{n:x.forks}):'')+
        '<span class="tpics">'+x.units.map(byId).filter(function(u){return u;}).slice(0,6).map(function(u){return '<span class="pic '+u.z+'">'+ic(u.icon)+'</span>';}).join('')+'</span></span></button>';}).join('')+
      (unsaved().length?'<button type="button" class="cvpick" data-ncopyall><span class="cvn">'+f(T.fnCopyAll,{n:unsaved().length})+'</span><span class="cvm">'+T.fnLocal+'</span></button>':'')+
      '</div><div class="cvmain">'+(curFn!=null&&c.steps[curFn]&&c.steps[curFn].kind==='fn'?fnPage(c,ci,curFn):chainHead(c,ci)+chainTree(c,ci)+chainCards(c,ci))+'</div></div>';
    wire(box);
    Array.prototype.forEach.call(box.querySelectorAll('[data-fnopen]'),function(b){function go(){curFn=+b.getAttribute('data-fnopen');setHash('c'+ci+'n'+curFn);drawCalls();$('viewbar').scrollIntoView({block:'start'});}
      b.addEventListener('click',go);if(b.tagName!=='BUTTON')b.addEventListener('keydown',function(ev){if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();go();}});});
    Array.prototype.forEach.call(box.querySelectorAll('[data-fnback]'),function(b){b.addEventListener('click',function(){var i=+b.getAttribute('data-fnback');curFn=null;setHash('c'+ci);drawCalls();jump(i);});});
    Array.prototype.forEach.call(box.querySelectorAll('[data-ncopy]'),function(b){b.addEventListener('click',function(){copyText(noteFile([b.getAttribute('data-ncopy')]),b);});});
    Array.prototype.forEach.call(box.querySelectorAll('[data-ncopyall]'),function(b){b.addEventListener('click',function(){copyText(noteFile(unsaved()),b.querySelector('.cvn')||b);});});
    var ed=$('note-edit');if(ed)ed.addEventListener('input',function(){var k=ed.getAttribute('data-key');keepNote(k,ed.value);
      $('note-view').innerHTML=ed.value.trim()?md(ed.value):'<span class="sub">'+T.fnEmpty+'</span>';$('note-state').innerHTML=noteState(k);
      var all=$('note-all'),n=unsaved().length;if(all){all.hidden=!n;all.textContent=f(T.fnCopyAll,{n:n});}});
    function reveal(i){var m=picked[ci]=picked[ci]||{},s=c.steps[i]; // pick every case that leads to this line
      s.cases.concat(s.kind==='case'?[i]:[]).forEach(function(a){m[c.steps[a].group]=a;});}
    function jump(i){var card=$('cstep-'+i);if(!card)return;card.scrollIntoView({block:'center',behavior:'smooth'});card.classList.add('flash');setTimeout(function(){card.classList.remove('flash');},1200);}
    Array.prototype.forEach.call(box.querySelectorAll('[data-chain]'),function(b){b.addEventListener('click',function(){curChain=+b.getAttribute('data-chain');curFn=null;setHash('c'+curChain);drawCalls();});});

  function setView(v){view=v;views.forEach(function(x){$('view-'+x[0]).setAttribute('aria-pressed',String(x[0]===v));if(x[0]===v)$('vcap').textContent=x[2];});

    if(view==='calls'){drawCalls();return;}

  var landed={}; // what is lit just now: files per part, for the uncommitted work, a task or one commit
  function light(map,sel,wins){ // with a room picked, the map marks its companions; otherwise it lights where work landed
    var any=Object.keys(map).length>0,was=JSON.stringify(landed);landed=sel?{}:map;
    D.parts.forEach(function(p){
      var r=rooms[p.name],on=Object.prototype.hasOwnProperty.call(map,p.name);
      r.classList.toggle('lit',on&&!sel);r.classList.toggle('mate',on&&!!sel);r.classList.toggle('sel',p.name===sel);
      r.classList.toggle('dim',!sel&&any&&!on);

  function home(k){

  // A part nobody has drawn yet still has a picture: who uses it and whom it uses, taken from the measured links.
  function around(u,links,find){
    var ins={},outs={},names=[];
    links.forEach(function(x){if(x.a===u.name&&find(x.b))outs[x.b]=x.n;if(x.b===u.name&&find(x.a))ins[x.a]=x.n;});
    Object.keys(ins).concat(Object.keys(outs)).forEach(function(k){if(names.indexOf(k)<0)names.push(k);});
    if(!names.length)return null;
    function size(k){return Math.max(ins[k]||0,outs[k]||0);}
    names.sort(function(x,y){return size(y)-size(x);});
    var left=[],right=[],edges=[];
    names.forEach(function(k){var user=(ins[k]||0)>=(outs[k]||0),side=user?left:right;if(side.length>=4)return;side.push({name:k,note:'',icon:'',ext:false});

  function flowBlock(u,links,find){

  function wiredIn(flow,n){return flow.edges.some(function(e){return e.a===n.name||e.b===n.name;});}
  // Can the diagram be drawn as one opened box, with what it connects to standing at the two ends? Not when its

  function opens(flow){var out={};flow.nodes.forEach(function(n){if(n.outer)out[n.name]=1;});

  function chips(list,attr){return '<div class="pals">'+list.slice(0,8).map(function(x){
